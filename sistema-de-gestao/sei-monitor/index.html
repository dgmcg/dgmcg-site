<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEI Monitor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2226%22%20fill%3D%22%230046A3%22/%3E%3Ctext%20x%3D%2264%22%20y%3D%2276%22%20font-family%3D%22Arial%2C%20Helvetica%2C%20sans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2256%22%20fill%3D%22%23FFFFFF%22%20text-anchor%3D%22middle%22%20letter-spacing%3D%22-2%22%3ESM%3C/text%3E%3Cpath%20d%3D%22M24%2098h20l6-11%209%2020%208-16%205%207h32%22%20fill%3D%22none%22%20stroke%3D%22%23F2A900%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<style>
  :root {
    --primary:#1a56db; --primary-dark:#1e429f;
    --bg:#f3f4f6; --card:#fff; --border:#e5e7eb;
    --text:#111827; --muted:#6b7280;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }

  /* LOGIN */
  #login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh;
    background:linear-gradient(135deg,#1e3a5f,#1a56db); }
  .login-card { background:#fff; border-radius:14px; padding:36px; width:340px;
    box-shadow:0 20px 60px rgba(0,0,0,.2); }
  .login-card h2 { text-align:center; margin-bottom:4px; font-size:1.3rem; }
  .login-card .subtitle { text-align:center; color:var(--muted); font-size:.82rem; margin-bottom:22px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:.82rem; font-weight:500; margin-bottom:5px; }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:9px 12px; border:1px solid var(--border);
    border-radius:6px; font-size:.9rem; font-family:inherit; }
  .form-group textarea { resize:vertical; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; display:flex;
    align-items:center; justify-content:center; padding:16px; }
  .modal { background:#fff; border-radius:12px; max-width:460px; width:100%; max-height:90vh;
    overflow-y:auto; padding:24px; }
  .modal.modal-largo { max-width:680px; }
  .modal h3 { margin-bottom:16px; font-size:1.05rem; }
  .chip-fluxo { display:inline-block; font-size:.72rem; padding:1px 8px; border-radius:10px; margin-left:6px; }
  .chip-setor { background:#f0f9ff; color:#075985; }
  .chip-imp { background:#fff7ed; color:#9a3412; }
  .chip-modelo { background:#f5f3ff; color:#5b21b6; }
  .desc-etapa { border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin:6px 0 12px; flex:1 1 100%; }
  .desc-etapa > summary { cursor:pointer; font-size:.82rem; font-weight:600; }
  .desc-etapa .form-group { margin-top:10px; margin-bottom:0; }
  .setores-lista { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .setores-lista label { font-weight:400; display:inline-flex; align-items:center; gap:4px; margin:0; }
  .setores-lista input { width:auto; }
  .dica-fluxo { font-size:.74rem; color:var(--muted); margin-top:4px; }
  .dsp-barra { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 6px; }
  .dsp-pop { border:1px solid #c7d2fe; background:#eef2ff; border-radius:8px; padding:10px; margin-bottom:6px; font-size:.82rem; }
  .dsp-pop input, .dsp-pop select { font-size:.82rem; }
  .dsp-dica { color:var(--muted); font-size:.74rem; }
  .dsp-opcoes { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
  .dsp-op { border:1px solid #c7d2fe; background:#fff; border-radius:14px; padding:3px 10px; cursor:pointer; font-size:.78rem; }
  .dsp-op:hover { background:#e0e7ff; }
  .dsp-linha { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
  .dsp-linha input { flex:1 1 240px; }
  .dsp-previa { background:#fff; border:1px solid #e5e7eb; border-radius:6px; padding:8px 14px; margin:8px 0; font-family:Calibri, Arial, sans-serif; font-size:.9rem; max-height:320px; overflow:auto; }
  .dsp-previa p.Texto_Justificado { text-align:justify; margin:6px 0; }
  .dsp-erro { color:#b91c1c; font-size:.76rem; margin-top:4px; }
  .dsp-ok { color:#15803d; font-size:.76rem; margin-top:4px; }
  .dsp-aviso { color:#92400e; font-size:.74rem; margin-top:2px; }
  .modal-actions { display:flex; gap:8px; margin-top:6px; }
  .modal-actions .btn { flex:1; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px;
    border-radius:6px; border:none; cursor:pointer; font-size:.87rem; font-weight:500;
    background:var(--primary); color:#fff; }
  .btn:hover { background:var(--primary-dark); }
  .btn:disabled { opacity:.6; cursor:not-allowed; }
  .btn-full { width:100%; }
  .btn-sm { padding:6px 12px; font-size:.8rem; }
  .btn-secondary { background:#e5e7eb; color:#374151; }
  .btn-secondary:hover { background:#d1d5db; }
  .btn-danger { background:#dc2626; color:#fff; }
  .btn-danger:hover { background:#b91c1c; }
  .btn-link { background:none; border:none; color:var(--primary); font-size:.75rem; cursor:pointer;
    padding:0; margin-left:10px; text-decoration:underline; }
  .erro-msg { color:#dc2626; font-size:.8rem; margin-top:10px; text-align:center; }

  /* APP */
  #app { display:none; }
  #topbar { background:#fff; border-bottom:1px solid var(--border); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; }
  #topbar h1 { font-size:1.1rem; }
  #topbar h1 span { color:var(--primary); }
  #topbar .user-box { font-size:.82rem; color:var(--muted); display:flex; align-items:center; gap:12px; }
  #topbar button { background:none; border:1px solid var(--border); border-radius:6px; padding:6px 12px;
    cursor:pointer; font-size:.8rem; color:var(--muted); }
  #content { padding:24px; max-width:1000px; margin:0 auto; }

  /* NOTAS PENDENTES (banner) */
  #pendentes-banner { background:#fff7ed; border:1px solid #fdba74; border-radius:10px;
    padding:14px 18px; margin-bottom:16px; }
  .pendentes-header { font-weight:700; color:#c2410c; font-size:.85rem; margin-bottom:8px; }
  .pendente-item { font-size:.83rem; padding:6px 0; border-top:1px solid #fed7aa; cursor:pointer; color:#7c2d12; }
  .pendente-item:hover { text-decoration:underline; }

  /* LISTA */
  .proc-list { background:var(--card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .proc-row { display:flex; flex-direction:column; gap:3px; padding:12px 16px; border-bottom:1px solid var(--border);
    cursor:pointer; font-size:.85rem; text-align:left; }
  .proc-row:last-child { border-bottom:none; }
  .proc-row:hover { background:#f9fafb; }
  .proc-row-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; text-align:left; }
  .proc-row-badges { display:flex; gap:6px; flex-shrink:0; }
  .sei-num { font-size:.72rem; color:var(--muted); font-weight:600; text-align:left; }
  .proc-titulo { font-weight:600; text-align:left; }
  .proc-meta-linha { font-size:.76rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; text-align:left; }
  .proc-meta-linha.proc-situacao, .proc-meta-linha.proc-mov { -webkit-line-clamp:2; }
  .proc-meta-linha b { color:#4b5563; }
  select.badge-select { -webkit-appearance:auto; appearance:auto; border:none; cursor:pointer;
    font-size:.72rem; font-weight:600; padding:3px 6px; border-radius:20px; font-family:inherit; }
  .badge { font-size:.72rem; font-weight:600; padding:3px 9px; border-radius:20px; display:inline-block; }
  .badge-Baixa { background:#dcfce7; color:#166534; }
  .badge-Média { background:#fef9c3; color:#854d0e; }
  .badge-Alta { background:#fee2e2; color:#991b1b; }
  .badge-Máxima { background:#7c3aed; color:#fff; }
  .badge-status { background:#e5e7eb; color:#374151; }

  /* DETALHE */
  #view-detalhe { display:none; }
  #view-config { display:none; }

  .config-secao { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:16px; }
  .config-secao h3 { font-size:.95rem; margin-bottom:12px; }
  .config-lista { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .config-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px;
    background:var(--bg); border-radius:6px; font-size:.84rem; }
  .config-item .item-info b { font-weight:600; }
  .config-item .item-info small { color:var(--muted); margin-left:6px; }
  .config-item button { background:none; border:none; color:#dc2626; cursor:pointer; font-size:.9rem; padding:2px 6px; }
  .config-form { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .config-form .form-group { flex:1; min-width:140px; margin-bottom:0; }
  .config-form .btn { flex-shrink:0; }
  .voltar-btn { margin-bottom:14px; }
  .detalhe-header { background:#fff; border:1px solid var(--border); border-radius:10px 10px 0 0;
    padding:20px; }
  .detalhe-header .sei-num { margin-bottom:2px; }
  .detalhe-header h2 { font-size:1.15rem; margin:2px 0 10px; }
  .badges-row { display:flex; gap:6px; }
  .situacao-box { background:linear-gradient(135deg,#1e3a5f,#1a2e4a); color:#e2f0ff; padding:14px 20px;
    font-size:.92rem; line-height:1.5; }
  .info-grid { background:#fff; border-left:1px solid var(--border); border-right:1px solid var(--border);
    padding:14px 20px; font-size:.82rem; color:var(--muted); display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:6px; }
  .secao { background:#fff; border:1px solid var(--border); border-top:none; padding:16px 20px; }
  .secao:last-child { border-radius:0 0 10px 10px; }
  .secao-titulo { font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); margin-bottom:10px; }
  #nova-nota-texto { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:6px;
    font-size:.85rem; font-family:inherit; resize:vertical; }
  .nota-opcoes { display:flex; align-items:center; justify-content:space-between; margin-top:8px; gap:10px; }
  .nota-opcoes label { font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:6px; }

  #resumo-colar-texto { width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:6px;
    font-size:.82rem; font-family:inherit; resize:vertical; }
  .resumo-card { font-size:.85rem; line-height:1.55; }
  .resumo-situacao { background:linear-gradient(135deg,#1e3a5f,#1a2e4a); color:#e2f0ff; padding:10px 14px;
    border-radius:8px; margin-bottom:10px; }
  .resumo-bloco { margin-bottom:10px; color:#374151; }
  .resumo-alerta { border-left:3px solid; border-radius:0 6px 6px 0; padding:8px 12px; margin-bottom:10px; }
  .resumo-alerta b { display:block; font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }
  .resumo-alerta ul { margin:0; padding-left:18px; }
  .resumo-alerta li { margin-bottom:3px; }
  .resumo-critico { background:#fef2f2; border-color:#dc2626; color:#7f1d1d; }
  .resumo-sugestao { background:#f0fdf4; border-color:#16a34a; color:#14532d; }
  .resumo-evolucao { margin-top:8px; display:flex; flex-direction:column; gap:8px; }
  .evolucao-item { background:#f9fafb; border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:.82rem; }
  .evolucao-item b { display:block; margin-bottom:2px; }
  .picker-similar-item { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--border); font-size:.82rem; }

  .checklist-lista { display:flex; flex-direction:column; gap:6px; }
  .checklist-item { font-size:.84rem; padding:6px 10px; border-radius:6px; background:#f9fafb;
    display:flex; align-items:center; gap:8px; }
  .checklist-item.concluida { color:#166534; }
  .checklist-item.concluida span { color:#16a34a; font-weight:700; }
  .checklist-item.pendente { color:#374151; }
  .checklist-item.pendente span { color:#9ca3af; }

  .anotacao-item { padding:10px 12px; border-left:3px solid #a78bfa; background:#faf5ff; border-radius:0 6px 6px 0;
    margin-bottom:8px; }
  .anotacao-item.nota-rapida { border-left-color:#f59e0b; background:#fffbeb; }
  .anotacao-item.nota-rapida.resolvida { border-left-color:#22c55e; background:#f0fdf4; opacity:.75; }
  .tag-nota { font-size:.7rem; font-weight:700; display:block; margin-bottom:4px; }
  .anot-texto { font-size:.85rem; margin-bottom:4px; }
  .anot-meta { font-size:.72rem; color:var(--muted); }

  /* RESUMO VISUAL DO DASHBOARD */
  .resumo-box { background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:18px 20px; margin-bottom:16px; }
  .resumo-topo { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .resumo-total { font-size:.82rem; color:var(--muted); }
  .resumo-total b { color:var(--text); font-size:1.05rem; }
  .resumo-limpar { font-size:.75rem; color:var(--primary); cursor:pointer; text-decoration:underline; display:none; }
  .status-bar { display:flex; height:28px; border-radius:6px; overflow:hidden; margin-bottom:10px;
    background:#f1f5f9; }
  .status-seg { display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700;
    color:#fff; cursor:pointer; transition:opacity .15s; min-width:2px; }
  .status-seg:hover { opacity:.85; }
  .status-seg.inativo { opacity:.35; }
  .status-legenda { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px; }
  .legenda-item { display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--muted); cursor:pointer; }
  .legenda-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .legenda-item.ativo { color:var(--text); font-weight:600; }
  .tipo-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .tipo-chip { font-size:.75rem; padding:5px 11px; border-radius:20px; background:#f3f4f6; color:#374151;
    cursor:pointer; border:1px solid transparent; }
  .tipo-chip:hover { background:#e5e7eb; }
  .tipo-chip.ativo { background:#eff6ff; border-color:#93c5fd; color:#1e40af; font-weight:600; }
  .tipo-chip .qtd { color:var(--muted); margin-left:4px; }
  .tipo-chip.ativo .qtd { color:#3b82f6; }

  /* JORNADA DE ETAPAS (checklist como caminho) */
  .jornada { display:flex; flex-wrap:wrap; row-gap:28px; padding:10px 6px 4px; }
  .jornada-etapa { flex:1 1 90px; min-width:84px; max-width:140px; position:relative; text-align:center; }
  .jornada-etapa:not(:last-child)::after {
    content:''; position:absolute; top:19px; left:calc(50% + 20px); width:calc(100% - 20px);
    height:2px; background:var(--border); z-index:0;
  }
  .jornada-etapa.concluida:not(:last-child)::after { background:#16a34a; }
  .jornada-circulo { width:38px; height:38px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; margin:0 auto 8px; position:relative; z-index:1; font-weight:700; font-size:.85rem;
    border:2px solid var(--border); background:#fff; color:var(--muted); }
  .jornada-etapa.concluida .jornada-circulo { background:#16a34a; border-color:#16a34a; color:#fff; }
  .jornada-etapa.atual .jornada-circulo { border-color:var(--primary); color:var(--primary);
    box-shadow:0 0 0 4px rgba(26,86,219,.14); animation:pulso-atual 1.8s ease-out 1; }
  @keyframes pulso-atual {
    0% { box-shadow:0 0 0 0 rgba(26,86,219,.35); }
    100% { box-shadow:0 0 0 4px rgba(26,86,219,.14); }
  }
  .jornada-grafo { overflow-x:auto; padding:6px 0 4px; }
  .jornada-grafo-in { position:relative; }
  .jornada-linhas { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0; }
  .jornada-cols { position:relative; z-index:1; display:grid; align-items:center; justify-items:center; row-gap:22px; }
  .jornada-cel { display:flex; flex-direction:column; align-items:center; gap:22px; width:100%; }
  .jornada-grafo .jornada-etapa { flex:none; width:100%; max-width:140px; }
  .jornada-grafo .jornada-etapa::after { display:none !important; }
  .jornada-etapa.bloqueada .jornada-circulo { border-style:dashed; border-color:#d97706; color:#d97706; }
  .jornada-etapa.bloqueada .jornada-label { color:#b45309; }
  .jornada-espera { font-size:.68rem; line-height:1.3; color:#b45309; margin-top:3px; }
  .jornada-label { font-size:.71rem; line-height:1.3; color:var(--text); max-width:118px; margin:0 auto; }
  .jornada-etapa.concluida .jornada-label { color:#166534; }
  .jornada-doc { font-size:.68rem; line-height:1.3; color:#166534; font-weight:600; margin-top:3px; word-break:break-all; }
  .jornada-etapa.atual .jornada-label { color:var(--primary); font-weight:600; }


  .detalhe-tabs { display:flex; gap:6px; background:#fff; border-left:1px solid var(--border);
    border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:0 20px; }
  .detalhe-tab-btn { background:none; border:none; cursor:pointer; font-size:.84rem; font-weight:600;
    color:var(--muted); padding:12px 6px; margin-bottom:-1px; border-bottom:2px solid transparent; }
  .detalhe-tab-btn.ativa { color:var(--primary); border-bottom-color:var(--primary); }
  .unidade-bloco { margin-bottom:18px; }
  .unidade-bloco-titulo { font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); margin-bottom:8px; }
  .unidade-item { padding:10px 0; border-bottom:1px solid #f3f4f6; font-size:.84rem; cursor:pointer; }
  .unidade-item:hover { background:#f9fafb; }
  .unidade-item b { display:block; color:#111827; }
  .unidade-item .unidade-objeto { color:#374151; margin-top:2px; }
  .unidade-item .unidade-situacao { color:var(--muted); font-size:.76rem; margin-top:2px; }

  .text-muted { color:var(--muted); font-size:.85rem; padding:20px; text-align:center; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--border);
    border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ALERTA/SLA DE VERIFICAÇÃO (pulsação de borda por prioridade) */
  @keyframes sm-pulso-leve { 0%, 100% { box-shadow:0 0 0 0 transparent; } 50% { box-shadow:0 0 0 3px var(--cor-alerta,#999); } }
  @keyframes sm-pulso-forte { 0%, 100% { box-shadow:0 0 0 0 transparent; } 50% { box-shadow:0 0 0 6px var(--cor-alerta,#999); } }
  .proc-row.sm-alerta-proximo { animation:sm-pulso-leve 2.4s ease-in-out infinite; border-left:3px solid var(--cor-alerta,#e5e7eb); }
  .proc-row.sm-alerta-atrasado { animation:sm-pulso-forte 1s ease-in-out infinite; border-left:3px solid var(--cor-alerta,#e5e7eb); }
  .proc-countdown { font-size:.76rem; font-weight:600; }

  /* ABAS DA LISTA GERAL (em acompanhamento x finalizados) */
  .lista-tabs { display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--border); }
  .lista-tab-btn { background:none; border:none; cursor:pointer; font-size:.86rem; font-weight:600;
    color:var(--muted); padding:10px 4px; margin-bottom:-1px; border-bottom:2px solid transparent; }
  .lista-tab-btn.ativa { color:var(--primary); border-bottom-color:var(--primary); }

  /* CALENDÁRIO DA SEMANA ÚTIL */
  .sm-calendario { display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
  .sm-cal-dia-wrap { background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .sm-cal-dia { width:100%; display:flex; justify-content:space-between; align-items:center;
    background:none; border:none; cursor:pointer; padding:12px 16px; font-size:.84rem; font-weight:600; color:var(--text); }
  .sm-cal-dia.sm-cal-hoje { background:#eff6ff; color:var(--primary); }
  .sm-cal-contagem { background:#e5e7eb; color:#374151; border-radius:10px; padding:2px 9px; font-size:.74rem; min-width:20px; text-align:center; }
  .sm-cal-dia.sm-cal-hoje .sm-cal-contagem { background:var(--primary); color:#fff; }

  async function api(caminho, payload) {
    const { data: sessao } = await supa.auth.getSession();
    const token = sessao?.session?.access_token;
    if (!token) { fazerLogout(); throw new Error('Sessão expirada.'); }

    const opcoes = {
      headers: { Authorization: `Bearer ${token}`, apikey: SUPABASE_ANON_KEY },
    };
    let url = `${API_URL}/${caminho}`;
    if (payload) {
      opcoes.method = 'POST';
      opcoes.headers['Content-Type'] = 'application/json';
      opcoes.body = JSON.stringify(payload);
    }
    const res = await fetch(url, opcoes);
    return res.json();
  }

  // ==================== DASHBOARD (resumo visual + lista filtrável) ====================
  const CORES_STATUS = {
    'Em andamento': '#1a56db',
    'Aguardando': '#d97706',
    'Concluído': '#16a34a',
    'Suspenso': '#6b7280',
  };
  const STATUS_ATIVOS = ['Aguardando', 'Em andamento'];
  // Prazo de verificação por prioridade, em HORAS ÚTEIS (sábado e domingo
  // inteiros não contam — ver somarHorasUteis). Só vale pra "Aguardando"/
  // "Em andamento"; Concluído/Suspenso não têm prazo — ficam na aba "Finalizados".
  // Expediente considerado para a contagem: 08h-12h e 13h-17h (8h úteis/dia),
  // segunda a sexta. Alta/Média/Baixa equivalem a 2/4/7 dias úteis desse
  // expediente (2×8, 4×8, 7×8); Máxima é uma janela de atenção imediata
  // dentro do próprio expediente, não um múltiplo de dia, por isso não escala.
  const HORAS_SLA_PRIORIDADE = { 'Máxima': 2, 'Alta': 16, 'Média': 32, 'Baixa': 56 };
  const EXPEDIENTE_MANHA = [8, 12];
  const EXPEDIENTE_TARDE = [13, 17];
  const CORES_PRIORIDADE = { 'Baixa': '#16a34a', 'Média': '#d97706', 'Alta': '#dc2626', 'Máxima': '#7c3aed' };
  const NOMES_DIA_SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  let todosProcessos = [];
  let filtroStatus = null;
  let filtroTipo = null;
  let abaListaAtiva = 'ativos';
  let filtroMarcaSite = null;   // null | 'fav' | 'standby'
  let _intervaloVivoSite = null;

  function pararAtualizacaoVivoSite() {
    if (_intervaloVivoSite) { clearInterval(_intervaloVivoSite); _intervaloVivoSite = null; }
  }

  function inicioProximoDiaUtil(d) {
    let nd = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, EXPEDIENTE_MANHA[0], 0, 0, 0);
    if (nd.getDay() === 6) nd = new Date(nd.getFullYear(), nd.getMonth(), nd.getDate() + 2, EXPEDIENTE_MANHA[0], 0, 0, 0);
    else if (nd.getDay() === 0) nd = new Date(nd.getFullYear(), nd.getMonth(), nd.getDate() + 1, EXPEDIENTE_MANHA[0], 0, 0, 0);
    return nd;
  }

  // Soma horas de expediente real (08h-12h e 13h-17h, seg a sex) a partir de
  // um instante — fora do expediente (madrugada, almoço, fim de semana) o
  // relógio não corre; ao entrar numa dessas janelas, a contagem recomeça no
  // início do próximo expediente disponível.
  function somarHorasUteis(inicioISO, horas) {
    let atual = new Date(inicioISO);
    let restanteMs = horas * 3600000;
    let trava = 0;
    while (restanteMs > 0 && trava++ < 5000) {
      const dia = atual.getDay();
      if (dia === 6) { atual = new Date(atual.getFullYear(), atual.getMonth(), atual.getDate() + 2, EXPEDIENTE_MANHA[0], 0, 0, 0); continue; }
      if (dia === 0) { atual = new Date(atual.getFullYear(), atual.getMonth(), atual.getDate() + 1, EXPEDIENTE_MANHA[0], 0, 0, 0); continue; }
      const h = atual.getHours() + atual.getMinutes() / 60 + atual.getSeconds() / 3600;
      if (h < EXPEDIENTE_MANHA[0]) { atual = new Date(atual.getFullYear(), atual.getMonth(), atual.getDate(), EXPEDIENTE_MANHA[0], 0, 0, 0); continue; }
      if (h >= EXPEDIENTE_MANHA[1] && h < EXPEDIENTE_TARDE[0]) { atual = new Date(atual.getFullYear(), atual.getMonth(), atual.getDate(), EXPEDIENTE_TARDE[0], 0, 0, 0); continue; }
      if (h >= EXPEDIENTE_TARDE[1]) { atual = inicioProximoDiaUtil(atual); continue; }
      const fimSegmento = h < EXPEDIENTE_MANHA[1]
        ? new Date(atual.getFullYear(), atual.getMonth(), atual.getDate(), EXPEDIENTE_MANHA[1], 0, 0, 0)
        : new Date(atual.getFullYear(), atual.getMonth(), atual.getDate(), EXPEDIENTE_TARDE[1], 0, 0, 0);
      const msAteFim = fimSegmento - atual;
      if (msAteFim >= restanteMs) { atual = new Date(atual.getTime() + restanteMs); restanteMs = 0; }
      else { restanteMs -= msAteFim; atual = fimSegmento; }
    }
    return atual;
  }

  function proximaVerificacao(proc) {
    if (!STATUS_ATIVOS.includes(proc.status) || !proc.data_ultima_verificacao) return null;
    const horas = HORAS_SLA_PRIORIDADE[proc.prioridade] || 96;
    return somarHorasUteis(proc.data_ultima_verificacao, horas);
  }

  function formatarDuracao(ms) {
    const min = Math.round(Math.abs(ms) / 60000);
    const dias = Math.floor(min / 1440);
    const horasR = Math.floor((min % 1440) / 60);
    const minR = min % 60;
    const partes = [];
    if (dias) partes.push(`${dias}d`);
    if (horasR) partes.push(`${horasR}h`);
    if (!dias && minR) partes.push(`${minR}min`);
    return partes.length ? partes.join(' ') : 'menos de 1min';
  }

  function inicioSemanaUtil(ref) {
    const dia = ref.getDay();
    const delta = dia === 0 ? -6 : 1 - dia;
    return new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() + delta);
  }

  function construirCalendarioSemana(ativos) {
    const seg = inicioSemanaUtil(new Date());
    const dias = [];
    for (let i = 0; i < 5; i++) dias.push({ data: new Date(seg.getFullYear(), seg.getMonth(), seg.getDate() + i), itens: [] });
    ativos.forEach(p => {
      if (!p._proxima) return;
      const d = dias.find(d => d.data.toDateString() === p._proxima.toDateString());
      if (d) d.itens.push(p);
    });
    dias.forEach(d => d.itens.sort((a, b) => a._proxima - b._proxima));
    return dias;
  }

  let _diasCalendarioAtual = [];

  let _atrasadosCalAtual = [];

  function alternarAtrasadosCalendario() {
    const el = document.getElementById('sm-cal-atrasados-lista');

        <span><b>${p.numero_sei}</b> — ${p.titulo}</span>
        <span class="sm-cal-atraso">há ${formatarDuracao(p._proxima.getTime() - Date.now())}</span>
      </div>`).join('');
    el.style.display = 'block';
  }

  function htmlCalendario(dias, atrasados) {
    const hojeStr = new Date().toDateString();
    _atrasadosCalAtual = atrasados || [];
    return `
      <div class="sm-calendario">
        ${_atrasadosCalAtual.length ? `
          <div class="sm-cal-dia-wrap sm-cal-atrasado">
            <button class="sm-cal-dia sm-cal-atrasado-btn" onclick="alternarAtrasadosCalendario()">
              <span>⚠ Atrasados (verificação vencida)</span>
              <span class="sm-cal-contagem">${_atrasadosCalAtual.length}</span>
            </button>
            <div class="sm-cal-horas" id="sm-cal-atrasados-lista" style="display:none;"></div>
          </div>` : ''}
        ${dias.map((d, i) => {
          const ehHoje = d.data.toDateString() === hojeStr;
          const dataFmt = `${String(d.data.getDate()).padStart(2, '0')}/${String(d.data.getMonth() + 1).padStart(2, '0')}`;
          return `
          <div class="sm-cal-dia-wrap">
            <button class="sm-cal-dia ${ehHoje ? 'sm-cal-hoje' : ''}" onclick="alternarDiaCalendario(${i})">
              <span>${NOMES_DIA_SEMANA[d.data.getDay()]} ${dataFmt}</span>
              <span class="sm-cal-contagem">${d.itens.length || 0}</span>
            </button>
            <div class="sm-cal-horas" id="sm-cal-horas-${i}" style="display:none;"></div>
          </div>`;
        }).join('')}
      </div>`;
  }

  function htmlHorasDia(itensDia) {
    if (!itensDia.length) return '<div class="text-muted" style="padding:8px 0;">Nenhuma verificação prevista neste dia.</div>';
    const porHora = {};
    itensDia.forEach(p => { const h = p._proxima.getHours(); (porHora[h] = porHora[h] || []).push(p); });
    return Object.keys(porHora).map(Number).sort((a, b) => a - b).map(h => `
      <div class="sm-cal-hora-bloco">
        <div class="sm-cal-hora-rotulo">${String(h).padStart(2, '0')}h</div>
        ${porHora[h].map(p => `
          <div class="sm-cal-hora-item" onclick="abrirProcesso('${p.numero_sei}')">
            <span class="sm-cal-dot" style="background:${CORES_PRIORIDADE[p.prioridade] || '#999'}"></span>
            <span><b>${p.numero_sei}</b> — ${p.titulo}</span>
            ${p._proxima.getTime() <= Date.now() ? '<span class="sm-cal-atraso">atrasado</span>' : ''}
          </div>`).join('')}
      </div>`).join('');
  }

    const el = document.getElementById(`sm-cal-horas-${i}`);

    if (!aberto) { el.innerHTML = htmlHorasDia(_diasCalendarioAtual[i].itens); el.style.display = 'block'; }
  }

  // ==================== LISTA DE TAREFAS ====================
  // Admin escreve a tarefa e atribui a um ou mais usuários; quem recebeu (ou um admin)
  // conclui, com uma nota opcional. O bloco fica abaixo da barra azul da tela geral e
  // pulsa em dourado só para quem tem tarefa aberta atribuída.
  // Depende de: api, escFD, raizTar() (onde ficam os modais), perfilTar() ('admin' |
  // 'monitor' | 'consultor' | null) e aoAtualizarTarefasTar(dados) (badge do botão).
  let _tarDados = null, _tarAberto = false, _tarAba = 'abertas', _tarCarregando = null;

  function dataHoraTar(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return String(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  async function carregarTarefasTar() {
    if (_tarCarregando) return _tarCarregando;
    _tarCarregando = (async () => {
      try {
        const r = await api('tarefas/listar');
        _tarDados = r && r.ok ? r : { ok: false, erro: (r && r.erro) || 'Não consegui carregar as tarefas.' };
      } catch (e) { _tarDados = { ok: false, erro: e.message }; }
      _tarCarregando = null;
      try { aoAtualizarTarefasTar(_tarDados); } catch (e) { /* badge é opcional */ }
      try { carregarPrazosPz(); } catch (e) { /* alerta de prazos é opcional */ }
      pintarTarefasTar();
      return _tarDados;
    })();
    return _tarCarregando;
  }

  /** Lugar do bloco (colocado logo abaixo da barra azul). O conteúdo é pintado por pintarTarefasTar(). */
  function htmlTarefasTar() {
    return `<div id="tar-bloco" class="tar-bloco">${_tarDados ? htmlConteudoTarefasTar(false) : '<div class="tar-cab"><span>📋 Lista de tarefas</span><span class="tar-dica"><span class="spinner"></span></span></div>'}</div>`;
  }

  function htmlItemTar(t, historico) {
    const perfil = perfilTar();
    const podeConcluir = !historico && perfil !== 'consultor' && (t.minha || perfil === 'admin');
    const pessoas = t.atribuidos.map((a) => `<span class="tar-pessoa${_tarDados && a.id === _tarDados.meu_id ? ' tar-eu' : ''}">${escFD(a.nome)}</span>`).join(' ');
    return `<div class="tar-item${t.minha && !historico ? ' tar-minha' : ''}">
      <div class="tar-texto">${escFD(t.texto).replace(/\n/g, '<br>')}</div>
      ${t.processo_sei ? `<div class="tar-meta">Processo: <b>${escFD(t.processo_sei)}</b></div>` : ''}
      <div class="tar-meta">Lançada por <b>${escFD(t.criado_por)}</b> em ${escFD(dataHoraTar(t.criado_em))}</div>
      <div class="tar-meta">Para: ${pessoas || '—'}</div>
      ${!historico && t.prazo ? `<div class="tar-meta">${seloPrazoPz(t.prazo)} <span>prazo de ${escFD(descricaoPrazoPz(t.prazo))} · vence ${escFD(dataHoraPz(t.prazo.fim))}</span></div>` : ''}
      ${historico ? `<div class="tar-meta tar-ok">✓ Concluída por <b>${escFD(t.concluida_por || '—')}</b> em ${escFD(dataHoraTar(t.concluida_em))}</div>
        ${t.nota_conclusao ? `<div class="tar-nota">📝 ${escFD(t.nota_conclusao).replace(/\n/g, '<br>')}</div>` : ''}` : ''}
      <div class="tar-acoes">
        ${podeConcluir ? `<button class="btn tar-btn" data-tar-concluir="${escFD(t.id)}">✓ Concluir</button>` : ''}
        ${perfil === 'admin' ? `<button class="btn-link tar-del" data-tar-excluir="${escFD(t.id)}" title="Excluir tarefa">excluir</button>` : ''}
        ${historico && perfil === 'admin' ? `<button class="btn-link" data-tar-reabrir="${escFD(t.id)}">reabrir</button>` : ''}
      </div>
    </div>`;

  function htmlConteudoTarefasTar(fixo) {
    const d = _tarDados;
    const aberto = fixo || _tarAberto;
    if (!d || !d.ok) return `<div class="tar-cab"><span>📋 Lista de tarefas</span></div><div class="tar-dica">${escFD((d && d.erro) || '')}</div>`;
    const minhas = d.minhas || 0;
    const lista = _tarAba === 'abertas' ? d.abertas : d.historico;
    return `
      <div class="tar-cab" ${fixo ? '' : 'data-tar="alternar" role="button" tabindex="0"'}>
        <span>${fixo ? '' : (aberto ? '▾ ' : '▸ ')}📋 Lista de tarefas <span class="tar-n">${d.abertas.length} aberta${d.abertas.length === 1 ? '' : 's'}</span></span>
        ${minhas ? `<span class="tar-aviso">${minhas} tarefa${minhas === 1 ? '' : 's'} atribuída${minhas === 1 ? '' : 's'} a você</span>` : ''}
      </div>
      ${aberto ? `
        <div class="tar-abas">
          <button class="${_tarAba === 'abertas' ? 'on' : ''}" data-tar-aba="abertas">Abertas (${d.abertas.length})</button>
          <button class="${_tarAba === 'historico' ? 'on' : ''}" data-tar-aba="historico">Histórico (${d.historico.length})</button>
          ${perfilTar() === 'admin' ? '<button class="tar-nova" data-tar="nova">+ Nova tarefa</button>' : ''}
        </div>
        <div class="tar-lista">${lista.length ? lista.map((t) => htmlItemTar(t, _tarAba === 'historico')).join('')
          : `<div class="tar-dica">${_tarAba === 'abertas' ? 'Nenhuma tarefa aberta.' : 'Nenhuma tarefa concluída ainda.'}</div>`}</div>
        <div class="tar-dica">${_tarAba === 'abertas' ? 'Ordenadas pela data de registro (mais recentes primeiro).' : 'Ordenadas pela data e hora de conclusão (mais recentes primeiro).'}</div>` : ''}`;
  }

  function pintarTarefasTar() {
    const raizT = raizTar();
    if (raizT) raizT.querySelectorAll('.tar-bloco').forEach(pintarBlocoTar);
  }

  function pintarBlocoTar(bloco) {
    const fixo = bloco.hasAttribute('data-tar-fixo');
    bloco.innerHTML = htmlConteudoTarefasTar(fixo);
    bloco.classList.toggle('tar-pulsa', !fixo && !!(_tarDados && _tarDados.ok && _tarDados.minhas));
    const alternar = () => { _tarAberto = !_tarAberto; pintarTarefasTar(); };
    const cab = bloco.querySelector('[data-tar="alternar"]');
    if (cab) { cab.onclick = alternar; cab.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar(); } }; }
    bloco.querySelectorAll('[data-tar-aba]').forEach((b) => b.onclick = () => { _tarAba = b.dataset.tarAba; pintarTarefasTar(); });
    const nova = bloco.querySelector('[data-tar="nova"]'); if (nova) nova.onclick = () => abrirNovaTarefaTar();
    bloco.querySelectorAll('[data-tar-concluir]').forEach((b) => b.onclick = () => abrirConcluirTarefaTar(b.dataset.tarConcluir));
    bloco.querySelectorAll('[data-tar-excluir]').forEach((b) => b.onclick = async () => {
      if (!confirm('Excluir esta tarefa? Ela some da lista e do histórico.')) return;
      const r = await api('tarefas/excluir', { id: b.dataset.tarExcluir });
      if (!r || !r.ok) alert((r && r.erro) || 'Não consegui excluir.');
      carregarTarefasTar();
    });
    bloco.querySelectorAll('[data-tar-reabrir]').forEach((b) => b.onclick = async () => {
      const r = await api('tarefas/reabrir', { id: b.dataset.tarReabrir });
      if (!r || !r.ok) alert((r && r.erro) || 'Não consegui reabrir.');
      carregarTarefasTar();
    });
  }

  /** Lista completa numa janela (botão 📋 do cabeçalho, em qualquer tela). */
  function abrirListaTarefasTar() {
    _tarAba = 'abertas';
    const m = modalTar('<div class="tar-bloco tar-bloco-modal" data-tar-fixo></div><div class="tar-rodape"><button class="btn btn-secondary" data-tar-fechar>Fechar</button></div>');
    pintarBlocoTar(m.el.querySelector('.tar-bloco'));
    carregarTarefasTar();
  }

  function modalTar(html) {
    const raizT = raizTar();
    raizT.querySelector('#tar-modal-fundo')?.remove();
    const fundo = document.createElement('div');
    fundo.id = 'tar-modal-fundo';
    fundo.innerHTML = `<div class="tar-modal" role="dialog" aria-modal="true">${html}</div>`;
    raizT.appendChild(fundo);
    const fechar = () => fundo.remove();
    fundo.addEventListener('click', (e) => { if (e.target === fundo) fechar(); });
    fundo.querySelectorAll('[data-tar-fechar]').forEach((b) => b.onclick = fechar);
    return { el: fundo.querySelector('.tar-modal'), fechar };
  }

  async function abrirNovaTarefaTar() {
    if (perfilTar() !== 'admin') { abrirListaTarefasTar(); return; }
    const m = modalTar('<h3>📋 Nova tarefa</h3><div class="tar-dica"><span class="spinner"></span> Carregando usuários...</div>');
    const r = await api('tarefas/usuarios');
    if (!r || !r.ok) { m.el.innerHTML = `<h3>📋 Nova tarefa</h3><div class="tar-dica">${escFD((r && r.erro) || 'Erro ao carregar usuários.')}</div><div class="tar-rodape"><button class="btn btn-secondary" data-tar-fechar>Fechar</button></div>`; m.el.querySelector('[data-tar-fechar]').onclick = m.fechar; return; }
    const rot = { admin: 'Admin', monitor: 'Monitor', consultor: 'Consultor' };

      <label class="tar-rot">Processo relacionado <small>(opcional)</small></label>
      <input data-tar-campo="sei" type="text" placeholder="Nº do processo SEI">

      <div data-tar-campo="prazo">${htmlCamposPrazoPz({})}</div>
      <label class="tar-rot">Atribuir a <small>(um ou mais; consultores só visualizam e não recebem tarefas)</small></label>
      <div class="tar-usuarios">${r.usuarios.filter((u) => u.perfil !== 'consultor').map((u) => `<label><input type="checkbox" value="${escFD(u.id)}"> ${escFD(u.nome)} <small>${escFD(rot[u.perfil] || '')}</small></label>`).join('')}</div>
      <div class="tar-dica" data-tar-campo="st"></div>

    q('texto').focus();
    q('salvar').onclick = async () => {
      const texto = q('texto').value.trim();
      const usuarios = [...m.el.querySelectorAll('.tar-usuarios input:checked')].map((i) => i.value);
      if (!texto) { q('st').textContent = 'Escreva o que precisa ser feito.'; return; }

      q('salvar').disabled = true; q('st').textContent = 'Salvando...';
      const pz = lerCamposPrazoPz(q('prazo'));
      const s = await api('tarefas/criar', { texto, usuarios, processo_sei: q('sei').value.trim() || null, prazo: pz.qtd ? pz : null });
      if (!s || !s.ok) { q('salvar').disabled = false; q('st').textContent = '⚠ ' + ((s && s.erro) || 'Não consegui salvar.'); return; }
      m.fechar(); _tarAberto = true; _tarAba = 'abertas';
      await carregarTarefasTar();
      abrirListaTarefasTar();
    };
  }

  function abrirConcluirTarefaTar(id) {
    const voltarLista = !!(raizTar() && raizTar().querySelector('#tar-modal-fundo .tar-bloco'));
    const t = _tarDados && _tarDados.abertas.find((x) => x.id === id);
    const m = modalTar(`
      <h3>✓ Concluir tarefa</h3>

      <div class="tar-dica" data-tar-campo="st"></div>

      if (voltarLista) abrirListaTarefasTar();
