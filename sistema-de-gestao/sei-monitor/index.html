  // ==================== RESUMO GERAL PELA IA LOCAL (manual e automático 2x/dia) ====================
  // Os dados vão do servidor direto para o Ollama deste computador; nada sai para a internet.
  // Automático: manhã (06h–11h59) e meio-dia (12h–17h59). Só um computador faz cada turno:
  // o primeiro apto reserva o turno no banco e manda um "sinal" a cada 2 min; se o sinal
  // parar por 10 min, outro computador assume. Na mesma máquina, só uma aba do SEI participa.
  // Depende de: api, escFD, ollamaDisponivelIA, ollamaPedidoIA, lerLocalIA, guardarLocalIA, perfilTar().
  let _raRodando = false, _raIniciado = false, _raEstado = '';
  const LIMITE_TIPO_RA = 14000;   // caracteres de dados por tipo enviados à IA local

  const PROMPT_SISTEMA_RA = `Você é um(a) assistente de gestão pública que apoia a gerência que acompanha processos administrativos de contratos de gestão na saúde (SES-PE).
Regras obrigatórias:
- Use SOMENTE os dados fornecidos. Não invente fatos, datas, valores, nomes nem números de processo. Se faltar informação, escreva "não informado".
- Ao falar de um caso específico, cite o número do processo SEI exatamente como veio nos dados.
- Português do Brasil, linguagem simples e direta, frases curtas. Use marcadores (-) e, com moderação, 🟢 (tudo certo), 🟡 (atenção) e 🔴 (urgente).
- Use apenas títulos com ## (dois #). Nunca use título com um # só.
- Não copie a lista de dados: sintetize e priorize.
- Escreva TUDO em português do Brasil. Nunca escreva em inglês.
- Não mostre raciocínio, rascunho nem comentários sobre a tarefa: responda direto com o texto final, começando pelo primeiro título ##.`;

  function agoraRecifeRA() {
    const partes = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Recife', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hour12: false }).formatToParts(new Date());
    const v = (t) => (partes.find((p) => p.type === t) || {}).value || '';
    const hora = Number(v('hour')) % 24;
    return { data: `${v('year')}-${v('month')}-${v('day')}`, hora, turno: hora >= 6 && hora < 12 ? 'manha' : hora >= 12 && hora < 18 ? 'tarde' : null };
  }

  async function maquinaIdRA() {
    let id = await lerLocalIA('ia_maquina_id');
    if (!id) { id = 'pc-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); await guardarLocalIA('ia_maquina_id', id); }
    return id;
  }

  /** Modelo pronto neste computador, ou null (com o motivo). */
  async function modeloProntoRA() {
    if (!(await ollamaDisponivelIA())) return { erro: 'A IA local não está disponível aqui (instale a extensão SEI Monitor neste computador).' };
    const diag = await ollamaPedidoIA({ op: 'diagnosticar' });
    if (!diag || diag.estado !== 'pronto') return { erro: 'A IA local não está pronta neste computador (veja 🤖 Configuração de IA).' };
    const tem = (n) => n && (diag.modelos || []).some((m) => mesmoModeloIA(m.nome, n));
    let modelo = await lerLocalIA('ia_ollama_modelo');
    if (!tem(modelo)) { try { const c = await api('ia/config'); modelo = c && c.ok ? c.ollama_modelo : null; } catch (e) { modelo = null; } }
    if (!tem(modelo)) { const pref = MODELOS_OLLAMA_IA.find((m) => tem(m.nome)); modelo = pref ? pref.nome : null; }
    if (!modelo) return { erro: 'Escolha um modelo em 🤖 Configuração de IA.' };
    return { modelo };
  }

  function limparTextoRA(t) {
    let s = String(t || '')
      .replace(/<think>[\s\S]*?(<\/think>|$)/gi, '')   // raciocínio do modelo (mesmo se cortado no meio)
      .replace(/```[\s\S]*?```/g, '');
    s = s.split('\n').map((l) => l.replace(/^\s*#(?!#)\s*/, '## ')).join('\n');
    const i = s.search(/^\s*##\s/m);           // tudo antes do primeiro título é "conversa" do modelo
    return (i >= 0 ? s.slice(i) : s).trim();
  }
  /** Confere se a resposta veio no formato pedido: em português, com os títulos e sem raciocínio em inglês. */
  function respostaValidaRA(texto, titulos) {
    if (!texto) return 'veio vazia';
    const achados = titulos.filter((t) => normDsp(texto).includes(normDsp(t))).length;
    if (achados < Math.min(3, titulos.length)) return 'veio sem os títulos pedidos';
    const ingles = (texto.match(/\b(the|and|let's|we need|user|wait|okay|first|should|check)\b/gi) || []).length;
    if (ingles > 6) return 'veio em inglês';
    const ultimo = titulos[titulos.length - 1];
    if (!normDsp(texto).includes(normDsp(ultimo).slice(0, 18))) return 'veio incompleta (cortada antes do fim)';
    return null;
  }

  async function perguntarRA(modelo, usuario, maxTokens, titulos) {
    let ultimoErro = '';
    for (let tentativa = 1; tentativa <= 2; tentativa++) {
      const tokens = tentativa === 1 ? maxTokens : Math.round(maxTokens * 1.6);
      const chars = PROMPT_SISTEMA_RA.length + usuario.length;
      const numCtx = chars / 3.4 + tokens + 600 > 8192 ? 16384 : 8192;
      const reforco = tentativa === 1 ? '' : '\n\nATENÇÃO: responda somente em português do Brasil, sem explicar o que vai fazer, começando direto pelo primeiro título ## e escrevendo TODOS os títulos até o último.';
      const r = await ollamaPedidoIA({ op: 'gerar', modelo, mensagens: [{ role: 'system', content: PROMPT_SISTEMA_RA }, { role: 'user', content: usuario + reforco }],
        opcoes: { num_ctx: numCtx, temperature: tentativa === 1 ? 0.2 : 0.1, num_predict: tokens }, tempoMs: 40 * 60000 });
      if (!r || !r.ok) throw new Error((r && r.erro) || 'A IA local não respondeu.');
      const texto = limparTextoRA(r.texto);
      ultimoErro = titulos ? respostaValidaRA(texto, titulos) : (texto ? null : 'veio vazia');
      if (!ultimoErro) return texto;
    }
    throw new Error(`A resposta da IA local ${ultimoErro}, mesmo depois de pedir de novo. Nada foi salvo.`);
  }

  function graficosRA(d) {
    const geral = [
      { tipo: 'barras', titulo: 'Processos em andamento por tipo', itens: d.tipos.map((t) => ({ rotulo: t.tipo, valor: t.total })) },
      { tipo: 'barras', titulo: 'Tempo médio de tramitação por tipo (dias)', itens: d.tipos.filter((t) => t.media_dias != null).map((t) => ({ rotulo: t.tipo, valor: t.media_dias })) },
    ];
    if (d.em_standby) geral.push({ tipo: 'rosca', titulo: 'Em stand-by × seguindo', itens: [{ rotulo: 'Em stand-by', valor: d.em_standby }, { rotulo: 'Seguindo', valor: d.total_ativos - d.em_standby }] });
    return {
      versao: 2,
      geral: { graficos: geral.filter((g) => g.itens.length) },
      tipos: d.tipos.map((t) => ({ tipo: t.tipo, graficos: [
        { tipo: 'barras', titulo: 'Processos por etapa pendente', itens: t.por_etapa.slice(0, 8).map((e) => ({ rotulo: e.etapa, valor: e.n })) },
        { tipo: 'rosca', titulo: 'Processos por situação', itens: Object.entries(t.por_status).map(([k, v]) => ({ rotulo: k, valor: v })) },
      ].filter((g) => g.itens.length) })),
    };
  }

  /** Gera o texto completo (# GERAL + # TIPO: X + bloco json de gráficos). aoStatus(txt), deveParar() opcional. */
  async function gerarResumoGeralLocalRA(modelo, aoStatus, deveParar) {
    const parar = () => { if (deveParar && deveParar()) throw new Error('Outro computador assumiu este resumo.'); };
    aoStatus('Buscando os dados dos processos...');
    const r = await api('resumo-auto/dados');
    if (!r || !r.ok) throw new Error((r && r.erro) || 'Não consegui buscar os dados.');
    const d = r.dados;
    if (!d.tipos.length) throw new Error('Não há processos em andamento para resumir.');
    const dataRef = new Date(d.gerado_em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    const secoes = [];
    for (let i = 0; i < d.tipos.length; i++) {
      parar();
      const t = d.tipos[i];
      aoStatus(`IA local escrevendo o resumo de ${t.tipo} (${i + 1} de ${d.tipos.length})...`);
      let linhas = t.linhas, omitidos = 0, tam = 0;
      const cabem = [];
      for (const l of linhas) { if (tam + l.length > LIMITE_TIPO_RA) { omitidos++; continue; } cabem.push(l); tam += l.length + 1; }
      const usuario = [
        `Dados de ${dataRef}. Tipo de processo: ${t.tipo}.`,
        `Indicadores: ${t.total} processo(s) em andamento; ${t.em_standby} em stand-by; tempo médio de tramitação ${t.media_dias ?? 'não informado'} dias (maior: ${t.max_dias ?? 'não informado'}).`,
        `Etapas pendentes: ${t.por_etapa.map((e) => `${e.etapa} (${e.n})`).join('; ') || 'não informado'}.`,
        '', 'Processos (um por linha):', ...cabem,
        omitidos ? `(${omitidos} processo(s) a mais não detalhado(s) por tamanho; estão contados nos indicadores.)` : '',
        '', 'Escreva o resumo deste tipo com estes títulos, nesta ordem (se um título não tiver o que dizer, escreva "nada a destacar"):',
        '## Panorama em poucas linhas', '## O que precisa de ação agora', '## Gargalos e riscos', '## O que está andando bem', '## Próximos passos sugeridos',
        'Até 250 palavras.',
      ].filter((x) => x !== '').join('\n');
      secoes.push({ tipo: t.tipo, texto: await perguntarRA(modelo, usuario, 1100, ['Panorama em poucas linhas', 'O que precisa de ação agora', 'Gargalos e riscos', 'O que está andando bem', 'Próximos passos sugeridos']) });
    }
    parar();
    aoStatus('IA local escrevendo o panorama geral...');
    const orc = Object.entries(d.orcamento || {}).map(([k, v]) => `${k}: ${v.processos} processo(s), impacto mensal R$ ${Number(v.mensal).toLocaleString('pt-BR')}, no exercício R$ ${Number(v.anual).toLocaleString('pt-BR')}`);
    const usuarioGeral = [
      `Dados de ${dataRef}. Panorama de TODOS os tipos.`,
      `Indicadores: ${d.total_ativos} processo(s) em andamento; ${d.em_standby} em stand-by; tempo médio geral ${d.tempo?.geral?.media ?? 'não informado'} dias.`,
      'Por tipo: ' + d.tipos.map((t) => `${t.tipo} — ${t.total} processo(s), ${t.em_standby} em stand-by, média ${t.media_dias ?? '—'} dias`).join('; ') + '.',
      'Orçamento (por estágio): ' + (orc.length ? orc.join('; ') : 'sem valores registrados') + '.',
      '', 'Resumos já feitos de cada tipo (use-os como base):',
      ...secoes.map((s) => `--- ${s.tipo} ---\n${s.texto.slice(0, 1800)}`),
      '', 'Escreva o panorama GERAL com estes títulos, nesta ordem:',
      '## Panorama em poucas linhas', '## O que precisa de ação agora', '## Orçamento', '## Gargalos e riscos', '## O que está andando bem', '## Próximos passos sugeridos (do mais ao menos urgente)',
      'Em "Orçamento", use só os números acima. Até 350 palavras.',
    ].join('\n');
    const geral = await perguntarRA(modelo, usuarioGeral, 1400, ['Panorama em poucas linhas', 'O que precisa de ação agora', 'Orçamento', 'Gargalos e riscos', 'O que está andando bem', 'Próximos passos sugeridos']);
    const texto = ['# GERAL', geral, '', ...secoes.flatMap((s) => [`# TIPO: ${s.tipo}`, s.texto, '']),
      '```json', JSON.stringify(graficosRA(d)), '```'].join('\n');
    return texto;
  }

  /** Texto curto de quem gerou o resumo (linha "Último resumo salvo..."). */
  function origemResumoRA(origem) {
    if (!origem) return 'colado do NotebookLM';
    const [tipo, modelo] = String(origem).split(':');
    if (tipo === 'ia_local_auto') return `gerado automaticamente pela IA local${modelo ? ' (' + modelo + ')' : ''}`;
    if (tipo === 'ia_local') return `gerado pela IA local${modelo ? ' (' + modelo + ')' : ''}`;
    return origem;
  }

  async function statusAutoRA() {
    try {
      const r = await api('resumo-auto/status', { maquina: await maquinaIdRA() });
      if (!r || !r.ok || !r.disponivel) return '';
      const nomeT = { manha: 'manhã', tarde: 'meio-dia' };
      const partes = ['manha', 'tarde'].map((t) => {
        const e = r.execucoes.find((x) => x.turno === t);
        if (!e) return `${nomeT[t]}: ${t === 'tarde' && r.hora < 12 ? 'às 12h' : 'aguardando um computador com IA local'}`;
        const quem = e.sou_eu ? 'este computador' : e.executor_nome;
        if (e.status === 'concluido') return `${nomeT[t]}: ✅ ${new Date(e.concluido_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} (${quem})`;
        if (e.status === 'rodando') return `${nomeT[t]}: ⏳ gerando em ${quem}`;
        return `${nomeT[t]}: ⚠ falhou (${quem}); outro computador tentará de novo`;
      });
      return 'Resumo automático de hoje — ' + partes.join(' · ');
    } catch (e) { return ''; }
  }

  async function tentarResumoAutoRA() {
    if (_raRodando) return;
    const agora = agoraRecifeRA();
    if (!agora.turno) return;
    const chaveFeito = `ia_auto_feito_${agora.data}_${agora.turno}`;
    if (await lerLocalIA(chaveFeito)) return;
    if ((await lerLocalIA('ia_auto_resumo')) === false) return;
    const perfil = perfilTar();
    if (!perfil || perfil === 'consultor') return;
    const pronto = await modeloProntoRA();
    if (!pronto.modelo) return;
    const executar = async () => {
      if (_raRodando) return;
      _raRodando = true;
      const maquina = await maquinaIdRA();
      let sinal = null, perdeu = false;
      try {
        const res = await api('resumo-auto/reservar', { turno: agora.turno, maquina });
        if (!res || !res.ok) return;
        if (res.resultado === 'ja_feito') { await guardarLocalIA(chaveFeito, true); return; }
        if (res.resultado !== 'reservado') return;
        sinal = setInterval(async () => {
          try { const s = await api('resumo-auto/sinal', { turno: agora.turno, maquina }); if (s && s.ok && !s.continua) perdeu = true; } catch (e) { /* tenta no próximo */ }
        }, 2 * 60000);
        const texto = await gerarResumoGeralLocalRA(pronto.modelo, (t) => { _raEstado = t; }, () => perdeu);
        const c = await api('resumo-auto/concluir', { turno: agora.turno, maquina, texto, modelo: pronto.modelo });
        if (c && c.ok) { await guardarLocalIA(chaveFeito, true); _raEstado = ''; try { aoResumoAutoSalvoRA(); } catch (e) { /* tela opcional */ } }
        else _raEstado = '';
      } catch (e) {
        _raEstado = '';
        if (!perdeu) { try { await api('resumo-auto/falhar', { turno: agora.turno, maquina, erro: e.message }); } catch (e2) { /* sem rede */ } }
      } finally { if (sinal) clearInterval(sinal); _raRodando = false; }
    };
    // Várias abas do SEI no mesmo computador: só uma participa.
    if (navigator.locks && navigator.locks.request) await navigator.locks.request('sei-monitor-resumo-auto', { ifAvailable: true }, async (lock) => { if (lock) await executar(); });
    else await executar();
  }

  function iniciarResumoAutoRA() {
    if (_raIniciado) return;
    _raIniciado = true;
    setTimeout(() => tentarResumoAutoRA().catch(() => {}), 25000);
    setInterval(() => tentarResumoAutoRA().catch(() => {}), 5 * 60000);
  }

  // ==================== PRAZOS: alerta ⚠ no cabeçalho ====================
  // Etapas de processo e tarefas com prazo. O ícone pulsa em amarelo quando há prazos
  // correndo; com menos de 24 h (ou vencido) fica vermelho, com setas apontando para ele.
  // Depende de: api, escFD, raizPz() (onde fica a janela), hostAlertaPz() (onde fica o
  // ícone), abrirProcessoPz(sei) e abrirTarefasPz().
  let _pzItens = [], _pzDisponivel = false, _pzRelogio = null, _pzBusca = null;
  const PZ_DIA_MS = 86400000;

  function restantePz(fimIso, agora = Date.now()) {
    const ms = new Date(fimIso).getTime() - agora;
    const abs = Math.abs(ms);
    const d = Math.floor(abs / PZ_DIA_MS), h = Math.floor((abs % PZ_DIA_MS) / 3600000), m = Math.floor((abs % 3600000) / 60000);
    const txt = d ? `${d}d ${h}h` : h ? `${h}h ${String(m).padStart(2, '0')}min` : `${m}min`;
    return { ms, texto: ms >= 0 ? `faltam ${txt}` : `vencido há ${txt}`, nivel: ms < 0 ? 'vencido' : ms < PZ_DIA_MS ? 'critico' : 'normal' };
  }
  function descricaoPrazoPz(p) {
    if (!p || !p.qtd) return '';
    return `${p.qtd} ${p.unidade === 'horas' ? (p.qtd === 1 ? 'hora' : 'horas') : (p.qtd === 1 ? 'dia' : 'dias')} ${p.uteis ? (p.qtd === 1 ? 'útil' : 'úteis') : (p.qtd === 1 ? 'corrido' : 'corridos')}`;
  }
  function dataHoraPz(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  function progressoPz(p, agora = Date.now()) {
    const i = new Date(p.inicio).getTime(), f = new Date(p.fim).getTime();
    if (!(f > i)) return 100;
    return Math.max(0, Math.min(100, (agora - i) / (f - i) * 100));
  }
  /** Selo pequeno "⏱ faltam 2d 4h" para usar em listas (etapas, tarefas). */
  function seloPrazoPz(p) {
    if (!p || !p.fim) return '';
    const r = restantePz(p.fim);
    return `<span class="pz-selo pz-${r.nivel}" title="Prazo: ${escFD(descricaoPrazoPz(p))} · vence ${escFD(dataHoraPz(p.fim))}">⏱ ${escFD(r.texto)}</span>`;
  }

  /** Campos de prazo (quantidade, dias/horas, úteis/corridos). */
  function htmlCamposPrazoPz(padrao) {
    const p = padrao || {};
    return `<div class="pz-campos">
      <input type="number" min="1" max="400" data-pz="qtd" value="${p.qtd || ''}" placeholder="qtd">
      <select data-pz="unidade"><option value="dias" ${p.unidade !== 'horas' ? 'selected' : ''}>dias</option><option value="horas" ${p.unidade === 'horas' ? 'selected' : ''}>horas</option></select>
      <select data-pz="uteis"><option value="uteis" ${p.uteis !== false ? 'selected' : ''}>úteis</option><option value="corridos" ${p.uteis === false ? 'selected' : ''}>corridos</option></select>
    </div>`;
  }
  function lerCamposPrazoPz(el) {
    const q = (n) => el.querySelector(`[data-pz="${n}"]`);
    const qtd = Math.floor(Number(q('qtd').value));
    return { qtd: qtd > 0 ? qtd : 0, unidade: q('unidade').value, uteis: q('uteis').value === 'uteis' };
  }

  // ---------- ícone e janela ----------
  function montarAlertaPz() {
    const host = hostAlertaPz();
    if (!host || host.querySelector('#pz-alerta')) return;
    host.innerHTML = `<button type="button" id="pz-alerta" class="pz-alerta" title="Prazos" hidden>
        <span class="pz-seta pz-seta-e">▶</span>
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 2.8 1.8 20.5h20.4L12 2.8z" fill="#F2A900" stroke="#7c4a03" stroke-width="1.3" stroke-linejoin="round"/><rect x="11" y="9" width="2" height="6.2" rx="1" fill="#3b2300"/><circle cx="12" cy="17.6" r="1.15" fill="#3b2300"/></svg>
        <b id="pz-n"></b>
        <span class="pz-seta pz-seta-d">◀</span>
      </button>`;
    host.querySelector('#pz-alerta').onclick = (e) => { e.stopPropagation(); alternarJanelaPz(); };
    carregarPrazosPz();
    if (!_pzRelogio) {
      _pzRelogio = setInterval(pintarAlertaPz, 60000);
      setInterval(() => carregarPrazosPz(), 5 * 60000);
    }
  }

  async function carregarPrazosPz() {
    if (_pzBusca) return _pzBusca;
    _pzBusca = (async () => {
      try {
        const r = await api('prazos/ativos');
        if (r && r.ok) { _pzItens = r.itens || []; _pzDisponivel = r.disponivel !== false; }
      } catch (e) { /* mantém o que tinha */ }
      _pzBusca = null;
      pintarAlertaPz();
      avisarCriticosPz();
    })();
    return _pzBusca;
  }

  function pintarAlertaPz() {
    const b = raizPz() && raizPz().querySelector('#pz-alerta');
    if (!b) return;
    const agora = Date.now();
    const niveis = _pzItens.map((i) => restantePz(i.fim, agora).nivel);
    const urgentes = niveis.filter((n) => n !== 'normal').length;
    b.hidden = !_pzItens.length;
    b.classList.toggle('pz-ativo', _pzItens.length > 0);
    b.classList.toggle('pz-critico', urgentes > 0);
    b.querySelector('#pz-n').textContent = _pzItens.length ? String(urgentes || _pzItens.length) : '';
    b.title = !_pzItens.length ? 'Sem prazos correndo'
      : urgentes ? `${urgentes} prazo(s) vencendo em menos de 24 h ou vencido(s) — clique para ver`
      : `${_pzItens.length} prazo(s) correndo — clique para ver`;
    const j = raizPz().querySelector('#pz-janela');
    if (j) pintarJanelaPz(j);
  }

  function alternarJanelaPz() {
    const raizP = raizPz();
    const aberta = raizP.querySelector('#pz-janela');
    if (aberta) { aberta.remove(); return; }
    const j = document.createElement('div');
    j.id = 'pz-janela'; j.className = 'pz-janela';
    raizP.appendChild(j);
    pintarJanelaPz(j);
    const b = raizP.querySelector('#pz-alerta');
    if (b) {
      const r = b.getBoundingClientRect();
      j.style.top = Math.round(r.bottom + 10) + 'px';
      const larg = Math.min(380, window.innerWidth - 16);
      j.style.left = Math.round(Math.max(8, Math.min(window.innerWidth - larg - 8, r.left + r.width / 2 - larg / 2))) + 'px';
      j.style.width = larg + 'px';
    }
    setTimeout(() => {
      const fora = (e) => { if (!e.composedPath().includes(j) && !e.composedPath().includes(b)) { j.remove(); document.removeEventListener('click', fora, true); } };
      document.addEventListener('click', fora, true);
    }, 0);
    carregarPrazosPz();
  }

  function pintarJanelaPz(j) {
    const agora = Date.now();
    const grupos = { vencido: [], critico: [], normal: [] };
    _pzItens.forEach((it) => { const r = restantePz(it.fim, agora); grupos[r.nivel].push({ it, r }); });
    const linha = ({ it, r }) => `
      <div class="pz-item pz-${r.nivel}" data-pz-tipo="${it.tipo}" data-pz-sei="${escFD(it.sei || '')}" tabindex="0">
        <div class="pz-item-cab"><span class="pz-ic">${it.tipo === 'tarefa' ? '📋' : '📄'}</span>
          <span class="pz-item-nome">${escFD(it.tipo === 'tarefa' ? it.nome : it.nome)}</span>
          <span class="pz-resta">${escFD(r.texto)}</span></div>
        <div class="pz-item-sub">${it.tipo === 'tarefa' ? `Tarefa${it.minha ? ' <b>sua</b>' : ''}${it.sei ? ' · ' + escFD(it.sei) : ''}` : `Processo ${escFD(it.sei)}${it.titulo ? ' — ' + escFD(String(it.titulo).slice(0, 70)) : ''}`}</div>
        <div class="pz-barra"><i style="width:${progressoPz(it, agora).toFixed(0)}%"></i></div>
        <div class="pz-item-sub">Prazo de ${escFD(descricaoPrazoPz(it))} · vence ${escFD(dataHoraPz(it.fim))}</div>
      </div>`;
    const bloco = (titulo, arr) => arr.length ? `<div class="pz-grupo">${titulo}</div>${arr.map(linha).join('')}` : '';
    j.innerHTML = `
      <div class="pz-jcab"><b>⏱ Prazos</b><span>${_pzItens.length} correndo</span></div>
      <div class="pz-lista">
        ${!_pzDisponivel ? '<div class="pz-vazio">Os prazos ainda não estão ativos no banco (migração 018).</div>' : ''}
        ${_pzDisponivel && !_pzItens.length ? '<div class="pz-vazio">Nenhuma etapa ou tarefa com prazo correndo. 🎉</div>' : ''}
        ${bloco('⛔ Vencidos', grupos.vencido)}${bloco('🔥 Menos de 24 horas', grupos.critico)}${bloco('🟡 Em andamento', grupos.normal)}
      </div>
      <div class="pz-rodape">Atualiza sozinho a cada minuto. Feriados ainda não são descontados dos prazos em dias/horas úteis.</div>`;
    j.querySelectorAll('.pz-item').forEach((el) => {
      const abrir = () => { j.remove(); if (el.dataset.pzTipo === 'tarefa') abrirTarefasPz(); else if (el.dataset.pzSei) abrirProcessoPz(el.dataset.pzSei); };
      el.onclick = abrir; el.onkeydown = (e) => { if (e.key === 'Enter') abrir(); };
    });
  }

  /** Aviso flutuante quando algo entra em "menos de 24 h" — repete a cada 2 h por item. */
  function avisarCriticosPz() {
    const agora = Date.now();
    let vistos = {};
    try { vistos = JSON.parse(sessionStorage.getItem('sm_pz_avisos') || '{}'); } catch (e) { vistos = {}; }
    const novos = _pzItens.filter((it) => {
      const r = restantePz(it.fim, agora);
      if (r.nivel === 'normal') return false;
      const k = (it.tipo === 'tarefa' ? 't' : 'e') + (it.id || (it.sei + it.etapa_id));
      if (vistos[k] && agora - vistos[k] < 2 * 3600000) return false;
      vistos[k] = agora; return true;
    });
    try { sessionStorage.setItem('sm_pz_avisos', JSON.stringify(vistos)); } catch (e) { /* ok */ }
    if (!novos.length) return;
    const raizP = raizPz();
    raizP.querySelector('#pz-toast')?.remove();
    const t = document.createElement('div');
    t.id = 'pz-toast'; t.className = 'pz-toast';
    t.innerHTML = `<b>⏰ Prazo apertado</b>${novos.slice(0, 3).map((it) => `<div>${it.tipo === 'tarefa' ? '📋' : '📄'} ${escFD(String(it.nome).slice(0, 60))}${it.sei ? ' · ' + escFD(it.sei) : ''} — <b>${escFD(restantePz(it.fim, agora).texto)}</b></div>`).join('')}${novos.length > 3 ? `<div>e mais ${novos.length - 3}…</div>` : ''}<button type="button">ver prazos</button>`;
    t.querySelector('button').onclick = () => { t.remove(); alternarJanelaPz(); };
    raizP.appendChild(t);
    setTimeout(() => t.remove(), 12000);
  }

  // ==================== MODELOS PADRÃO (biblioteca de despachos) ====================
  // Reúne os modelos criados nas etapas dos fluxos e os criados aqui. Sugere modelos para o
  // processo aberto e avisa, ao criar um modelo, quando já existe um parecido.
  // Depende de: api, escFD, perfilTar(), despacho_master (validarModeloDsp, montarDespachoDsp,
  // DADOS_DSP, TIPOS_CAMPO_DSP, normDsp...), raizMod(), contextoProcessoMod() → { proc, etapas } | null,
  // usarModeloNoProcessoMod(modelo, ctx) e copiarTextoMod(texto).
  let _modCache = null;
  const VAZIAS_MOD = new Set('a o as os de da do das dos e em no na nos nas para por com sem que se ao aos um uma uns umas ou nº n este esta esse essa isso deste desta pelo pela pelos pelas seu sua seus suas ser foi sao são mais como sobre entre ate até'.split(' '));

  function palavrasMod(t) {
    return normDsp(String(t || '').replace(/\{\{[^}]*\}\}/g, ' ')).split(/[^a-z0-9]+/).filter((p) => p.length > 2 && !VAZIAS_MOD.has(p) && !/^\d+$/.test(p))
      .map((p) => p.length > 5 ? p.slice(0, 6) : p);   // raiz simples: "atualização" ~ "atualizar"
  }
  function vetorMod(partes) {
    const v = new Map();
    partes.forEach(([texto, peso]) => palavrasMod(texto).forEach((p) => v.set(p, (v.get(p) || 0) + peso)));
    return v;
  }
  function cossenoMod(a, b) {
    let dot = 0, na = 0, nb = 0;
    a.forEach((x, k) => { na += x * x; if (b.has(k)) dot += x * b.get(k); });
    b.forEach((x) => { nb += x * x; });
    return na && nb ? dot / Math.sqrt(na * nb) : 0;
  }
  const vetorDoModeloMod = (m) => vetorMod([[m.titulo, 3], [m.descricao, 2], [m.texto, 1]]);

  /** Modelos parecidos com o que está sendo escrito (0 a 1). */
  function parecidosMod(rascunho, modelos, ignorarId) {
    const v = vetorDoModeloMod(rascunho);
    if (v.size < 3) return [];
    return modelos.filter((m) => m.id !== ignorarId).map((m) => {
      let s = cossenoMod(v, vetorDoModeloMod(m));
      if (rascunho.subtipo_id && m.subtipo_id === rascunho.subtipo_id) s += 0.08;
      else if (rascunho.tipo_id && m.tipo_id === rascunho.tipo_id) s += 0.04;
      return { m, s: Math.min(1, s) };
    }).filter((x) => x.s >= 0.38).sort((a, b) => b.s - a.s).slice(0, 3);
  }

  /** Modelos que combinam com o processo: tipo/subtipo + palavras do objeto, situação e etapas pendentes. */
  function sugeridosParaProcessoMod(ctx, modelos) {
    if (!ctx || !ctx.proc) return [];
    const p = ctx.proc;
    const tipoNome = p.subtipos_processo?.tipos_processo?.nome || p.tipos_processo?.nome || '';
    const subNome = p.subtipos_processo?.nome || '';
    const pend = (ctx.etapas || []).filter((e) => e.status !== 'concluida').map((e) => e.nome).join(' ');
    const vq = vetorMod([[p.titulo, 2], [p.situacao_atual, 1], [pend, 3], [subNome, 1]]);
    return modelos.map((m) => {
      let s = cossenoMod(vq, vetorMod([[m.titulo, 3], [m.descricao, 2]])) * 0.8;
      const mesmoTipo = m.tipo && normDsp(m.tipo) === normDsp(tipoNome);
      const mesmoSub = m.subtipo && normDsp(m.subtipo) === normDsp(subNome);
      if (mesmoSub) s += 0.35; else if (mesmoTipo && !m.subtipo) s += 0.2; else if (mesmoTipo) s += 0.1;
      if (m.origem === 'etapa' && (ctx.etapas || []).some((e) => e.status !== 'concluida' && normDsp(m.titulo).includes(normDsp(e.nome)))) s += 0.3;
      return { m, s: Math.min(1, s), mesmoTipo };
    }).filter((x) => x.s >= 0.3 && (x.mesmoTipo || x.s >= 0.45)).sort((a, b) => b.s - a.s).slice(0, 3);
  }

  async function carregarModelosMod(forcar) {
    if (_modCache && !forcar) return _modCache;
    const r = await api('modelos/listar');
    _modCache = r && r.ok ? r : { ok: false, erro: (r && r.erro) || 'Não consegui carregar os modelos.', modelos: [], tipos: [] };
    return _modCache;
  }

  function podeEditarMod(m) {
    const p = perfilTar();
    if (p === 'consultor' || !p) return false;
    return m.origem === 'etapa' ? p === 'admin' : true;
  }

  function modalMod(html, largo) {
    const raizM = raizMod();
    raizM.querySelector('#mod-fundo')?.remove();
    const fundo = document.createElement('div');
    fundo.id = 'mod-fundo';
    fundo.innerHTML = `<div class="mod-janela${largo ? ' mod-larga' : ''}" role="dialog" aria-modal="true">${html}</div>`;
    raizM.appendChild(fundo);
    const fechar = () => fundo.remove();
    fundo.addEventListener('mousedown', (e) => { if (e.target === fundo) fechar(); });
    return { el: fundo.querySelector('.mod-janela'), fechar };
  }

  function chipTipoMod(m) {
    return m.tipo ? `<span class="mod-chip">${escFD(m.tipo)}${m.subtipo ? ' › ' + escFD(m.subtipo) : ''}</span>` : '<span class="mod-chip mod-chip-vazio">qualquer tipo</span>';
  }

  /** Janela principal: busca, filtro, sugeridos e lista. */
  async function abrirModelosMod(destacarId) {
    const m = modalMod('<div class="mod-cab"><h3>📝 Modelos padrão</h3><button class="mod-x" data-mod="fechar">✕</button></div><div class="mod-vazio"><span class="spinner"></span> Carregando…</div>', true);
    m.el.querySelector('[data-mod="fechar"]').onclick = m.fechar;
    const dados = await carregarModelosMod(true);
    const ctx = contextoProcessoMod();
    let busca = '', filtroTipo = '';
    const sugeridos = sugeridosParaProcessoMod(ctx, dados.modelos);
    const podeCriar = perfilTar() && perfilTar() !== 'consultor';

    const cartao = (mod, extra) => `
      <div class="mod-card${mod.id === destacarId ? ' mod-destaque' : ''}" data-mod-id="${escFD(mod.id)}">
        <div class="mod-card-cab">
          <div><div class="mod-titulo">${escFD(mod.titulo)}</div>${chipTipoMod(mod)} <span class="mod-origem mod-${mod.origem}">${mod.origem === 'etapa' ? '🔀 da etapa do fluxo' : '📚 biblioteca'}</span>${extra || ''}</div>
        </div>
        ${mod.descricao ? `<div class="mod-desc">${escFD(mod.descricao)}</div>` : ''}
        <div class="mod-meta">${mod.usos ? `usado ${mod.usos}× · ` : ''}${mod.atualizado_em ? 'atualizado em ' + new Date(mod.atualizado_em).toLocaleDateString('pt-BR') : ''}${mod.autor ? ' por ' + escFD(mod.autor) : ''}</div>
        <div class="mod-acoes">
          ${ctx && perfilTar() !== 'consultor' ? `<button class="btn mod-btn" data-mod-usar="${escFD(mod.id)}">⚡ Usar neste processo</button>` : ''}
          <button class="btn btn-secondary mod-btn" data-mod-ver="${escFD(mod.id)}">👁 Ver</button>
          <button class="btn btn-secondary mod-btn" data-mod-copiar="${escFD(mod.id)}">📋 Copiar</button>
          ${podeEditarMod(mod) ? `<button class="btn btn-secondary mod-btn" data-mod-editar="${escFD(mod.id)}">✎ Editar</button>` : ''}
          ${perfilTar() === 'admin' && mod.origem === 'biblioteca' ? `<button class="mod-lixo" data-mod-excluir="${escFD(mod.id)}" title="Excluir modelo">🗑</button>` : ''}
        </div>
        <div class="mod-ver" hidden></div>
      </div>`;

    const pintar = () => {
      const q = normDsp(busca);
      const lista = dados.modelos.filter((mod) => (!filtroTipo || mod.tipo_id === filtroTipo) && (!q || normDsp(`${mod.titulo} ${mod.descricao} ${mod.tipo} ${mod.subtipo}`).includes(q)));
      const grupos = new Map();
      lista.forEach((mod) => { const k = mod.tipo || 'Qualquer tipo'; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(mod); });
      m.el.innerHTML = `
        <div class="mod-cab"><h3>📝 Modelos padrão</h3><button class="mod-x" data-mod="fechar">✕</button></div>
        ${!dados.ok ? `<div class="mod-aviso">${escFD(dados.erro)}</div>` : ''}
        ${dados.ok && dados.disponivel === false ? '<div class="mod-aviso">A biblioteca ainda não está ativa no banco (migração 018). Os modelos das etapas aparecem normalmente.</div>' : ''}
        <div class="mod-filtros">
          <input data-mod="busca" placeholder="🔎 Buscar por título, descrição ou tipo" value="${escFD(busca)}">
          <select data-mod="tipo"><option value="">Todos os tipos</option>${dados.tipos.map((t) => `<option value="${escFD(t.id)}" ${filtroTipo === t.id ? 'selected' : ''}>${escFD(t.nome)}</option>`).join('')}</select>
          ${podeCriar ? '<button class="btn" data-mod="novo">+ Novo modelo</button>' : ''}
        </div>
        <div class="mod-corpo">
          ${sugeridos.length && !q && !filtroTipo ? `<div class="mod-sug"><div class="mod-sug-tit">✨ Sugeridos para o processo ${escFD(ctx.proc.numero_sei)}</div>
            ${sugeridos.map(({ m: mod, s }) => cartao(mod, ` <span class="mod-match">${Math.round(s * 100)}% de afinidade</span>`)).join('')}</div>` : ''}
          ${[...grupos.entries()].map(([g, arr]) => `<div class="mod-grupo">${escFD(g)} <span>${arr.length}</span></div>${arr.map((mod) => cartao(mod)).join('')}`).join('')
            || '<div class="mod-vazio">Nenhum modelo encontrado.</div>'}
        </div>`;
      ligar();
    };
    const acharMod = (id) => dados.modelos.find((x) => x.id === id);
    const ligar = () => {
      const q = (n) => m.el.querySelector(`[data-mod="${n}"]`);
      q('fechar').onclick = m.fechar;
      const busc = q('busca');
      busc.oninput = () => { busca = busc.value; const pos = busc.selectionStart; pintar(); const nb = m.el.querySelector('[data-mod="busca"]'); nb.focus(); nb.setSelectionRange(pos, pos); };
      q('tipo').onchange = (e) => { filtroTipo = e.target.value; pintar(); };
      q('novo') && (q('novo').onclick = () => abrirEditorMod(null, dados));
      m.el.querySelectorAll('[data-mod-ver]').forEach((b) => b.onclick = () => {
        const box = b.closest('.mod-card').querySelector('.mod-ver');
        if (!box.hidden) { box.hidden = true; return; }
        box.innerHTML = htmlPreviaModeloMod(acharMod(b.dataset.modVer), ctx); box.hidden = false;
      });
      m.el.querySelectorAll('[data-mod-copiar]').forEach((b) => b.onclick = async () => {
        const ok = await copiarTextoMod(textoPlanoModeloMod(acharMod(b.dataset.modCopiar), ctx));
        b.textContent = ok ? '✓ Copiado' : 'Não copiou'; setTimeout(() => { b.textContent = '📋 Copiar'; }, 1800);
      });
      m.el.querySelectorAll('[data-mod-editar]').forEach((b) => b.onclick = () => abrirEditorMod(acharMod(b.dataset.modEditar), dados));
      m.el.querySelectorAll('[data-mod-excluir]').forEach((b) => b.onclick = async () => {
        if (!confirm('Excluir este modelo da biblioteca?')) return;
        const r = await api('modelos/excluir', { id: b.dataset.modExcluir });
        if (!r || !r.ok) { alert((r && r.erro) || 'Não consegui excluir.'); return; }
        dados.modelos = dados.modelos.filter((x) => x.id !== b.dataset.modExcluir); pintar();
      });
      m.el.querySelectorAll('[data-mod-usar]').forEach((b) => b.onclick = () => {
        const mod = acharMod(b.dataset.modUsar); m.fechar();
        try { api('modelos/usar', { id: mod.id }); } catch (e) { /* contador é opcional */ }
        usarModeloNoProcessoMod(mod, ctx);
      });
      const dest = destacarId && m.el.querySelector('.mod-destaque');
      if (dest) { dest.scrollIntoView({ block: 'center' }); destacarId = null; }
    };
    pintar();
  }

  function ctxExemploMod(texto, ctx) {
    const v = validarModeloDsp(texto);
    const c = { dados: {}, docs: {}, campos: {} };
    if (ctx && ctx.proc && typeof dadosDoProcessoMod === 'function') c.dados = dadosDoProcessoMod(ctx);
    return { v, c };
  }
  function htmlPreviaModeloMod(mod, ctx) {
    const { c } = ctxExemploMod(mod.texto, ctx);
    const r = montarDespachoDsp(mod.texto, c);
    return `<div class="mod-previa">${r.previaDestinatario !== null ? `<p><b>Destinatário:</b> ${r.previaDestinatario}</p>` : ''}${r.previa}</div>
      <div class="mod-dica">${ctx && ctx.proc ? 'Dados do processo aberto já preenchidos; ' : ''}o que está em amarelo é preenchido na hora de gerar.</div>`;
  }
  function textoPlanoModeloMod(mod, ctx) {
    const { c } = ctxExemploMod(mod.texto, ctx);
    const r = montarDespachoDsp(mod.texto, c);
    const plano = (h) => h.replace(/<\/(p|li)>/g, '\n').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').trim();
    return (r.previaDestinatario !== null ? 'Destinatário: ' + plano(r.previaDestinatario) + '\n' : '') + plano(r.previa);
  }

  // ---------- Barra de variáveis (genérica, para qualquer textarea) ----------
  function ligarBarraVariaveisMod(caixa, ta, aoMudar) {
    const pop = caixa.querySelector('[data-var="pop"]');
    const inserir = (token) => {
      const ini = ta.selectionStart ?? ta.value.length, fim = ta.selectionEnd ?? ini;
      ta.value = ta.value.slice(0, ini) + token + ta.value.slice(fim);
      ta.focus(); ta.selectionStart = ta.selectionEnd = ini + token.length;
      pop.hidden = true; pop.innerHTML = ''; aoMudar();
    };
    const abrir = (html) => { pop.innerHTML = html + '<button type="button" class="mod-link" data-var="cancelar">cancelar</button>'; pop.hidden = false; pop.querySelector('[data-var="cancelar"]').onclick = () => { pop.hidden = true; }; return pop; };
    const limpo = (s) => s.replace(/[{}|:]/g, ' ').replace(/\s+/g, ' ').trim();
    caixa.querySelector('[data-var="dado"]').onclick = () => {
      const p = abrir(`<b>📌 Dado do processo</b> <span class="mod-dica">preenchido sozinho</span><div class="mod-ops">${DADOS_DSP.map((d) => `<button type="button" class="mod-op" data-var-dado="${d.chave}">${escFD(d.rotulo)}</button>`).join('')}</div>`);
      p.querySelectorAll('[data-var-dado]').forEach((b) => b.onclick = () => inserir(`{{${b.dataset.varDado}}}`));
    };
    caixa.querySelector('[data-var="doc"]').onclick = () => {
      const p = abrir(`<b>🔗 Documento do processo</b> <span class="mod-dica">o usuário confirma na árvore; vira link SEI</span>
        <div class="mod-linha"><input data-var="nome" placeholder="Como chamar este documento (ex.: Parecer da CMA)"><select data-var="fmt"><option value="">Nome + nº</option><option value="id">Só o nº SEI</option></select><button type="button" class="btn" data-var="ok">Inserir</button></div>`);
      p.querySelector('[data-var="nome"]').focus();
      p.querySelector('[data-var="ok"]').onclick = () => { const n = limpo(p.querySelector('[data-var="nome"]').value); if (n) inserir(`{{doc: ${n}${p.querySelector('[data-var="fmt"]').value ? ' | id' : ''}}}`); };
    };
    caixa.querySelector('[data-var="campo"]').onclick = () => {
      const p = abrir(`<b>✍️ Campo a preencher</b> <span class="mod-dica">perguntado na hora de gerar</span>
        <div class="mod-linha"><input data-var="nome" placeholder="Nome do campo (ex.: Valor do investimento)"><select data-var="tipo">${Object.entries(TIPOS_CAMPO_DSP).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
        <div class="mod-linha" data-var="lista" hidden><input data-var="opcoes" placeholder="Opções separadas por ; (ex.: CTAI; CMA; GAOCG)"></div><button type="button" class="btn" data-var="ok">Inserir</button>`);
      const q = (n) => p.querySelector(`[data-var="${n}"]`); q('nome').focus();
      q('tipo').onchange = () => { q('lista').hidden = q('tipo').value !== 'lista'; };
      q('ok').onclick = () => {
        const n = limpo(q('nome').value); if (!n) return;
        const t = q('tipo').value;
        if (t === 'lista') { const ops = q('opcoes').value.split(';').map((x) => x.replace(/[{}|]/g, ' ').trim()).filter(Boolean); if (!ops.length) return; inserir(`{{campo: ${n} | lista: ${ops.join('; ')}}}`); }
        else inserir(`{{campo: ${n}${t === 'texto' ? '' : ' | ' + t}}}`);
      };
    };
  }
  const HTML_BARRA_VARIAVEIS_MOD = `<div class="mod-barra"><button type="button" class="btn btn-secondary mod-btn" data-var="dado">📌 Dado do processo</button><button type="button" class="btn btn-secondary mod-btn" data-var="doc">🔗 Documento</button><button type="button" class="btn btn-secondary mod-btn" data-var="campo">✍️ Campo a preencher</button></div><div class="mod-pop" data-var="pop" hidden></div>`;

  /** Criar / editar modelo, com conferência das variáveis e aviso de modelo parecido. */
  function abrirEditorMod(mod, dados, meuRascunho) {
    const ehEtapa = mod && mod.origem === 'etapa';
    const atual = { id: mod ? mod.id : null, titulo: mod ? mod.titulo : '', descricao: mod ? mod.descricao : '', tipo_id: mod ? mod.tipo_id || '' : '', subtipo_id: mod ? mod.subtipo_id || '' : '', texto: mod ? mod.texto : '' };
    const m = modalMod(`
      <div class="mod-cab"><h3>${mod ? '✎ Editar modelo' : '📝 Novo modelo padrão'}</h3><button class="mod-x" data-mod="fechar">✕</button></div>
      <div class="mod-corpo">
        ${ehEtapa ? '<div class="mod-aviso">Este modelo pertence a uma etapa do fluxo: só o texto pode ser alterado aqui (título, tipo e etapa vêm do fluxo).</div>' : ''}
        <div class="mod-form">
          <label>Tipo de processo<select data-mod="tipo" ${ehEtapa ? 'disabled' : ''}><option value="">— escolha —</option>${dados.tipos.map((t) => `<option value="${escFD(t.id)}" ${atual.tipo_id === t.id ? 'selected' : ''}>${escFD(t.nome)}</option>`).join('')}</select></label>
          <label>Subtipo <small>(opcional)</small><select data-mod="subtipo" ${ehEtapa ? 'disabled' : ''}></select></label>
          <label class="mod-full">Título<input data-mod="titulo" maxlength="160" value="${escFD(atual.titulo)}" ${ehEtapa ? 'disabled' : ''} placeholder="Ex.: Solicitação de nova SOF por mudança de exercício"></label>
          <label class="mod-full">Para que serve e em quais situações usar<textarea data-mod="descricao" rows="2" maxlength="1000" ${ehEtapa ? 'disabled' : ''} placeholder="Ex.: Quando o aditivo de investimento muda de exercício e a GAOCG precisa emitir nova SOF.">${escFD(atual.descricao)}</textarea></label>
        </div>
        <div data-mod="parecido"></div>
        ${meuRascunho ? `<details class="mod-parecido" open><summary class="mod-par-tit">📎 O texto que você estava escrevendo</summary><div class="mod-dica">Copie daqui o que quiser aproveitar neste modelo:</div><textarea readonly rows="4" class="mod-texto">${escFD(meuRascunho)}</textarea></details>` : ''}
        <label class="mod-rot">Texto do despacho</label>
        <div data-mod="barra">${HTML_BARRA_VARIAVEIS_MOD}</div>
        <textarea data-mod="texto" rows="10" class="mod-texto" placeholder="Destinatário: {{setor}}&#10;Encaminham-se os autos ...">${escFD(atual.texto)}</textarea>
        <div data-mod="conf"></div>
        <div class="mod-dica">Cada linha vira um parágrafo justificado; comece com <code>Destinatário: ...</code>. <code>**negrito**</code>, <code>*itálico*</code>, <code>__sublinhado__</code>, <code>- lista</code>.</div>
        <details class="mod-prev-det"><summary>👁 Prévia</summary><div data-mod="previa"></div></details>
      </div>
      <div class="mod-rodape"><span class="mod-st" data-mod="st"></span><button class="btn btn-secondary" data-mod="voltar">Voltar</button><button class="btn" data-mod="salvar">Salvar modelo</button></div>`, true);
    const q = (n) => m.el.querySelector(`[data-mod="${n}"]`);
    const pintarSub = () => {
      const t = dados.tipos.find((x) => x.id === q('tipo').value);
      const subs = t ? (t.subtipos_processo || []) : [];
      q('subtipo').innerHTML = `<option value="">— todos os subtipos —</option>${subs.map((s) => `<option value="${escFD(s.id)}" ${atual.subtipo_id === s.id ? 'selected' : ''}>${escFD(s.nome)}</option>`).join('')}`;
    };
    pintarSub();
    q('tipo').onchange = () => { atual.subtipo_id = ''; pintarSub(); conferir(); };
    q('fechar').onclick = m.fechar;
    q('voltar').onclick = () => abrirModelosMod(mod ? mod.id : null);
    let espera = null;
    const conferir = () => {
      const texto = q('texto').value;
      const v = validarModeloDsp(texto);
      q('conf').innerHTML = !texto.trim() ? '' : v.erros.length ? `<div class="mod-erro">⚠ ${v.erros.map(escFD).join('<br>⚠ ')}</div>`
        : `<div class="mod-ok">✓ Modelo conferido: ${[v.dados.length ? v.dados.length + ' dado(s) automático(s)' : '', v.docs.length ? v.docs.length + ' documento(s)' : '', v.campos.length ? v.campos.length + ' campo(s) a preencher' : ''].filter(Boolean).join(' · ') || 'sem variáveis'}.</div>${v.avisos.map((a) => `<div class="mod-aviso-txt">${escFD(a)}</div>`).join('')}`;
      const det = m.el.querySelector('.mod-prev-det');
      if (det.open) q('previa').innerHTML = htmlPreviaModeloMod({ texto }, null);
      clearTimeout(espera);
      espera = setTimeout(() => {
        if (ehEtapa) return;
        const rasc = { titulo: q('titulo').value, descricao: q('descricao').value, texto, tipo_id: q('tipo').value, subtipo_id: q('subtipo').value };
        const par = parecidosMod(rasc, dados.modelos, mod ? mod.id : null);
        q('parecido').innerHTML = par.length ? `<div class="mod-parecido"><div class="mod-par-tit">🔎 Já existe modelo parecido</div>${par.map(({ m: x, s }) => `
          <div class="mod-par-item"><div><b>${escFD(x.titulo)}</b> ${chipTipoMod(x)} <span class="mod-match">${Math.round(s * 100)}% parecido</span>${x.descricao ? `<div class="mod-dica">${escFD(x.descricao)}</div>` : ''}</div>
          <div class="mod-par-acoes"><button type="button" class="btn btn-secondary mod-btn" data-par-usar="${escFD(x.id)}">Usar este</button>${podeEditarMod(x) ? `<button type="button" class="btn btn-secondary mod-btn" data-par-atualizar="${escFD(x.id)}">Atualizar este</button>` : ''}</div></div>`).join('')}
          <div class="mod-dica">Se o seu caso é diferente, continue: o novo modelo fica ao lado do existente.</div></div>` : '';
        q('parecido').querySelectorAll('[data-par-usar]').forEach((b) => b.onclick = () => {
          const x = dados.modelos.find((y) => y.id === b.dataset.parUsar);
          const ctx = contextoProcessoMod();
          if (ctx && perfilTar() !== 'consultor') { m.fechar(); try { api('modelos/usar', { id: x.id }); } catch (e) { /* ok */ } usarModeloNoProcessoMod(x, ctx); }
          else abrirModelosMod(x.id);
        });
        q('parecido').querySelectorAll('[data-par-atualizar]').forEach((b) => b.onclick = () => {
          const x = dados.modelos.find((y) => y.id === b.dataset.parAtualizar);
          const meu = q('texto').value.trim();
          abrirEditorMod(x, dados, meu || null);
        });
      }, 450);
    };
    m.el.querySelector('.mod-prev-det').addEventListener('toggle', conferir);
    ['texto', 'titulo', 'descricao'].forEach((n) => q(n).addEventListener('input', conferir));
    q('subtipo').onchange = conferir;
    ligarBarraVariaveisMod(q('barra'), q('texto'), conferir);
    conferir();
    q('salvar').onclick = async () => {
      const texto = q('texto').value;
      const v = validarModeloDsp(texto);
      const st = q('st');
      if (v.erros.length) { st.textContent = 'Corrija o texto: ' + v.erros[0]; return; }
      if (!ehEtapa && !q('titulo').value.trim()) { st.textContent = 'Dê um título ao modelo.'; q('titulo').focus(); return; }
      if (!ehEtapa && !q('tipo').value) { st.textContent = 'Escolha o tipo de processo.'; return; }
      if (!ehEtapa && !q('descricao').value.trim()) { st.textContent = 'Descreva para que serve o modelo (ajuda o sistema a sugeri-lo).'; q('descricao').focus(); return; }
      q('salvar').disabled = true; st.textContent = 'Salvando…';
      const r = await api('modelos/salvar', { id: mod ? mod.id : null, titulo: q('titulo').value, descricao: q('descricao').value, tipo_id: q('tipo').value, subtipo_id: q('subtipo').value, texto });
      q('salvar').disabled = false;
      if (!r || !r.ok) { st.textContent = '⚠ ' + ((r && r.erro) || 'Não consegui salvar.'); return; }
      _modCache = null;
      abrirModelosMod(r.id);
    };
  }

  // ==================== PAINEL GERAL: gráficos, tempo médio, orçamento e resumo da IA ====================
  const PALETA_TIPOS_EXT = ['#1a56db', '#0d9488', '#d97706', '#7c3aed', '#db2777', '#16a34a', '#0891b2', '#b45309', '#6b7280'];
  const NATUREZAS_ORC_EXT = {
    regular: { rotulo: 'Regular', cor: '#1a56db' },
    unico: { rotulo: 'Único', cor: '#0d9488' },
    temporario: { rotulo: 'Temporário', cor: '#d97706' },
    indefinida: { rotulo: 'Sem natureza', cor: '#9ca3af' },
  };
  const ESTAGIOS_ORC_EXT = [
    { id: 'solicitado', rotulo: 'Solicitado', sub: 'aguardando liberação (DDO)', icone: '📝' },
    { id: 'liberado', rotulo: 'Liberado', sub: 'aguardando empenho', icone: '🔓' },
    { id: 'empenhado', rotulo: 'Empenhado', sub: 'aguardando formalização', icone: '🔒' },
    { id: 'formalizado', rotulo: 'Formalizado', sub: 'Termo Aditivo concluído', icone: '✅' },
  ];
  let _painelDadosExt = null;

  function brlExt(v) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    const n = Number(v);
    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 });
  }
  function diasTxtExt(v) { return v === null || v === undefined ? '—' : String(v).replace('.', ',') + ' d'; }

  const SEM_TIPO_EXT = 'Sem tipo';
  function tipoDoProcessoExt(p) { return p.subtipos_processo?.tipos_processo?.nome || p.tipos_processo?.nome || SEM_TIPO_EXT; }
  function semAcentoExt(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

  function calcTempoExt(lista) {
    const v = lista.filter((p) => p.ativo && p.dias_tramitacao !== null && p.dias_tramitacao !== undefined).map((p) => p.dias_tramitacao).sort((a, b) => a - b);
    if (!v.length) return { n: 0, media: null, mediana: null };
    const media = v.reduce((a, b) => a + b, 0) / v.length;
    const m = Math.floor(v.length / 2);
    const mediana = v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
    return { n: v.length, media: Math.round(media * 10) / 10, mediana: Math.round(mediana * 10) / 10 };
  }

  function agruparPorExt(lista, fn) {
    const mapa = new Map();
    lista.forEach((p) => { const k = fn(p); if (!mapa.has(k)) mapa.set(k, []); mapa.get(k).push(p); });
    return [...mapa.entries()].sort((a, b) => b[1].length - a[1].length || String(a[0]).localeCompare(String(b[0]), 'pt-BR'));
  }

  /** Mesma regra do servidor, aplicada à fatia de processos escolhida no filtro. */
  function agregarOrcamentoExt(lista, ano) {
    const estagios = {};
    ESTAGIOS_ORC_EXT.forEach((e) => {
      estagios[e.id] = { qtd: 0, mensal: 0, anual: 0, por_natureza: {} };
      Object.keys(NATUREZAS_ORC_EXT).forEach((n) => { estagios[e.id].por_natureza[n] = { qtd: 0, mensal: 0, anual: 0, processos: [] }; });
    });
    let outros = 0; const lacunas = [];
    lista.forEach((p) => {
      const o = p.orcamento; if (!o) return;
      if (o.estagio === 'formalizado') { if (o.formalizado_ano !== ano) { outros++; return; } } else if (!p.ativo) return;
      if (o.lacuna) lacunas.push({ numero_sei: p.numero_sei, motivo: o.lacuna });
      const a = estagios[o.estagio], n = a.por_natureza[o.natureza];
      a.qtd++; n.qtd++; a.mensal += o.mensal || 0; n.mensal += o.mensal || 0; a.anual += o.anual || 0; n.anual += o.anual || 0;
      n.processos.push(p.numero_sei);
    });
    return { estagios, formalizados_outros_anos: outros, lacunas };
  }

  function htmlSecaoPainelExt(titulo, corpo, aberto) {
    return `<details class="pg-sec" ${aberto ? 'open' : ''}><summary>${titulo}</summary><div class="pg-sec-corpo">${corpo}</div></details>`;
  }

  function htmlLinhaProcPainelExt(p, extra) {

      <div class="pg-proc-topo"><b>${escHtmlSite(p.numero_sei)}</b><span class="pg-proc-extra">${extra || ''}</span></div>

  function htmlKpisPainelExt(procs, ativos) {

  /** Geral: um bloco por tipo, com os subtipos logo abaixo. Com filtro de tipo: um bloco por subtipo. */

        </div>

  const NOMES_MES_EXT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function fmtNumGraficoExt(v) { return Number.isInteger(v) ? v.toLocaleString('pt-BR') : v.toLocaleString('pt-BR', { maximumFractionDigits: 2 }); }

  function htmlGraficoIAExt(g) {

      <div class="pg-rosca-wrap">

          <text x="21" y="22.5" text-anchor="middle" font-size="6" font-weight="700" fill="#374151">${fmtNumGraficoExt(total)}</text></svg>
        <div class="pg-legenda pg-legenda-col">${g.itens.map((it, i) => `<span><span class="pg-dot" style="background:${PALETA_TIPOS_EXT[i % PALETA_TIPOS_EXT.length]};"></span>${escHtmlSite(it.rotulo)} — ${fmtNumGraficoExt(it.valor)}</span>`).join('')}</div>
      </div></div>`;

  /** Markdown simples e seguro (títulos, listas, negrito) — tudo é escapado antes. */
  function htmlTextoIAExt(texto) {
    const inline = (s) => escHtmlSite(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    let html = '', emLista = false;
    const fechaLista = () => { if (emLista) { html += '</ul>'; emLista = false; } };
    texto.replace(/\r/g, '').split('\n').forEach((linha) => {
      const t = linha.trim();
      if (!t) { fechaLista(); return; }
      let mm;
      if ((mm = t.match(/^#{1,4}\s+(.*)$/))) { fechaLista(); html += `<div class="pg-ia-h">${inline(mm[1])}</div>`; return; }
      if ((mm = t.match(/^[-*•]\s+(.*)$/))) { if (!emLista) { html += '<ul class="pg-ia-ul">'; emLista = true; } html += `<li>${inline(mm[1])}</li>`; return; }
      fechaLista(); html += `<p class="pg-ia-p">${inline(t)}</p>`;
    });
    fechaLista();
    return html;
  }

  function validarGraficosExt(lista) {
    const saida = [];
    (Array.isArray(lista) ? lista : []).slice(0, 6).forEach((g) => {
      if (!g || !['barras', 'rosca'].includes(g.tipo) || typeof g.titulo !== 'string' || !Array.isArray(g.itens)) return;
      const itens = g.itens.slice(0, 12)
        .map((it) => ({ rotulo: String(it?.rotulo ?? '').slice(0, 60), valor: Number(it?.valor) }))
        .filter((it) => it.rotulo && Number.isFinite(it.valor) && it.valor >= 0);

  /** Procura, no texto colado, o bloco JSON de gráficos (formato novo: geral + tipos; formato antigo: só "graficos"). */
  function extrairGraficosIAExt(texto) {
    const resultado = { texto: texto, geral: [], porTipo: {}, aviso: '' };
    let candidato = null;
    const re = /```[a-zA-Z]*\s*([\s\S]*?)```/g;
    let m;
    while ((m = re.exec(texto))) { if (/"graficos"/.test(m[1])) candidato = { bruto: m[1], inteiro: m[0] }; }
    if (!candidato) {
      const i = texto.search(/\{\s*"versao"/);
      const f = texto.lastIndexOf('}');
      if (i >= 0 && f > i) candidato = { bruto: texto.slice(i, f + 1), inteiro: texto.slice(i, f + 1) };
    }
    if (!candidato) return resultado;
    let obj;
    try { obj = JSON.parse(candidato.bruto.trim()); } catch (e) {
      resultado.aviso = 'Encontrei os dados dos gráficos, mas não consegui lê-los (o formato veio incorreto). O texto está completo; se quiser os gráficos, peça à IA para reenviar apenas o bloco json.';
      return resultado;
    }
    resultado.texto = texto.replace(candidato.inteiro, '').trim();
    resultado.geral = validarGraficosExt(obj?.geral?.graficos || obj?.graficos);
    (Array.isArray(obj?.tipos) ? obj.tipos : []).forEach((t) => {
      if (t && typeof t.tipo === 'string') resultado.porTipo[semAcentoExt(t.tipo)] = validarGraficosExt(t.graficos);
    });
    if (!resultado.geral.length && !Object.values(resultado.porTipo).some((l) => l.length)) resultado.aviso = 'O bloco de gráficos veio sem itens válidos — mostrei só o texto.';
    return resultado;
  }

  /** Divide o texto da IA pelas linhas "# GERAL" e "# TIPO: nome". Sem marcadores, tudo é "geral" (formato antigo). */
  function fatiarResumoIAExt(texto) {
    const geral = []; const tipos = {};
    let atual = geral, temMarca = false;
    texto.replace(/\r/g, '').split('\n').forEach((linha) => {
      const t = linha.trim().replace(/^\*+|\*+$/g, '').trim();
      let mm;
      if (/^#(?!#)\s*(geral|vis[aã]o geral|panorama geral)\s*$/i.test(t)) { atual = geral; temMarca = true; return; }
      if ((mm = t.match(/^#(?!#)\s*tipo\s*:\s*(.+?)\s*$/i))) {
        const k = semAcentoExt(mm[1].replace(/[*_`]/g, ''));
        atual = tipos[k] = tipos[k] || []; temMarca = true; return;
      }
      atual.push(linha);
    });
    const out = {};
    Object.keys(tipos).forEach((k) => { out[k] = tipos[k].join('\n').trim(); });
    return { temMarca, geral: geral.join('\n').trim(), tipos: out };
  }

  function htmlResultadoIAExt(texto, meta, filtro) {
    const ext = extrairGraficosIAExt(texto);
    const fat = fatiarResumoIAExt(ext.texto);
    let graficos = ext.geral, corpoTxt = fat.geral, aviso2 = '';
    if (filtro) {
      const k = semAcentoExt(filtro);
      if (!fat.temMarca) {
        graficos = []; corpoTxt = '';
        aviso2 = 'Este resumo foi gerado sem separação por tipo. Copie o prompt atualizado, gere de novo no NotebookLM e cole aqui para ver o resumo de ' + filtro + '.';
      } else {
        graficos = ext.porTipo[k] || []; corpoTxt = fat.tipos[k] || '';
        if (!corpoTxt) aviso2 = 'A IA não gerou uma seção para "' + filtro + '" neste resumo. Gere de novo com o prompt atualizado.';
      }
    }
    return `
      ${meta ? `<div class="pg-dica">${meta}</div>` : ''}
      ${ext.aviso ? `<div class="pg-aviso">${escHtmlSite(ext.aviso)}</div>` : ''}
      ${aviso2 ? `<div class="pg-aviso">${escHtmlSite(aviso2)}</div>` : ''}
      ${graficos.length ? `<div class="pg-dica">📊 Gráficos montados a partir do resumo da IA — confira os números com os indicadores acima.</div>${graficos.map(htmlGraficoIAExt).join('')}` : ''}
      ${corpoTxt ? `<div class="pg-ia-texto">${htmlTextoIAExt(corpoTxt)}</div>` : ''}
      ${!filtro && fat.temMarca && Object.keys(fat.tipos).length ? '<div class="pg-dica" style="margin-top:8px;">O resumo de cada tipo aparece ao escolher o tipo nos botões do topo.</div>' : ''}`;
  }

  /** filtro = nome do tipo escolhido (ou null para o geral). */
  function htmlPainelCompletoExt(painel, ultimo, ativos, filtro) {

  function ativarPainelExt(painel, filtro) {

      btn.disabled = true;
      try {
        const pronto = await modeloProntoRA();

    document.getElementById('pg-ia-baixar')?.addEventListener('click', async (ev) => {

      box.innerHTML = `<select id="pg-ia-hist-sel">${r.resumos.map((x, i) => `<option value="${i}">${formatarDataHora(x.criado_em)}${x.perfis?.nome ? ' — ' + escHtmlSite(x.perfis.nome) : ''}${x.origem ? ' (IA local)' : ''}</option>`).join('')}</select>`;
