  }

  /** Nº do documento no SEI (e valor, se houver) registrados ao concluir a etapa. */
  function htmlDocEtapaSite(e, i) {
    return htmlDocsNoMD(e, `onclick="event.stopPropagation();editarDocsEtapaSite(${i})"`);
  }

  // ---- etapa atual: setores, importância e modelos padrão ----
  function preencherMarcadoresModelo(texto, proc) {
    const hoje = new Date().toLocaleDateString('pt-BR');
    const tipo = proc.subtipos_processo?.tipos_processo?.nome || proc.tipos_processo?.nome || '';
    const valores = {
      '[Nº DO PROCESSO]': proc.numero_sei || '',
      '[OBJETO]': proc.titulo || '',
      '[TIPO DE PROCESSO]': tipo,
      '[SUBTIPO]': proc.subtipos_processo?.nome || '',
      '[UNIDADE]': proc.unidades?.nome || '',
      '[DATA]': hoje,
    };
    let out = texto || '';
    Object.keys(valores).forEach((m) => { if (valores[m]) out = out.split(m).join(valores[m]); });
    return out;
  }

  async function copiarTextoSite(texto) {
    try { await navigator.clipboard.writeText(texto); return true; } catch { /* tenta o método antigo */ }
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
    return ok;
  }

  /** Organiza as etapas alcançadas em FAIXAS (linhas) e COLUNAS (níveis):
   *  - cada ramo que sai de uma bifurcação em paralelo ganha a sua própria faixa e as etapas
   *    seguintes ficam nela até chegarem a uma etapa comum;
   *  - etapas onde vários ramos se encontram (junções) voltam para a faixa de onde o fluxo
   *    se dividiu (o meio, no caso típico);
   *  - decisões (gateway) não abrem faixas novas.
   *  A posição é calculada sobre o fluxo completo do subtipo — por isso não "pula" quando
   *  novas etapas são alcançadas. Conexões de retorno não entram no desenho. */
  function layoutJornadaGrafo(etapas, conexoes) {
    const n = etapas.length;
    const idxPorEtapa = {};
    etapas.forEach((e, i) => { idxPorEtapa[e.etapa_id] = i; });

    if (!Array.isArray(conexoes) || !conexoes.length) {   // sem conexões (backend antigo): uma fila
      const arestas = [];
      for (let i = 0; i < n - 1; i++) arestas.push([i, i + 1, etapas[i].status === 'concluida' ? 1 : 0, 'r', 0]);
      return { ncols: Math.max(n, 1), nrows: 1, pos: etapas.map((_, i) => ({ col: i, row: 0 })), arestas };
    }

    // 1) grafo completo (todas as etapas do fluxo, alcançadas ou não)
    const iniciais = [], todasIds = [];
    const filhosAll = {};
    const vistoId = (id) => { if (!todasIds.includes(id)) todasIds.push(id); };
    conexoes.forEach((c) => {
      vistoId(c.etapa_destino_id);
      if (!c.etapa_origem_id) { if (!iniciais.includes(c.etapa_destino_id)) iniciais.push(c.etapa_destino_id); return; }
      vistoId(c.etapa_origem_id);
      const f = (filhosAll[c.etapa_origem_id] = filhosAll[c.etapa_origem_id] || []);
      if (!f.includes(c.etapa_destino_id)) f.push(c.etapa_destino_id);
    });
    etapas.forEach((e) => vistoId(e.etapa_id));

    // 2) conexões de retorno (busca em profundidade a partir do início)
    const marca = {}, retorno = new Set();
    const dfs = (u) => {
      marca[u] = 1;
      (filhosAll[u] || []).forEach((v) => {
        if (marca[v] === 1) retorno.add(u + '>' + v);
        else if (!marca[v]) dfs(v);
      });
      marca[u] = 2;
    };
    iniciais.forEach((u) => { if (!marca[u]) dfs(u); });
    todasIds.forEach((u) => { if (!marca[u]) dfs(u); });

    const filhos = {}, pais = {};
    todasIds.forEach((u) => { filhos[u] = []; pais[u] = []; });
    Object.keys(filhosAll).forEach((o) => filhosAll[o].forEach((d) => {
      if (retorno.has(o + '>' + d)) return;
      filhos[o].push(d); pais[d].push(o);
    }));

    // 3) nível (coluna) = caminho mais longo desde o início
    const nivel = {};
    const calcNivel = (u) => {
      if (nivel[u] !== undefined) return nivel[u];
      nivel[u] = 0;
      nivel[u] = pais[u].length ? Math.max(...pais[u].map((p) => calcNivel(p) + 1)) : 0;
      return nivel[u];
    };
    todasIds.forEach(calcNivel);

    const ancestrais = {};
    const calcAnc = (u) => {
      if (ancestrais[u]) return ancestrais[u];
      ancestrais[u] = new Set();
      pais[u].forEach((p) => { ancestrais[u].add(p); calcAnc(p).forEach((a) => ancestrais[u].add(a)); });
      return ancestrais[u];
    };

    // 4) faixas
    const tipoDe = {};
    etapas.forEach((e) => { tipoDe[e.etapa_id] = e.tipo; });
    const ehBifurcacao = (u) => tipoDe[u] !== 'gateway' && filhos[u].length >= 2;
    const ordemFaixas = ['T'];            // de cima para baixo; 'T' = faixa central (tronco)
    const faixaDe = {}, ramoDe = {};
    const criarRamos = (p) => {
      const fs = filhos[p], acima = Math.floor(fs.length / 2);
      const novos = fs.map((f) => 'R:' + p + ':' + f);
      const base = ordemFaixas.indexOf(faixaDe[p]);
      ordemFaixas.splice(base, 0, ...novos.slice(0, acima));
      ordemFaixas.splice(ordemFaixas.indexOf(faixaDe[p]) + 1, 0, ...novos.slice(acima));
      fs.forEach((f, i) => { ramoDe[p + '>' + f] = novos[i]; });
    };
    const ordemProc = todasIds.map((id, k) => ({ id, k })).sort((a, b) => (nivel[a.id] - nivel[b.id]) || (a.k - b.k)).map((x) => x.id);
    ordemProc.forEach((u) => {
      const ps = pais[u];
      if (!ps.length) faixaDe[u] = 'T';
      else if (ps.length === 1) faixaDe[u] = ehBifurcacao(ps[0]) ? ramoDe[ps[0] + '>' + u] : faixaDe[ps[0]];
      else {
        const faixas = new Set(ps.map((p) => faixaDe[p]));
        if (faixas.size === 1) faixaDe[u] = [...faixas][0];
        else {   // junção: volta à faixa do ancestral comum mais próximo
          let comuns = null;
          ps.forEach((p) => {
            const a = new Set([p, ...calcAnc(p)]);
            comuns = comuns ? new Set([...comuns].filter((x) => a.has(x))) : a;
          });
          const melhor = [...comuns].sort((x, y) => nivel[y] - nivel[x])[0];
          faixaDe[u] = melhor !== undefined ? faixaDe[melhor] : 'T';
        }
      }
      if (ehBifurcacao(u)) criarRamos(u);
    });

    // etapas alcançadas que cairiam na mesma faixa e coluna (ex.: respostas alternativas de uma
    // decisão) ganham uma subfaixa logo abaixo, em vez de ficarem empilhadas sobre a linha
    const ocupado = {};
    etapas.forEach((e) => {
      const id = e.etapa_id, f = faixaDe[id], k = f + '|' + nivel[id];
      if (!ocupado[k]) { ocupado[k] = 1; return; }
      const nova = f + '#' + ocupado[k]++;
      let p = ordemFaixas.indexOf(f);
      while (ordemFaixas[p + 1] && ordemFaixas[p + 1].startsWith(f + '#')) p++;
      ordemFaixas.splice(p + 1, 0, nova);
      faixaDe[id] = nova;
    });

    // 5) compacta: só colunas e faixas que têm etapa alcançada
    const niveisUsados = [...new Set(etapas.map((e) => nivel[e.etapa_id]))].sort((a, b) => a - b);
    const faixasUsadas = ordemFaixas.filter((f) => etapas.some((e) => faixaDe[e.etapa_id] === f));
    const pos = etapas.map((e) => ({ col: niveisUsados.indexOf(nivel[e.etapa_id]), row: faixasUsadas.indexOf(faixaDe[e.etapa_id]) }));

    // 6) arestas entre etapas alcançadas
    const arestas = [];
    conexoes.forEach((c) => {
      const o = idxPorEtapa[c.etapa_origem_id], d = idxPorEtapa[c.etapa_destino_id];
      if (c.etapa_origem_id == null || o === undefined || d === undefined || o === d) return;
      if (retorno.has(c.etapa_origem_id + '>' + c.etapa_destino_id)) return;
      const eo = etapas[o];
      if (eo.tipo === 'gateway' && eo.status === 'concluida' && eo.conexao_escolhida_id && eo.conexao_escolhida_id !== c.id) return;
      if (arestas.some((a) => a[0] === o && a[1] === d)) return;
      const tipo = pos[o].row === pos[d].row ? 'r' : (pais[c.etapa_destino_id].length >= 2 ? 'j' : 'd');
      let desvio = 0;
      if (tipo !== 'd') {
        desvio = etapas.some((_, w) => w !== o && w !== d && pos[w].row === pos[o].row && pos[w].col > pos[o].col && pos[w].col < pos[d].col) ? 1 : 0;
      }
      arestas.push([o, d, eo.status === 'concluida' ? 1 : 0, tipo, desvio]);
    });
    return { ncols: Math.max(niveisUsados.length, 1), nrows: Math.max(faixasUsadas.length, 1), pos, arestas };
  }

  /** HTML do caminho em faixas. htmlNo(etapa, indice) devolve o HTML de cada bolinha
   *  (precisa incluir data-jn="<indice>"). As linhas são desenhadas depois (ativarJornadaGrafo). */
  function htmlJornadaGrafo(etapas, conexoes, htmlNo) {
    const { ncols, nrows, pos, arestas } = layoutJornadaGrafo(etapas, conexoes);
    const celulas = {};
    etapas.forEach((e, i) => { const k = pos[i].row + '|' + pos[i].col; (celulas[k] = celulas[k] || []).push(i); });
    const html = Object.keys(celulas).map((k) => {
      const [r, c] = k.split('|').map(Number);
      return `<div class="jornada-cel" style="grid-column:${c + 1};grid-row:${r + 1};">${celulas[k].map((i) => htmlNo(etapas[i], i)).join('')}</div>`;
    }).join('');
    return `<div class="jornada-grafo"><div class="jornada-grafo-in" data-arestas='${JSON.stringify(arestas)}' style="min-width:${ncols * 66}px">
      <svg class="jornada-linhas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="jornada-cols" style="grid-template-columns:repeat(${ncols},minmax(60px,1fr));grid-template-rows:repeat(${nrows},auto);">${html}</div></div></div>`;
  }

  function desenharLinhasJornada(inEl) {
    const svg = inEl.querySelector('.jornada-linhas');
    if (!svg) return;
    let arestas = [];
    try { arestas = JSON.parse(inEl.getAttribute('data-arestas') || '[]'); } catch { arestas = []; }
    const base = inEl.getBoundingClientRect();
    if (!base.width) return;
    svg.setAttribute('viewBox', `0 0 ${base.width} ${base.height}`);
    const centro = (i) => {
      const c = inEl.querySelector(`[data-jn="${i}"] .jornada-circulo`);
      if (!c) return null;
      const r = c.getBoundingClientRect();
      return { x: r.left - base.left, y: r.top - base.top + r.height / 2, w: r.width };
    };
    let html = '';
    arestas.forEach(([o, d, ok, tipo, desvio]) => {
      const a = centro(o), b = centro(d);
      if (!a || !b) return;
      const x1 = a.x + a.w, y1 = a.y, x2 = b.x, y2 = b.y;
      const alt = a.w * 1.1;   // altura do arco que contorna etapas da mesma faixa
      let dpath;
      if (tipo === 'r') {
        dpath = desvio
          ? `M${x1} ${y1} C ${x1 + (x2 - x1) / 3} ${y1 - alt}, ${x2 - (x2 - x1) / 3} ${y2 - alt}, ${x2} ${y2}`
          : `M${x1} ${y1} L ${x2} ${y2}`;
      } else if (tipo === 'j') {   // junção: segue na própria faixa e só no final converge para a etapa comum
        const xm = x2 - Math.min(64, Math.max(24, (x2 - x1) / 2));
        const dx = (x2 - xm) / 2;
        const ini = desvio
          ? `M${x1} ${y1} C ${x1 + (xm - x1) / 3} ${y1 - alt}, ${xm - (xm - x1) / 3} ${y1 - alt}, ${xm} ${y1}`
          : `M${x1} ${y1} L ${xm} ${y1}`;
        dpath = `${ini} C ${xm + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
      } else {   // divisão: abre logo para a faixa do ramo
        const dx = Math.max(10, (x2 - x1) / 2);
        dpath = `M${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
      }
      html += `<path d="${dpath}" fill="none" stroke="${ok ? '#16a34a' : '#d1d5db'}" stroke-width="2" stroke-linecap="round"/>`;
    });
    svg.innerHTML = html;
  }

  let _roJornada = null;
  /** Desenha as linhas e as mantém atualizadas se o painel mudar de largura. */
  function ativarJornadaGrafo(buscaEm) {
    if (_roJornada) { _roJornada.disconnect(); _roJornada = null; }
    const els = Array.from(buscaEm.querySelectorAll('.jornada-grafo-in'));
    if (!els.length) return;
    requestAnimationFrame(() => els.forEach(desenharLinhasJornada));
    if (typeof ResizeObserver !== 'undefined') {
      _roJornada = new ResizeObserver(() => els.forEach(desenharLinhasJornada));
      els.forEach((el) => _roJornada.observe(el));
    }
  }
  
    function htmlNoJornadaSite(e, i) {
    const concluida = e.status === 'concluida';
    const classe = concluida ? 'concluida' : (e.bloqueada ? 'bloqueada' : 'atual');
    const clique = concluida
      ? `onclick="mostrarRetrocederEtapa(${i})" title="Clique para voltar o fluxo até aqui"`
      : `onclick="mostrarMarcarEtapa(${i})" title="${e.bloqueada ? 'Aguardando: ' + escHtmlFluxo(textoFaltam(e)) : 'Clique para marcar como concluída'}"`;
    return `
      <div class="jornada-etapa ${classe}" data-jn="${i}" ${clique} style="cursor:pointer;">
        <div class="jornada-circulo">${concluida ? '✓' : (i + 1)}</div>
        <div class="jornada-label">${e.nome}</div>
        ${e.bloqueada ? `<div class="jornada-espera">⏳ aguarda ${(e.faltam || []).length + ((e.faltam_alternativas || []).length ? 1 : 0)}</div>` : ''}
        ${htmlDocEtapaSite(e, i)}
      </div>`;
  }

  /** "A, B e pelo menos uma entre: C, D" — o que ainda falta para liberar a etapa. */
  function textoFaltam(e) {
    const partes = [];
    if ((e.faltam || []).length) partes.push(e.faltam.join(', '));
    if ((e.faltam_alternativas || []).length) partes.push('pelo menos uma entre: ' + e.faltam_alternativas.join(', '));
    return partes.join(' e ');
  }

  /** Lista de dependências da etapa com o estado de cada uma (✓ concluída / ⏳ falta). */
  function htmlDependencias(e) {
    const deps = e.dependencias || [];
    if (!deps.length) return '';
    return `<div style="margin-top:4px;">${deps.map((d) => {
      const feito = d.estado === 'ok';
      const nota = feito ? '' : (d.alcancada ? ' — em andamento' : ' — ainda não iniciada');
      return `<div style="font-size:.8rem;color:${feito ? '#166534' : '#b45309'};">${feito ? '✓' : '⏳'} ${escHtmlFluxo(d.origem_nome)}${d.alternativa ? ' <i>(alternativa)</i>' : ''}${nota}</div>`;
    }).join('')}</div>`;
  }

  function htmlAvisoDependencias(e) {
    if (!e.bloqueada) return '';
    return `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:.82rem;color:#92400e;">
      <b>⏳ Esta etapa ainda depende de outras:</b>
      ${htmlDependencias(e)}
      <div style="margin-top:6px;">Conclua as etapas acima primeiro. Só use "Concluir mesmo assim" se o processo realmente seguiu fora dessa ordem.</div>
    </div>`;
  }

  /** Um painel para cada etapa pendente (podem ser várias, em paralelo) com setor, importância e modelos. */
  function htmlPaineisEtapasPendentes(etapas) {
    return etapas.map((e, i) => ({ e, i }))
      .filter(({ e }) => e.status !== 'concluida' && e.tipo !== 'gateway')
      .map(({ e, i }) => {
        const temModelo = e.modelo_documento || e.modelo_despacho;
        if (!(e.setores && e.setores.length) && !e.importancia && !temModelo && !e.bloqueada) return '';
        return `
      <div style="border:1px solid ${e.bloqueada ? '#fde68a' : 'var(--border)'};border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.82rem;">
        <div style="font-weight:600;margin-bottom:4px;">Etapa pendente: ${e.nome}</div>
        ${e.bloqueada ? `<div style="color:#b45309;margin-bottom:4px;"><b>⏳ Ainda depende de:</b>${htmlDependencias(e)}</div>` : ''}
        ${(e.setores && e.setores.length) ? `<div><b>Setor(es):</b> ${e.setores.map((st) => escHtmlFluxo(st.nome)).join(', ')}</div>` : ''}
        ${e.importancia ? `<div><b>Importância:</b> ${escHtmlFluxo(e.importancia)}</div>` : ''}
        ${temModelo ? `
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
          ${e.modelo_documento ? `<button class="btn btn-secondary btn-sm" onclick="copiarModeloEtapa('documento', ${i})">📋 Copiar modelo do documento</button>` : ''}
          ${e.modelo_despacho ? `<button class="btn btn-secondary btn-sm" onclick="copiarModeloEtapa('despacho', ${i})">📋 Copiar modelo do despacho</button>` : ''}
        </div>
        ${e.modelos_atualizado_em ? `<div class="dica-fluxo">Modelos atualizados em ${new Date(e.modelos_atualizado_em).toLocaleDateString('pt-BR')}.</div>` : ''}` : ''}
      </div>`;
      }).join('');
  }

  async function copiarModeloEtapa(qual, indice) {
    const e = etapasAtuais[indice];
    if (!e) return;
    const bruto = qual === 'despacho' ? e.modelo_despacho : e.modelo_documento;
    if (!bruto) return;
    const ok = await copiarTextoSite(preencherMarcadoresModelo(bruto, processoAtualObj));
    alert(ok ? 'Modelo copiado! Cole no editor do SEI e complete o que estiver entre colchetes.' : 'Não consegui copiar automaticamente.');
  }

  function mostrarMarcarEtapa(indice) {
    const etapa = etapasAtuais[indice];
    if (!etapa) return;

    if (etapa.tipo === 'gateway') {
      const opcoes = etapa.opcoes_disponiveis || [];
      abrirModal(`
        <h3>${etapa.nome}</h3>
        ${etapa.detalhes ? `<p style="font-size:.82rem;color:var(--muted);margin-bottom:12px;">${etapa.detalhes}</p>` : ''}
        ${opcoes.length ? `
          <div class="form-group">
            <label>Qual caminho foi seguido?</label>
            <select id="marcar-conexao-id">
              ${opcoes.map(o => `<option value="${o.id}">${o.rotulo}</option>`).join('')}
            </select>
          </div>
          ${htmlAvisoDependencias(etapa)}
          ${_camposExigenciasHtml(etapa)}
          <div class="modal-actions">
            <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
            <button class="btn ${etapa.bloqueada ? 'btn-secondary' : ''}" onclick="confirmarMarcarEtapa('${etapa.etapa_id}', document.getElementById('marcar-conexao-id').value, ${!!etapa.bloqueada})">${etapa.bloqueada ? 'Concluir mesmo assim' : 'Confirmar'}</button>
          </div>
        ` : `<p style="font-size:.85rem;color:#dc2626;">Este ponto de decisão não tem nenhum caminho configurado ainda — cadastre as conexões dele em Configurações → Fluxo de Etapas.</p>
          <div class="modal-actions"><button class="btn btn-secondary" onclick="fecharModal()">Fechar</button></div>`}
      `);
    } else {
      abrirModal(`
        <h3>Marcar etapa concluída</h3>
        <p style="font-size:.88rem;margin-bottom:16px;">Confirma que <b>${etapa.nome}</b> foi concluída?</p>
        ${etapa.detalhes ? `<p style="font-size:.8rem;color:var(--muted);margin-bottom:16px;">${etapa.detalhes}</p>` : ''}
        ${htmlAvisoDependencias(etapa)}
          ${_camposExigenciasHtml(etapa)}
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
          <button class="btn ${etapa.bloqueada ? 'btn-secondary' : ''}" onclick="confirmarMarcarEtapa('${etapa.etapa_id}', undefined, ${!!etapa.bloqueada})">${etapa.bloqueada ? 'Concluir mesmo assim' : 'Confirmar'}</button>
        </div>
      `);
      if (etapa.multiplos_documentos) ativarListaDocsMD(document.querySelector('#modal-overlay .modal'), etapa);
    }
  }

  function editarDocsEtapaSite(i) {
    abrirEditarDocsMD(etapasAtuais[i], processoAtualSei, () => abrirProcesso(processoAtualSei));
  }

  async function confirmarMarcarEtapa(etapaId, conexaoId, forcar) {
    const payload = { sei: processoAtualSei, etapa_id: etapaId, status: 'concluida' };
    if (forcar) payload.forcar = true;
    if (conexaoId) payload.conexao_id = conexaoId;
    const campoId = document.getElementById('marcar-id-sei');
    const campoValor = document.getElementById('marcar-valor');
    if (campoId) payload.id_sei_documento = campoId.value.trim();
    if (campoValor) payload.valor = campoValor.value;
    const modalEl = document.querySelector('#modal-overlay .modal');
    const docsMD = modalEl ? lerListaDocsMD(modalEl) : null;
    if (docsMD) payload.documentos = docsMD;
    const campoMeses = document.getElementById('marcar-meses');
    if (campoMeses) {
      if (!(Number(campoMeses.value) > 0)) { alert('Informe o período do aditivo temporário, em meses.'); return; }
      payload.meses_vigencia = Math.round(Number(campoMeses.value));
    }
    const r = await api('processo-etapas/marcar', payload);
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    fecharModal();

  // ==================== SIMILARIDADE DE TEXTO (evita duplicar tipo de documento) ====================
  function normalizarTexto(s) {
    return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }
  function distanciaLevenshtein(a, b) {
    const m = a.length, n = b.length;
    const d = Array.from({ length: m + 1 }, (_, i) => { const l = [i]; for (let j = 1; j <= n; j++) l.push(0); return l; });
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        d[i][j] = a[i - 1] === b[j - 1] ? d[i - 1][j - 1] : 1 + Math.min(d[i - 1][j], d[i][j - 1], d[i - 1][j - 1]);
      }
    }
    return d[m][n];
  }
  function encontrarTipoDocSimilar(nome) {
    const norm = normalizarTexto(nome);
    if (norm.length < 3) return null;
    let melhor = null, melhorDist = Infinity;
    _tiposDocCache.forEach((item) => {
      const n2 = normalizarTexto(item.valor);
      if (n2 === norm) return;
      const dist = distanciaLevenshtein(norm, n2);
      const limiar = Math.max(2, Math.floor(norm.length * 0.3));
      if (dist <= limiar && dist < melhorDist) { melhor = item; melhorDist = dist; }
    });
    return melhor;
  }

  // ==================== DESCRIÇÃO DA ETAPA (variação, setores, importância, modelos) ====================
  // Prefixos de id: 'cfg-nova-etapa' (formulário de criação) e 'edit-etapa' (modal de edição).
  // Os campos "<prefixo>-doc" (tipo de documento) e "<prefixo>-detalhes" já existiam.
  let _variacoesCache = [], _setoresCache = [], _descricaoEtapaOk = true;
  // ==================== DESPACHOS PADRÃO: modelo com variáveis ====================
  // O modelo do despacho (campo da etapa do fluxo) aceita três tipos de variável, sempre
  // inseridas pelos botões do editor (nunca digitadas):
  //   {{processo}}, {{unidade}}, ...           → dado do processo, preenchido sozinho
  //   {{doc: Despacho de instrução}}           → documento da árvore do SEI (vira link SEI)
  //   {{campo: Valor do investimento | valor}} → perguntado na hora de gerar, com validação
  // Uma linha "Destinatário: ..." no começo vira a linha de destinatário do despacho.
  // Formatação: cada linha é um parágrafo justificado; "- " = lista; "1. " = lista numerada;
  // **negrito**, *itálico*, __sublinhado__.
  const DADOS_DSP = [
    { chave: 'processo', rotulo: 'Nº do processo SEI' },
    { chave: 'objeto', rotulo: 'Objeto do processo' },
    { chave: 'tipo', rotulo: 'Tipo de processo' },
    { chave: 'subtipo', rotulo: 'Subtipo' },
    { chave: 'unidade', rotulo: 'Unidade' },
    { chave: 'oss', rotulo: 'OSS (sigla)' },
    { chave: 'oss_nome', rotulo: 'OSS (razão social)' },
    { chave: 'contrato', rotulo: 'Nº do contrato de gestão' },
    { chave: 'setor', rotulo: 'Setor(es) responsável(is) pela etapa' },
    { chave: 'data', rotulo: 'Data de hoje (dd/mm/aaaa)' },
    { chave: 'data_extenso', rotulo: 'Data de hoje por extenso' },
    { chave: 'valor_sof', rotulo: 'Valor da SOF (R$)' },
    { chave: 'valor_sof_extenso', rotulo: 'Valor da SOF com extenso' },
  ];
  const TIPOS_CAMPO_DSP = {
    texto: 'Texto', numero: 'Número', valor: 'Valor em R$', valor_extenso: 'Valor em R$ com extenso',
    data: 'Data', processo: 'Nº de processo SEI', lista: 'Lista de opções',
  };
  // Marcadores antigos ("[Nº DO PROCESSO]"...) continuam valendo.
  const MARCADORES_ANTIGOS_DSP = { '[Nº DO PROCESSO]': 'processo', '[OBJETO]': 'objeto', '[TIPO DE PROCESSO]': 'tipo', '[SUBTIPO]': 'subtipo', '[UNIDADE]': 'unidade', '[DATA]': 'data' };
  const RE_TOKEN_DSP = /\{\{\s*([^{}]*?)\s*\}\}/g;
  const RE_PROCESSO_DSP = /^\d{5,10}\.\d{6}\/\d{4}-\d{2}$/;

  const normDsp = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  const escDsp = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /** Lê uma variável "{{...}}". */
  function lerTokenDsp(interno) {
    const t = String(interno || '').trim();
    let m;
    if ((m = t.match(/^doc\s*:\s*(.+?)\s*(?:\|\s*(id|completo)\s*)?$/i))) return { tipo: 'doc', nome: m[1].trim(), formato: (m[2] || 'completo').toLowerCase() };
    if ((m = t.match(/^campo\s*:\s*([^|]+?)\s*(?:\|\s*(.+))?$/i))) {
      const nome = m[1].trim();
      let tipo = 'texto', opcoes = null;
      const def = (m[2] || '').trim();
      if (def) {
        const ml = def.match(/^lista\s*:\s*(.+)$/i);
        if (ml) { tipo = 'lista'; opcoes = ml[1].split(';').map((x) => x.trim()).filter(Boolean); }
        else tipo = normDsp(def).replace(/ /g, '_');
      }
      return { tipo: 'campo', nome, tipoCampo: tipo, opcoes };
    }
    const chave = normDsp(t).replace(/ /g, '_');
    return { tipo: 'dado', chave };
  }

  /** Confere o modelo. Devolve { erros, avisos, dados, docs, campos }. */
  function validarModeloDsp(texto) {
    const erros = [], avisos = [], dados = new Set(), docs = new Map(), campos = new Map();
    const s = String(texto || '');
    let m; RE_TOKEN_DSP.lastIndex = 0;
    while ((m = RE_TOKEN_DSP.exec(s))) {
      const tk = lerTokenDsp(m[1]);
      if (tk.tipo === 'dado') {
        if (!DADOS_DSP.some((d) => d.chave === tk.chave)) erros.push(`Variável desconhecida: ${m[0]} (use o botão "Dado do processo").`);
        else dados.add(tk.chave);
      } else if (tk.tipo === 'doc') {
        if (!tk.nome) erros.push(`Documento sem nome: ${m[0]}.`); else docs.set(normDsp(tk.nome), tk.nome);
      } else {
        if (!tk.nome) { erros.push(`Campo sem nome: ${m[0]}.`); continue; }
        if (!TIPOS_CAMPO_DSP[tk.tipoCampo]) { erros.push(`Tipo de campo desconhecido em ${m[0]} (use: ${Object.keys(TIPOS_CAMPO_DSP).join(', ')}).`); continue; }
        if (tk.tipoCampo === 'lista' && !(tk.opcoes || []).length) { erros.push(`A lista em ${m[0]} não tem opções.`); continue; }
        const k = normDsp(tk.nome), ant = campos.get(k);
        if (ant && (ant.tipoCampo !== tk.tipoCampo && !(['valor', 'valor_extenso'].includes(ant.tipoCampo) && ['valor', 'valor_extenso'].includes(tk.tipoCampo)))) {
          erros.push(`O campo "${tk.nome}" aparece com tipos diferentes (${TIPOS_CAMPO_DSP[ant.tipoCampo]} e ${TIPOS_CAMPO_DSP[tk.tipoCampo]}).`);
        } else if (!ant) campos.set(k, tk);
      }
    }
    const resto = s.replace(RE_TOKEN_DSP, '');
    if (/\{\{|\}\}/.test(resto)) erros.push('Há chaves "{{" ou "}}" soltas no texto — alguma variável foi apagada pela metade.');
    const colchetes = (s.match(/\[[^\]\n]{1,80}\]/g) || []).filter((c) => !MARCADORES_ANTIGOS_DSP[c]);
    if (colchetes.length) avisos.push(`Trechos entre colchetes ficam como estão no despacho: ${[...new Set(colchetes)].slice(0, 4).join(', ')}. Se forem para preencher, troque por "Campo a preencher".`);
    return { erros, avisos, dados: [...dados], docs: [...docs.values()], campos: [...campos.values()] };
  }

  // ---------- valores ----------
  function brlDsp(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function lerValorDsp(t) {
    const s = String(t || '').replace(/[R$\s]/g, '');
    if (!s) return null;
    const n = s.includes(',') ? Number(s.replace(/\./g, '').replace(',', '.')) : Number(s);
    return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
  }
  function extensoInteiroDsp(n) {
    const U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'catorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
    const D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
    const C = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
    const ate999 = (x) => {
      if (x === 100) return 'cem';
      const c = Math.floor(x / 100), r = x % 100, p = [];
      if (c) p.push(C[c]);
      if (r) p.push(r < 20 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : ''));
      return p.join(' e ');
    };
    if (n === 0) return 'zero';
    const grupos = []; let x = n;
    while (x > 0) { grupos.push(x % 1000); x = Math.floor(x / 1000); }
    const nomes = [['', ''], ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']];
    const partes = [];
    for (let i = grupos.length - 1; i >= 0; i--) {
      const g = grupos[i]; if (!g) continue;
      let t = i === 1 && g === 1 ? 'mil' : ate999(g) + (i ? ' ' + nomes[i][g === 1 ? 0 : 1] : '');
      partes.push({ t, g, i });
    }
    // "e" antes do último grupo quando ele é < 100 ou centena redonda (ex.: mil e cem, dois mil e cinco)
    return partes.map((p, k) => (k > 0 && k === partes.length - 1 && (p.g < 100 || p.g % 100 === 0) ? 'e ' : '') + p.t).join(' ');
  }
  function extensoReaisDsp(v) {
    const reais = Math.floor(v + 1e-9), cent = Math.round((v - reais) * 100);
    const p = [];
    if (reais) p.push(extensoInteiroDsp(reais) + (reais % 1000000 === 0 && reais >= 1000000 ? ' de' : '') + (reais === 1 ? ' real' : ' reais'));
    if (cent) p.push(extensoInteiroDsp(cent) + (cent === 1 ? ' centavo' : ' centavos'));
    return p.length ? p.join(' e ') : 'zero real';
  }
  function valorFormatadoDsp(v, comExtenso) { return brlDsp(v) + (comExtenso ? ` (${extensoReaisDsp(v)})` : ''); }
  const MESES_DSP = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  function dataHojeDsp(extenso) {
    const d = new Date();
    return extenso ? `${d.getDate()} de ${MESES_DSP[d.getMonth()]} de ${d.getFullYear()}`
      : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
  }
  /** Valida e formata o que o usuário digitou num campo. Devolve { ok, texto } ou { erro }. */
  function formatarCampoDsp(tk, bruto) {
    const t = String(bruto ?? '').trim();
    if (!t) return { erro: 'preencha' };
    if (tk.tipoCampo === 'numero') { const n = lerValorDsp(t); return n === null ? { erro: 'número inválido' } : { ok: true, texto: n.toLocaleString('pt-BR') }; }
    if (tk.tipoCampo === 'valor' || tk.tipoCampo === 'valor_extenso') { const n = lerValorDsp(t); return n === null ? { erro: 'valor inválido (ex.: 62.905,28)' } : { ok: true, texto: valorFormatadoDsp(n, tk.tipoCampo === 'valor_extenso'), valor: n }; }
    if (tk.tipoCampo === 'data') {
      const m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      const d = m && new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
      return d && d.getDate() === Number(m[1]) && d.getMonth() === Number(m[2]) - 1 ? { ok: true, texto: `${m[1].padStart(2, '0')}/${m[2].padStart(2, '0')}/${m[3]}` } : { erro: 'data inválida (dd/mm/aaaa)' };
    }
    if (tk.tipoCampo === 'processo') return RE_PROCESSO_DSP.test(t) ? { ok: true, texto: t } : { erro: 'nº de processo inválido (ex.: 2300000176.000678/2025-15)' };
    if (tk.tipoCampo === 'lista') return (tk.opcoes || []).includes(t) ? { ok: true, texto: t } : { erro: 'escolha uma opção' };
    return { ok: true, texto: t };
  }

  /** "GOVPE - Despacho 12 (66440553)" → "Despacho nº 12". */
  function nomeDocDsp(nome) {
    let n = String(nome || '').replace(/\(\d{5,}\)\s*$/, '').replace(/^[^-]{1,15}\s-\s/, '').trim();
    n = n.replace(/\s+(\d+[\d./-]*)$/, ' nº $1');
    return n;
  }
  /** Link igual ao do botão "sei" do editor (id interno do documento + nº SEI). */
  function linkSeiDsp(doc) {
    if (!doc.id_interno) return escDsp(doc.id_sei);
    return `<span contenteditable="false" style="text-indent:0px;"><a class="ancora_sei" id="lnkSei${escDsp(doc.id_interno)}" style="text-indent:0px;">${escDsp(doc.id_sei)}</a></span>`;
  }

  /**
   * Monta o despacho. ctx = { dados: {chave: texto}, docs: {nomeNorm: {nome, id_sei, id_interno}}, campos: {nomeNorm: texto} }.
   * Devolve { destinatario, html (corpo para o SEI), previa (HTML para mostrar), faltando: [rótulos] }.
   */
  function montarDespachoDsp(modelo, ctx) {
    const faltando = new Set();
    let texto = String(modelo || '').replace(/\r/g, '');
    Object.entries(MARCADORES_ANTIGOS_DSP).forEach(([m, k]) => { texto = texto.split(m).join(`{{${k}}}`); });
    const valores = [];   // trechos já em HTML, colocados depois da formatação
    const guardar = (html) => { valores.push(html); return `\u0000${valores.length - 1}\u0000`; };
    const pendente = (rot) => { faltando.add(rot); return guardar(`<span style="background-color:#ffff00;">[${escDsp(rot)}]</span>`); };
    const trocar = (linha, comLink) => linha.replace(RE_TOKEN_DSP, (_, interno) => {
      const tk = lerTokenDsp(interno);
      if (tk.tipo === 'dado') {
        const v = (ctx.dados || {})[tk.chave];
        const rot = (DADOS_DSP.find((d) => d.chave === tk.chave) || {}).rotulo || tk.chave;
        return v ? guardar(escDsp(v)) : pendente(rot);
      }
      if (tk.tipo === 'doc') {
        const d = (ctx.docs || {})[normDsp(tk.nome)];
        if (!d || !d.id_sei) return pendente('documento: ' + tk.nome);
        const link = comLink ? linkSeiDsp(d) : `<u>${escDsp(d.id_sei)}</u>`;
        return guardar(tk.formato === 'id' ? link : `${escDsp(nomeDocDsp(d.nome))} (SEI nº ${link})`);
      }
      const v = (ctx.campos || {})[normDsp(tk.nome)];
      if (!v) return pendente(tk.nome);
      if (v.valor !== undefined && tk.tipoCampo !== 'lista') return guardar(escDsp(valorFormatadoDsp(v.valor, tk.tipoCampo === 'valor_extenso')));
      return guardar(escDsp(v.texto));
    });
    const formatar = (s) => escDsp(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/__(.+?)__/g, '<u>$1</u>')
      .replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/\u0000(\d+)\u0000/g, (_, i) => valores[Number(i)]);

    const montar = (comLink) => {
      valores.length = 0;
      let destinatario = null;
      const blocos = []; let lista = null;
      const fecha = () => { if (lista) { blocos.push(`<${lista.tag}>${lista.itens.join('')}</${lista.tag}>`); lista = null; } };
      texto.split('\n').forEach((bruta) => {
        const l = bruta.trim();
        if (!l) { fecha(); return; }
        let m;
        if (destinatario === null && !blocos.length && (m = l.match(/^destinat[aá]rio\s*:\s*(.*)$/i))) { destinatario = formatar(trocar(m[1], false)); return; }
        if ((m = l.match(/^[-•]\s+(.*)$/))) { if (!lista || lista.tag !== 'ul') { fecha(); lista = { tag: 'ul', itens: [] }; } lista.itens.push(`<li>${formatar(trocar(m[1], comLink))}</li>`); return; }
        if ((m = l.match(/^\d+[.)]\s+(.*)$/))) { if (!lista || lista.tag !== 'ol') { fecha(); lista = { tag: 'ol', itens: [] }; } lista.itens.push(`<li>${formatar(trocar(m[1], comLink))}</li>`); return; }
        fecha();
        blocos.push(`<p class="Texto_Justificado">${formatar(trocar(l, comLink))}</p>`);
      });
      fecha();
      return { destinatario, corpo: blocos.join('') };
    };
    const sei = montar(true);
    const previa = montar(false);
    return { destinatario: sei.destinatario, html: sei.corpo, previa: previa.corpo, previaDestinatario: previa.destinatario, faltando: [...faltando] };
  }

  // ---- Editor do modelo de despacho (site): variáveis por botão, conferência e prévia ----
  function _dspArea(p) { return document.getElementById(`${p}-modelo-desp`); }
  function _dspInserir(p, token) {
    const ta = _dspArea(p); if (!ta) return;
    const ini = ta.selectionStart ?? ta.value.length, fim = ta.selectionEnd ?? ini;
    ta.value = ta.value.slice(0, ini) + token + ta.value.slice(fim);
    ta.focus(); ta.selectionStart = ta.selectionEnd = ini + token.length;
    dspFecharPop(p); dspConferir(p);
  }
  function dspFecharPop(p) { const el = document.getElementById(`${p}-dsp-pop`); if (el) { el.innerHTML = ''; el.style.display = 'none'; } }
  function _dspPop(p, html) { const el = document.getElementById(`${p}-dsp-pop`); el.innerHTML = html; el.style.display = 'block'; return el; }

  function dspInserirDado(p) {
    const el = _dspPop(p, `<b>📌 Dado do processo</b> <span class="dsp-dica">preenchido sozinho na hora de gerar</span>
      <div class="dsp-opcoes">${DADOS_DSP.map((d) => `<button type="button" class="dsp-op" data-dsp-dado="${d.chave}">${escHtmlFluxo(d.rotulo)}</button>`).join('')}</div>
      <button type="button" class="btn-link" onclick="dspFecharPop('${p}')">cancelar</button>`);
    el.querySelectorAll('[data-dsp-dado]').forEach((b) => b.onclick = () => _dspInserir(p, `{{${b.dataset.dspDado}}}`));
  }
  function dspInserirDoc(p) {
    const el = _dspPop(p, `<b>🔗 Documento do processo</b> <span class="dsp-dica">na hora de gerar, o usuário confirma qual documento da árvore do SEI é este; entra como link SEI</span>
      <div class="dsp-linha"><input data-dsp="nome" placeholder="Como chamar este documento (ex.: Despacho de instrução, Parecer da CMA)">
      <select data-dsp="fmt"><option value="">Nome + nº (ex.: Despacho nº 1090 (SEI nº 67009631))</option><option value="id">Só o nº SEI</option></select></div>
      <button type="button" class="btn" data-dsp="ok">Inserir</button> <button type="button" class="btn-link" onclick="dspFecharPop('${p}')">cancelar</button>`);
    const q = (n) => el.querySelector(`[data-dsp="${n}"]`); q('nome').focus();
    q('ok').onclick = () => {
      const nome = q('nome').value.replace(/[{}|:]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!nome) { q('nome').focus(); return; }
      _dspInserir(p, `{{doc: ${nome}${q('fmt').value ? ' | id' : ''}}}`);
    };
  }
  function dspInserirCampo(p) {
    const el = _dspPop(p, `<b>✍️ Campo a preencher</b> <span class="dsp-dica">perguntado na hora de gerar, com conferência do formato; o mesmo nome em vários lugares é perguntado uma vez só</span>
      <div class="dsp-linha"><input data-dsp="nome" placeholder="Nome do campo (ex.: Valor do investimento)">
      <select data-dsp="tipo">${Object.entries(TIPOS_CAMPO_DSP).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="dsp-linha" data-dsp="lista-box" style="display:none;"><input data-dsp="opcoes" placeholder="Opções separadas por ponto e vírgula (ex.: CTAI; CMA; GAOCG)"></div>
      <button type="button" class="btn" data-dsp="ok">Inserir</button> <button type="button" class="btn-link" onclick="dspFecharPop('${p}')">cancelar</button>`);
    const q = (n) => el.querySelector(`[data-dsp="${n}"]`); q('nome').focus();
    q('tipo').onchange = () => { q('lista-box').style.display = q('tipo').value === 'lista' ? 'flex' : 'none'; };
    q('ok').onclick = () => {
      const nome = q('nome').value.replace(/[{}|:]/g, ' ').replace(/\s+/g, ' ').trim();
      if (!nome) { q('nome').focus(); return; }
      const tipo = q('tipo').value;
      let def = tipo === 'texto' ? '' : ` | ${tipo}`;
      if (tipo === 'lista') {
        const ops = q('opcoes').value.split(';').map((x) => x.replace(/[{}|]/g, ' ').trim()).filter(Boolean);
        if (!ops.length) { q('opcoes').focus(); return; }
        def = ` | lista: ${ops.join('; ')}`;
      }
      _dspInserir(p, `{{campo: ${nome}${def}}}`);
    };
  }
  function dspConferir(p) {
    const ta = _dspArea(p), st = document.getElementById(`${p}-dsp-st`);
    if (!ta || !st) return null;
    if (!ta.value.trim()) { st.innerHTML = ''; return { erros: [] }; }
    const v = validarModeloDsp(ta.value);
    const resumo = [v.dados.length ? `${v.dados.length} dado(s) automático(s)` : '', v.docs.length ? `${v.docs.length} documento(s)` : '', v.campos.length ? `${v.campos.length} campo(s) a preencher` : ''].filter(Boolean).join(' · ');
    st.innerHTML = v.erros.length
      ? `<div class="dsp-erro">⚠ ${v.erros.map(escHtmlFluxo).join('<br>⚠ ')}</div>`
      : `<div class="dsp-ok">✓ Modelo conferido${resumo ? ': ' + resumo : ' (sem variáveis)'}.</div>${v.avisos.map((a) => `<div class="dsp-aviso">${escHtmlFluxo(a)}</div>`).join('')}`;
    return v;
  }
  function dspPrevia(p) {
    const ta = _dspArea(p); if (!ta) return;
    const v = dspConferir(p);
    if (!ta.value.trim()) return;
    const exDados = { processo: '2300002754.000002/2025-46', objeto: 'Objeto do processo', tipo: 'Aditivo', subtipo: 'Investimento', unidade: 'UPA Torrões', oss: 'FMSA', oss_nome: 'Fundação Manoel da Silva Almeida', contrato: '009/2022', setor: 'CTAI', data: dataHojeDsp(false), data_extenso: dataHojeDsp(true), valor_sof: valorFormatadoDsp(62905.28, false), valor_sof_extenso: valorFormatadoDsp(62905.28, true) };
    const exCampo = { texto: 'texto informado', numero: '10', valor: '62.905,28', valor_extenso: '62.905,28', data: dataHojeDsp(false), processo: '2300000176.000678/2025-15' };
    const ctx = { dados: exDados, docs: {}, campos: {} };
    v.docs.forEach((n) => { ctx.docs[normDsp(n)] = { nome: 'GOVPE - Despacho 1090 (67009631)', id_sei: '67009631' }; });
    v.campos.forEach((c) => { ctx.campos[normDsp(c.nome)] = formatarCampoDsp(c, c.tipoCampo === 'lista' ? c.opcoes[0] : exCampo[c.tipoCampo]); });
    const r = montarDespachoDsp(ta.value, ctx);
    _dspPop(p, `<b>👁 Prévia com dados de exemplo</b> <span class="dsp-dica">no SEI, os dados são os do processo</span>
      <div class="dsp-previa">${r.previaDestinatario !== null ? `<p><b>Destinatário:</b> ${r.previaDestinatario}</p>` : '<p class="dsp-dica">Sem linha "Destinatário:" — será usado o setor da etapa.</p>'}${r.previa}</div>
      <button type="button" class="btn-link" onclick="dspFecharPop('${p}')">fechar prévia</button>`);
  }

  const MARCADORES_MODELO = ['[Nº DO PROCESSO]', '[OBJETO]', '[TIPO DE PROCESSO]', '[SUBTIPO]', '[UNIDADE]', '[DATA]'];

  async function carregarDescricaoEtapaListas() {
    const [rv, rs] = await Promise.all([api('variacoes/listar'), api('setores/listar')]);
    _descricaoEtapaOk = !!(rv.ok && rs.ok);
    _variacoesCache = (rv.ok && rv.variacoes) || [];
    _setoresCache = (rs.ok && rs.setores) || [];
  }

  function escHtmlFluxo(t) {
    return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function htmlOpcoesVariacao(tipoDocId, selecionadaId) {
    const lista = _variacoesCache
      .filter((v) => tipoDocId && v.tipo_documento_id === tipoDocId)
      .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    return '<option value="">— Sem variação —</option>'
      + lista.map((v) => `<option value="${v.id}" ${v.id === selecionadaId ? 'selected' : ''}>${escHtmlFluxo(v.nome)}</option>`).join('')
      + (tipoDocId ? '<option value="__nova__">+ Nova variação...</option>' : '');
  }

  function atualizarOpcoesVariacao(p, selecionadaId) {
    const sel = document.getElementById(`${p}-variacao`);
    if (!sel) return;
    const tipoDocId = document.getElementById(`${p}-doc`)?.value || '';
    sel.innerHTML = htmlOpcoesVariacao(tipoDocId, selecionadaId || '');
    onSelecionarVariacaoEtapa(p);
  }

  function onSelecionarVariacaoEtapa(p) {
    const ehNova = document.getElementById(`${p}-variacao`).value === '__nova__';
    document.getElementById(`${p}-variacao-nova`).style.display = ehNova ? 'block' : 'none';
    if (!ehNova) document.getElementById(`${p}-variacao-similar`).style.display = 'none';
  }

  function verificarSimilaridadeVariacao(p) {
    const nome = document.getElementById(`${p}-variacao-nova`).value.trim();
    const aviso = document.getElementById(`${p}-variacao-similar`);
    const tipoDocId = document.getElementById(`${p}-doc`)?.value || '';
    const norm = normalizarTexto(nome);
    if (norm.length < 3) { aviso.style.display = 'none'; return; }
    let exata = null, parecida = null, melhor = Infinity;
    _variacoesCache.filter((v) => v.tipo_documento_id === tipoDocId).forEach((v) => {
      const n2 = normalizarTexto(v.nome);
      if (n2 === norm) { exata = v; return; }
      const dist = distanciaLevenshtein(norm, n2);
      if (dist <= Math.max(2, Math.floor(norm.length * 0.3)) && dist < melhor) { parecida = v; melhor = dist; }
    });
    if (exata) {
      aviso.style.display = 'block';
      aviso.innerHTML = `ℹ️ A variação <b>"${escHtmlFluxo(exata.nome)}"</b> já existe — ela será usada, sem duplicar.`;
    } else if (parecida) {
      aviso.style.display = 'block';
      aviso.innerHTML = `⚠️ Já existe algo parecido: <b>"${escHtmlFluxo(parecida.nome)}"</b> — considere usar a existente em vez de criar outra.`;
    } else {
      aviso.style.display = 'none';
    }
  }

  /** Devolve { id } (pode ser null = sem variação) ou { erro }. Cria a variação nova se for o caso. */
  async function resolverVariacaoEtapa(p, tipoDocId) {
    const v = document.getElementById(`${p}-variacao`).value;
    if (v !== '__nova__') return { id: v || null };
    const nome = document.getElementById(`${p}-variacao-nova`).value.trim();
    if (!nome) return { erro: 'Informe o nome da nova variação (ou escolha "Sem variação").' };
    const existente = _variacoesCache.find((x) => x.tipo_documento_id === tipoDocId && normalizarTexto(x.nome) === normalizarTexto(nome));
    if (existente) return { id: existente.id };
    const r = await api('variacoes/criar', { tipo_documento_id: tipoDocId, nome });
    if (!r.ok) return { erro: 'Erro ao criar a variação: ' + r.erro };
    _variacoesCache.push(r.variacao);
    return { id: r.variacao.id };
  }

  function htmlSetoresEtapa(p, selecionados) {
    if (!_setoresCache.length) return '<span class="text-muted" style="font-size:.8rem;">Nenhum setor cadastrado ainda — use o campo abaixo.</span>';
    return _setoresCache.map((st) => `
      <label><input type="checkbox" value="${st.id}" ${selecionados.includes(st.id) ? 'checked' : ''}> ${escHtmlFluxo(st.nome)}</label>`).join('');
  }

  function setoresMarcadosEtapa(p) {
    return Array.from(document.querySelectorAll(`#${p}-setores input[type=checkbox]:checked`)).map((c) => c.value);
  }

  async function adicionarSetorEtapa(p) {
    const inp = document.getElementById(`${p}-setor-novo`);
    const nome = inp.value.trim();
    if (!nome) return;
    const marcados = setoresMarcadosEtapa(p);
    const existente = _setoresCache.find((x) => normalizarTexto(x.nome) === normalizarTexto(nome));
    if (existente) {
      if (!marcados.includes(existente.id)) marcados.push(existente.id);
    } else {
      const r = await api('setores/criar', { nome });
      if (!r.ok) { alert('Erro ao cadastrar o setor: ' + r.erro); return; }
      _setoresCache.push(r.setor);
      _setoresCache.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
      marcados.push(r.setor.id);
    }
    inp.value = '';
    document.getElementById(`${p}-setores`).innerHTML = htmlSetoresEtapa(p, marcados);
  }

  /** Lê o bloco de descrição já validando a variação. Devolve { campos } ou { erro }. */
  async function lerDescricaoEtapa(p, tipoDocId) {
    const v = await resolverVariacaoEtapa(p, tipoDocId);
    if (v.erro) return { erro: v.erro };
    const eModelo = erroModeloDespacho(p);
    if (eModelo) { dspConferir(p); return { erro: eModelo }; }
    return {
      campos: {
        variacao_id: v.id,
        setores_ids: setoresMarcadosEtapa(p),
        importancia: document.getElementById(`${p}-importancia`).value.trim(),
        modelo_documento: document.getElementById(`${p}-modelo-doc`).value,
        modelo_despacho: document.getElementById(`${p}-modelo-desp`).value,
        prazo_exigido: !!document.getElementById(`${p}-prazo-on`)?.checked,
        ...(() => { const box = document.getElementById(`${p}-prazo-campos`); if (!box) return {}; const pz = lerCamposPrazoPz(box); return { prazo_qtd_padrao: pz.qtd || null, prazo_unidade_padrao: pz.unidade, prazo_uteis_padrao: pz.uteis }; })(),
      },
    };
  }
  /** Bloqueia salvar a etapa com o modelo de despacho quebrado. */
  function erroModeloDespacho(p) {
    const ta = document.getElementById(`${p}-modelo-desp`);
    if (!ta || !ta.value.trim()) return null;
    const v = validarModeloDsp(ta.value);
    return v.erros.length ? 'Modelo do despacho: ' + v.erros[0] : null;
  }

    if (!confirm('Remover esta variação? As etapas que a usam ficam sem variação (continuam existindo).')) return;

    carregarFluxo();

  async function carregarFluxo() {
    const subtipoId = document.getElementById('cfg-fluxo-subtipo').value;
    const el = document.getElementById('fluxo-conteudo');
    if (!subtipoId) { el.innerHTML = ''; return; }
    el.innerHTML = '<div class="text-muted"><span class="spinner"></span> Carregando...</div>';

    const [resEtapas, resConexoes] = await Promise.all([
      api(`fluxo-etapas/listar?subtipo_id=${subtipoId}`),
      api(`fluxo-conexoes/listar?subtipo_id=${subtipoId}`),
      carregarDescricaoEtapaListas(),
    ]);
    const etapas = (resEtapas.ok && resEtapas.etapas) || [];
    const conexoes = (resConexoes.ok && resConexoes.conexoes) || [];
    renderFluxo(subtipoId, etapas, conexoes);
  }

            <select id="cfg-nova-conexao-origem">
              <option value="">— Início —</option>
              ${etapas.map((e) => `<option value="${e.id}">${e.tipo === 'gateway' ? '🔀 ' : ''}${e.nome_exibicao}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Para</label>
            <select id="cfg-nova-conexao-destino">
              <option value="">— Selecione —</option>
              ${etapas.map((e) => `<option value="${e.id}">${e.tipo === 'gateway' ? '🔀 ' : ''}${e.nome_exibicao}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Rótulo <small style="color:var(--muted);">(a resposta — só faz sentido se "De" for um gateway)</small></label>
            <input id="cfg-nova-conexao-rotulo" placeholder='Ex: "Sim" / "Não"'>
          </div>
          <div class="form-group" style="flex:1 1 100%;">
            <label style="font-weight:400;display:inline-flex;align-items:center;gap:6px;">
              <input type="checkbox" id="cfg-nova-conexao-alt" style="width:auto;"> Conexão alternativa
              <small style="color:var(--muted);">(quando várias conexões chegam na mesma etapa: por padrão <b>todas</b> precisam estar concluídas; marcadas como alternativas, <b>basta uma</b>)</small>
            </label>
          </div>
          <button class="btn" onclick="criarConexaoFluxo('${subtipoId}')">Adicionar conexão</button>
        </div>
        ${htmlGestaoDescricao()}
      </div>
    `;
    ['cfg-nova-conexao-origem', 'cfg-nova-conexao-destino', 'cfg-nova-conexao-rotulo', 'cfg-nova-conexao-alt'].forEach((id) => {
      const c = document.getElementById(id);
      if (c) { c.addEventListener('change', renderPreviaFluxoSite); c.addEventListener('input', renderPreviaFluxoSite); }
    });
    renderPreviaFluxoSite();
  }

  /** Desenho do fluxo na configuração: redesenha a cada mudança e mostra a conexão em montagem. */
  function renderPreviaFluxoSite() {
    const box = document.getElementById('fluxo-previa-desenho');
    const vEl = document.getElementById('fluxo-previa-verif');
    if (!box || !vEl) return;
    const et = _fluxoEtapasCache, cx = _fluxoConexoesCache;
    if (!et.length) { box.innerHTML = '<div class="fd-vazio">Cadastre as etapas para ver o desenho do fluxo aqui.</div>'; vEl.innerHTML = ''; return; }
    const val = (id) => (document.getElementById(id) || {}).value || '';
    const destino = val('cfg-nova-conexao-destino');
    const fantasma = destino ? { origem: val('cfg-nova-conexao-origem') || null, destino, rotulo: val('cfg-nova-conexao-rotulo').trim(), alternativa: !!document.getElementById('cfg-nova-conexao-alt')?.checked } : null;
    const ver = verificarFluxoFD(et, cx);
    const d = svgFluxoFD(et, cx, { fantasma, erro: ver.filter((v) => v.nivel === 'erro').flatMap((v) => v.ids), clicavel: true });
    box.innerHTML = d.svg;
    box.querySelectorAll('[data-fd-etapa]').forEach((g) => g.addEventListener('click', () => editarEtapaFluxoModal(g.getAttribute('data-fd-etapa'))));
    vEl.innerHTML = htmlVerificacaoFD(ver);
    vEl.querySelectorAll('[data-fd-aviso]').forEach((el) => el.addEventListener('click', () => {
      const it = ver[Number(el.getAttribute('data-fd-aviso'))];
      destacarEtapasFD(box, it ? it.ids : []);
    }));
  }

  // ---- edição inline (via modal) de etapas e conexões já existentes ----
  function editarEtapaFluxoModal(id) {
    const e = _fluxoEtapasCache.find((x) => x.id === id);
    if (!e) return;
    const ehGateway = e.tipo === 'gateway';
    abrirModal(`
      <h3>Editar etapa</h3>
      ${ehGateway ? `
        <div class="form-group">
          <label>Pergunta do ponto de decisão</label>
          <input id="edit-etapa-nome" value="${(e.nome || '').replace(/"/g, '&quot;')}">
        </div>
      ` : `
        <div class="form-group">
          <label>Tipo de documento</label>
          <select id="edit-etapa-doc" onchange="atualizarOpcoesVariacao('edit-etapa')">
            ${_tiposDocCache.map((t) => `<option value="${t.id}" ${t.id === e.tipo_documento_id ? 'selected' : ''}>${t.valor}</option>`).join('')}
          </select>
        </div>
      `}
      <div class="form-group">
        <label>Detalhes</label>
        <input id="edit-etapa-detalhes" value="${(e.detalhes || '').replace(/"/g, '&quot;')}">
      </div>
      ${ehGateway ? '' : htmlDescricaoEtapa('edit-etapa', e, true)}
      <div class="form-group">
        <label style="font-weight:400;display:inline-flex;align-items:center;gap:4px;margin-right:12px;">
          <input type="checkbox" id="edit-etapa-exige-id" ${e.exige_id_sei ? 'checked' : ''}> Exige nº doc. SEI
        </label>
        <label style="font-weight:400;display:inline-flex;align-items:center;gap:4px;margin-right:12px;">
          <input type="checkbox" id="edit-etapa-exige-valor" ${e.exige_valor ? 'checked' : ''}> Exige valor R$
        </label>
        ${ehGateway ? '' : `<label style="font-weight:400;display:inline-flex;align-items:center;gap:4px;" title="Ex.: mais de uma SOF, uma por fonte de recurso">
          <input type="checkbox" id="edit-etapa-multi" ${e.multiplos_documentos ? 'checked' : ''}> Aceita vários documentos
        </label>`}
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
        <button class="btn" onclick="salvarEdicaoEtapaFluxo('${e.id}', ${ehGateway})">Salvar</button>
      </div>
    `, 'modal-largo');
  }

  async function salvarEdicaoEtapaFluxo(id, ehGateway) {
    const payload = {
      id,
      detalhes: document.getElementById('edit-etapa-detalhes').value.trim(),
      exige_id_sei: document.getElementById('edit-etapa-exige-id').checked,
      exige_valor: document.getElementById('edit-etapa-exige-valor').checked,
      ...(document.getElementById('edit-etapa-multi') ? { multiplos_documentos: document.getElementById('edit-etapa-multi').checked } : {}),
    };
    if (ehGateway) {
      const nome = document.getElementById('edit-etapa-nome').value.trim();
      if (!nome) { alert('Informe a pergunta do ponto de decisão.'); return; }
      payload.nome = nome;
    } else {
      payload.tipo_documento_id = document.getElementById('edit-etapa-doc').value;
      const d = await lerDescricaoEtapa('edit-etapa', payload.tipo_documento_id);
      if (d.erro) { alert(d.erro); return; }
      Object.assign(payload, d.campos);
    }
    const r = await api('fluxo-etapas/atualizar', payload);
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    fecharModal();
    document.getElementById('cfg-fluxo-subtipo').value = _fluxoSubtipoIdAtual;
    carregarFluxo();
  }

  function editarConexaoFluxoModal(id) {
    const c = _fluxoConexoesCache.find((x) => x.id === id);
    if (!c) return;
    const etapas = _fluxoEtapasCache;
    abrirModal(`
      <h3>Editar conexão</h3>
      <div class="form-group">
        <label>De</label>
        <select id="edit-conexao-origem">
          <option value="" ${!c.etapa_origem_id ? 'selected' : ''}>— Início —</option>
          ${etapas.map((e) => `<option value="${e.id}" ${e.id === c.etapa_origem_id ? 'selected' : ''}>${e.tipo === 'gateway' ? '🔀 ' : ''}${e.nome_exibicao}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Para</label>
        <select id="edit-conexao-destino">
          ${etapas.map((e) => `<option value="${e.id}" ${e.id === c.etapa_destino_id ? 'selected' : ''}>${e.tipo === 'gateway' ? '🔀 ' : ''}${e.nome_exibicao}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Rótulo</label>
        <input id="edit-conexao-rotulo" value="${(c.rotulo || '').replace(/"/g, '&quot;')}">
      </div>
      <div class="form-group">
        <label style="font-weight:400;display:inline-flex;align-items:center;gap:6px;">
          <input type="checkbox" id="edit-conexao-alt" style="width:auto;" ${c.alternativa ? 'checked' : ''}> Conexão alternativa
        </label>
        <div class="dica-fluxo">Por padrão, uma etapa que recebe várias conexões só é liberada quando <b>todas</b> estão concluídas. Marcadas como alternativas, <b>basta uma</b>.</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
        <button class="btn" onclick="salvarEdicaoConexaoFluxo('${c.id}')">Salvar</button>
      </div>
    `);
  }

  async function salvarEdicaoConexaoFluxo(id) {
    const origem = document.getElementById('edit-conexao-origem').value || null;
    const destino = document.getElementById('edit-conexao-destino').value;
    const rotulo = document.getElementById('edit-conexao-rotulo').value.trim() || null;
    if (!destino) { alert('Selecione o destino da conexão.'); return; }
    const alternativa = document.getElementById('edit-conexao-alt').checked;
    const r = await api('fluxo-conexoes/atualizar', { id, etapa_origem_id: origem, etapa_destino_id: destino, rotulo, alternativa });
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    fecharModal();
    document.getElementById('cfg-fluxo-subtipo').value = _fluxoSubtipoIdAtual;
    carregarFluxo();
  }

  function onTrocarTipoEtapaFluxo() {
    const gateway = document.getElementById('cfg-nova-etapa-tipo').value === 'gateway';
    document.getElementById('cfg-etapa-doc-wrap').style.display = gateway ? 'none' : 'block';
    document.getElementById('cfg-etapa-pergunta-wrap').style.display = gateway ? 'block' : 'none';
    document.getElementById('cfg-etapa-descricao-wrap').style.display = gateway ? 'none' : 'block';
  }

  function onSelecionarNovoTipoDocEtapa() {
    const ehNovo = document.getElementById('cfg-nova-etapa-doc').value === '__novo__';
    document.getElementById('cfg-etapa-doc-novo-nome').style.display = ehNovo ? 'block' : 'none';
    if (!ehNovo) document.getElementById('cfg-etapa-doc-similar').style.display = 'none';
    // um tipo recém-digitado ainda não tem id: só permite variação existente depois de cadastrado
    atualizarOpcoesVariacao('cfg-nova-etapa');
  }

  function verificarSimilaridadeEtapaDoc() {
    const nome = document.getElementById('cfg-etapa-doc-novo-nome').value.trim();
    const avisoEl = document.getElementById('cfg-etapa-doc-similar');
    const similar = encontrarTipoDocSimilar(nome);
    if (similar) {
      avisoEl.style.display = 'block';
      avisoEl.innerHTML = `⚠️ Já existe algo parecido: <b>"${similar.valor}"</b> — considere usar o já existente em vez de criar outro.`;
    } else {
      avisoEl.style.display = 'none';
    }
  }

  async function criarEtapaFluxo(subtipoId) {
    const tipo = document.getElementById('cfg-nova-etapa-tipo').value;
    const detalhes = document.getElementById('cfg-nova-etapa-detalhes').value.trim();
    const exigeId = document.getElementById('cfg-nova-etapa-exige-id').checked;
    const exigeValor = document.getElementById('cfg-nova-etapa-exige-valor').checked;
    const payload = { subtipo_id: subtipoId, tipo, detalhes, exige_id_sei: exigeId, exige_valor: exigeValor, multiplos_documentos: !!document.getElementById('cfg-nova-etapa-multi')?.checked };

    if (tipo === 'gateway') {
      const pergunta = document.getElementById('cfg-nova-etapa-pergunta').value.trim();
      if (!pergunta) { alert('Informe a pergunta do ponto de decisão.'); return; }
      payload.nome = pergunta;
    } else {
      const selDoc = document.getElementById('cfg-nova-etapa-doc');
      if (selDoc.value === '__novo__') {
        const nomeNovo = document.getElementById('cfg-etapa-doc-novo-nome').value.trim();
        if (!nomeNovo) { alert('Informe o nome do novo tipo de documento.'); return; }
        const rCriar = await api('dados-fixos/criar', { categoria: 'tipo_documento', valor: nomeNovo });
        if (!rCriar.ok) { alert('Erro ao criar tipo de documento: ' + rCriar.erro); return; }
        payload.tipo_documento_id = rCriar.item.id;
        _tiposDocCache.push({ id: rCriar.item.id, categoria: 'tipo_documento', valor: nomeNovo, associado: '' });
      } else if (selDoc.value) {
        payload.tipo_documento_id = selDoc.value;
      } else {
        alert('Selecione ou cadastre um tipo de documento.');
        return;
      }
      const d = await lerDescricaoEtapa('cfg-nova-etapa', payload.tipo_documento_id);
      if (d.erro) { alert(d.erro); return; }
      Object.assign(payload, d.campos);
    }

    const r = await api('fluxo-etapas/criar', payload);
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    document.getElementById('cfg-fluxo-subtipo').value = subtipoId;
    carregarFluxo();
  }

  async function removerEtapaFluxo(id) {
    if (!confirm('Remover esta etapa? Isso também remove as conexões ligadas a ela.')) return;
    const r = await api('fluxo-etapas/remover', { id });
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    carregarFluxo();
  }

  async function criarConexaoFluxo(subtipoId) {
    const origem = document.getElementById('cfg-nova-conexao-origem').value || null;
    const destino = document.getElementById('cfg-nova-conexao-destino').value;
    const rotulo = document.getElementById('cfg-nova-conexao-rotulo').value.trim() || null;
    if (!destino) { alert('Selecione o destino da conexão.'); return; }

    const alternativa = document.getElementById('cfg-nova-conexao-alt').checked;
    const r = await api('fluxo-conexoes/criar', { subtipo_id: subtipoId, etapa_origem_id: origem, etapa_destino_id: destino, rotulo, alternativa });
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    document.getElementById('cfg-fluxo-subtipo').value = subtipoId;
    carregarFluxo();
  }

  async function removerConexaoFluxo(id) {
    if (!confirm('Remover esta conexão?')) return;
    const r = await api('fluxo-conexoes/remover', { id });
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    carregarFluxo();
  }

  // ==================== USUÁRIOS (admin) ====================
  async function carregarUsuariosAdmin() {
    const el = document.getElementById('cfg-lista-usuarios');
    const r = await api('usuarios-admin/listar');
    if (!r.ok) { el.innerHTML = `<div class="text-muted" style="padding:8px 0;color:#dc2626;">Erro: ${r.erro}</div>`; return; }
    const usuarios = r.usuarios || [];
    el.innerHTML = usuarios.length ? usuarios.map((u) => `
      <div class="config-item">
        <div class="item-info">
          <b>${u.nome}</b> <small>${u.email}</small>
          <select onchange="definirPerfilAdmin('${u.id}', this.value, this)" title="Perfil" style="font-size:.75rem;padding:1px 4px;">
            ${[['admin', 'Admin'], ['monitor', 'Monitor'], ['consultor', 'Consultor']].map(([v, r]) => `<option value="${v}" ${u.perfil === v ? 'selected' : ''}>${r}</option>`).join('')}
          </select>
          ${u.ativo === false ? '<small style="color:#dc2626;">inativo</small>' : ''}
        </div>
        <div style="display:flex;gap:4px;">
          <button onclick="resetarSenhaAdmin('${u.id}','${u.nome.replace(/'/g, "\\'")}')" title="Redefinir senha">🔑</button>
          <button onclick="ativarDesativarAdmin('${u.id}','${u.ativo === false ? 'ativar' : 'desativar'}')" title="${u.ativo === false ? 'Ativar' : 'Desativar'}">${u.ativo === false ? '✅' : '🚫'}</button>
        </div>
      </div>`).join('') : '<div class="text-muted" style="padding:8px 0;">Nenhum usuário encontrado.</div>';
  }

  async function criarUsuarioAdmin() {
    const nome = document.getElementById('cfg-novo-usr-nome').value.trim();
    const email = document.getElementById('cfg-novo-usr-email').value.trim();
    const senha = document.getElementById('cfg-novo-usr-senha').value;
    const perfil = document.getElementById('cfg-novo-usr-perfil').value;
    if (!nome || !email || !senha) { alert('Preencha nome, e-mail e senha.'); return; }
    if (senha.length < 6) { alert('A senha deve ter ao menos 6 caracteres.'); return; }

    const r = await api('usuarios-admin/criar', { nome, email, senha, perfil });
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    document.getElementById('cfg-novo-usr-nome').value = '';
    document.getElementById('cfg-novo-usr-email').value = '';
    document.getElementById('cfg-novo-usr-senha').value = '';
    carregarUsuariosAdmin();
  }

  async function resetarSenhaAdmin(usuarioId, nome) {
    const senha = prompt(`Nova senha para ${nome}:`);
    if (!senha) return;
    if (senha.length < 6) { alert('A senha deve ter ao menos 6 caracteres.'); return; }
    const r = await api('usuarios-admin/resetar-senha', { usuario_id: usuarioId, senha });
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    alert('Senha redefinida.');
  }

  async function definirPerfilAdmin(usuarioId, novoPerfil, sel) {
    const txt = { admin: 'Admin — faz tudo, inclusive fluxos, cadastros, tarefas e usuários', monitor: 'Monitor — usa o sistema no dia a dia, sem criar fluxos nem tarefas', consultor: 'Consultor — apenas visualiza' }[novoPerfil];
    if (!confirm('Mudar o perfil deste usuário para:\n' + txt + '?')) { carregarUsuariosAdmin(); return; }
    const r = await api('usuarios-admin/definir-perfil', { usuario_id: usuarioId, perfil: novoPerfil });
    if (!r.ok) { alert('Erro: ' + r.erro); carregarUsuariosAdmin(); return; }
    carregarUsuariosAdmin();
  }

  async function ativarDesativarAdmin(usuarioId, acao) {
    const r = await api(`usuarios-admin/${acao}`, { usuario_id: usuarioId });
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    carregarUsuariosAdmin();
  }

  async function removerDadoFixo(id) {
    if (!confirm('Remover este item?')) return;
    const r = await api('dados-fixos/remover', { id });
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    _tiposCache = null; _unidadesCache = null;
    carregarConfig();
  }

  async function removerSubtipo(id) {
    if (!confirm('Remover este subtipo?')) return;
    const r = await api('subtipos/remover', { id });
    if (!r.ok) { alert('Erro: ' + r.erro); return; }
    carregarConfig();
  }

  // ==================== UTIL ====================
  function formatarDataHora(s) {
    if (!s) return '—';
    const d = new Date(s);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  }

  // ==================== INICIALIZAÇÃO ====================
  (async () => {
    const { data: { session } } = await supa.auth.getSession();
    if (session) mostrarApp();
  })();

  document.getElementById('login-senha').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fazerLogin();
  });
</script>
</body>
