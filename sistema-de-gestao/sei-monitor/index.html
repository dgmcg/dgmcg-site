  // ==================== TEMPO DO PROCESSO + RELATÓRIOS ====================
  function dataCurtaRelExt(s) {
    if (!s) return '—';
    const str = String(s);
    if (str.length <= 10) { const [a, m, d] = str.split('-'); return `${d}/${m}/${a}`; }
    const d = new Date(str); return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR');
  }

  /** Linha "Em tramitação há X dias" / "Tramitou por X dias" (HTML) para a tela do processo. */
  function htmlTempoProcessoExt(proc) {
    if (proc.dias_tramitacao === null || proc.dias_tramitacao === undefined) return '';
    const d = proc.dias_tramitacao;
    const dTxt = `${d} dia${d === 1 ? '' : 's'}`;
    const ini = dataCurtaRelExt(proc.inicio_tramitacao);
    const encerrouStatus = ['Concluído', 'Suspenso'].includes(proc.status);
    if (proc.tramitacao_encerrada) {
      return `<b>Tramitou por:</b> ${dTxt} <span class="text-muted">(de ${ini} a ${dataCurtaRelExt(proc.encerrado_em)} — ${escHtmlSite(proc.status.toLowerCase())})</span>`;
    }
    if (encerrouStatus) {
      return `<b>Tempo desde o início:</b> ${dTxt} <span class="text-muted">(desde ${ini}; a data de encerramento ainda não foi registrada)</span>`;
    }
    return `<b>Em tramitação há:</b> ${dTxt} <span class="text-muted">(desde ${ini})</span>`;
  }

  // ==================== FLUXOS: DIAGRAMA, VERIFICAÇÃO E DOCUMENTAÇÃO (site e extensão) ====================
  // Usa as mesmas etapas/conexões da configuração (fluxo-etapas/listar e fluxo-conexoes/listar).
  // A posição das etapas vem do mesmo algoritmo do caminho do processo (layoutJornadaGrafo);
  // o desenho aqui é um SVG próprio, com caixas, losangos de decisão e rótulos nas setas,
  // que serve para a tela, para a prévia da configuração e (convertido em imagem) para o PDF.
  const COR_FD = { azul: '#0046A3', azulEscuro: '#00306F', azulClaro: '#E8F0FB', dourado: '#F2A900', vermelho: '#C8102E', ambar: '#B26A00', cinza: '#5B6573', seta: '#7B8AA0', texto: '#1F2937', decisao: '#FFF6E0' };
  const escFD = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nomeEtapaFD = (e) => (e && (e.nome_exibicao || e.nome)) || '(sem nome)';
  const setoresFD = (e) => (e.setores || []).map((s) => s.nome || s).filter(Boolean);

  function quebrarTextoFD(t, maxCh, maxLin) {
    const palavras = String(t || '').replace(/\s+/g, ' ').trim().split(' ');
    const linhas = []; let atual = '';
    palavras.forEach((p) => {
      if (!atual) atual = p;
      else if ((atual + ' ' + p).length <= maxCh) atual += ' ' + p;
      else { linhas.push(atual); atual = p; }
    });
    if (atual) linhas.push(atual);
    const saida = linhas.slice(0, maxLin).map((l) => (l.length > maxCh ? l.slice(0, maxCh - 1) + '…' : l));
    if (linhas.length > maxLin) saida[maxLin - 1] = saida[maxLin - 1].slice(0, maxCh - 1).replace(/\s*\S*$/, '') + '…';
    return saida;
  }

  /** Posições (coluna/faixa), numeração na ordem de leitura e classificação das conexões. */
  function estruturaFluxoFD(etapas, conexoes) {
    const idx = {}; etapas.forEach((e, i) => { idx[e.id] = i; });
    const validas = conexoes.filter((c) => idx[c.etapa_destino_id] !== undefined && (c.etapa_origem_id == null || idx[c.etapa_origem_id] !== undefined));
    const L = layoutJornadaGrafo(etapas.map((e) => ({ etapa_id: e.id, tipo: e.tipo, status: 'pendente' })), validas);
    const ordem = etapas.map((_, i) => i).sort((a, b) => (L.pos[a].col - L.pos[b].col) || (L.pos[a].row - L.pos[b].row));
    const numero = {}; ordem.forEach((i, k) => { numero[etapas[i].id] = k + 1; });
    const naFrente = new Set(L.arestas.map((a) => a[0] + '>' + a[1]));
    const setas = [], retornos = [], inicio = [];
    const vistas = new Set();
    validas.forEach((c) => {
      const d = idx[c.etapa_destino_id];
      if (c.etapa_origem_id == null) { inicio.push({ d, c }); return; }
      const o = idx[c.etapa_origem_id];
      const k = o + '>' + d;
      if (vistas.has(k)) return; vistas.add(k);
      if (o === d) { retornos.push({ o, d, c }); return; }
      if (naFrente.has(k)) {
        const a = L.arestas.find((x) => x[0] === o && x[1] === d);
        setas.push({ o, d, c, desvio: a ? a[4] : 0 });
      } else retornos.push({ o, d, c });
    });
    return { L, ordem, numero, setas, retornos, inicio, validas };
  }

  /**
   * SVG do fluxo. op: { destaque: [ids], erro: [ids], fantasma: {origem, destino, rotulo, alternativa}, clicavel }
   * Devolve { svg, w, h, numero, ordem }.
   */
  function svgFluxoFD(etapas, conexoes, op = {}) {
    const extra = [];
    if (op.fantasma && op.fantasma.destino) extra.push({ id: '__fantasma__', etapa_origem_id: op.fantasma.origem || null, etapa_destino_id: op.fantasma.destino, rotulo: op.fantasma.rotulo || '', alternativa: !!op.fantasma.alternativa, _fantasma: true });
    const E = estruturaFluxoFD(etapas, conexoes.concat(extra));
    const { L, numero, setas, retornos, inicio } = E;
    const BW = 164, BH = 60, GX = 96, GY = 30, PAD = 16, INI = 56;
    const temInicio = inicio.length > 0;
    const x0 = PAD + (temInicio ? INI : 0);
    // retornos: passam por cima quando não há caixa acima da origem e do destino; senão, por baixo
    const livre = (i, acima) => !etapas.some((_, j) => j !== i && L.pos[j].col === L.pos[i].col && (acima ? L.pos[j].row < L.pos[i].row : L.pos[j].row > L.pos[i].row));
    const retCima = [], retBaixo = [];
    retornos.forEach((r) => ((livre(r.o, true) && livre(r.d, true)) || !(livre(r.o, false) && livre(r.d, false)) ? retCima : retBaixo).push(r));
    const temArco = setas.some((s) => s.desvio && L.pos[s.o].row === 0);
    const TOPO = PAD + (retCima.length ? 10 + retCima.length * 16 : 0) + (temArco ? 40 : 0);
    const X = (col) => x0 + col * (BW + GX);
    const Y = (row) => TOPO + row * (BH + GY);
    const baseY = TOPO + L.nrows * (BH + GY) - GY;
    const w = Math.max(x0 + L.ncols * (BW + GX) - GX + PAD, 320);
    const h = baseY + PAD + (retBaixo.length ? 14 + retBaixo.length * 16 : 0);
    const cortes = []; for (let c = 1; c < L.ncols; c++) cortes.push(X(c) - GX / 2);
    const destaque = new Set(op.destaque || []), erro = new Set(op.erro || []);
    const p = [];
    p.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="Arial, Helvetica, sans-serif">`);
    p.push(`<defs><marker id="fdSeta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${COR_FD.seta}"/></marker>`
      + `<marker id="fdSetaAlt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${COR_FD.ambar}"/></marker>`
      + `<marker id="fdSetaF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${COR_FD.dourado}"/></marker></defs>`);
    p.push(`<rect width="${w}" height="${h}" fill="#FFFFFF"/>`);
    const rotulos = [];
    const rotuloEm = (x, y, t, cor) => {
      if (!t) return;
      const tx = String(t).length > 16 ? String(t).slice(0, 15) + '…' : String(t);
      const lw = tx.length * 5.3 + 10;
      rotulos.push(`<g><title>${escFD(t)}</title><rect x="${x - lw / 2}" y="${y - 8}" width="${lw}" height="15" rx="7" fill="#FFFFFF" stroke="${cor}" stroke-width="1"/><text x="${x}" y="${y + 3.5}" font-size="9" font-weight="bold" fill="${cor}" text-anchor="middle">${escFD(tx)}</text></g>`);
    };
    const estiloSeta = (c) => (c._fantasma ? `stroke="${COR_FD.dourado}" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#fdSetaF)"`
      : c.alternativa ? `stroke="${COR_FD.ambar}" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#fdSetaAlt)"`
        : `stroke="${COR_FD.seta}" stroke-width="1.6" marker-end="url(#fdSeta)"`);
    const corRot = (c) => (c._fantasma ? COR_FD.ambar : c.alternativa ? COR_FD.ambar : COR_FD.azulEscuro);

    // início
    if (temInicio) {
      const rows = inicio.map((s) => L.pos[s.d].row);
      const ry = Y(Math.min(...rows)) + BH / 2;
      p.push(`<circle cx="${PAD + 14}" cy="${ry}" r="13" fill="${COR_FD.azul}"/><text x="${PAD + 14}" y="${ry + 3}" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="bold">INÍCIO</text>`);
      inicio.forEach(({ d, c }) => {
        const x1 = PAD + 27, y1 = ry, x2 = X(L.pos[d].col) - 2, y2 = Y(L.pos[d].row) + BH / 2;
        const dx = Math.max(10, (x2 - x1) / 2);
        p.push(`<path d="M${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}" fill="none" ${estiloSeta(c)}/>`);
      });
    }
    // setas para a frente
    setas.forEach(({ o, d, c, desvio }) => {
      const po = L.pos[o], pd = L.pos[d];
      const x1 = X(po.col) + BW, y1 = Y(po.row) + BH / 2, x2 = X(pd.col) - 2, y2 = Y(pd.row) + BH / 2;
      let dpath, mx, my;
      if (po.row === pd.row && desvio) {
        const alt = BH * 0.95;
        dpath = `M${x1} ${y1 - 8} C ${x1 + (x2 - x1) / 3} ${y1 - alt}, ${x2 - (x2 - x1) / 3} ${y2 - alt}, ${x2} ${y2 - 8}`;
        mx = (x1 + x2) / 2; my = y1 - alt * 0.75;
      } else if (po.row === pd.row) {
        dpath = `M${x1} ${y1} L ${x2} ${y2}`; mx = (x1 + x2) / 2; my = y1;
      } else {
        const dx = Math.max(12, (x2 - x1) / 2);
        dpath = `M${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`; mx = (x1 + x2) / 2; my = (y1 + y2) / 2;
      }
      p.push(`<path d="${dpath}" fill="none" ${estiloSeta(c)}/>`);
      rotuloEm(mx, my, c.rotulo || (c.alternativa ? 'alternativa' : ''), corRot(c));
    });
    // retornos: passam por baixo do desenho
    const desenharRetorno = ({ o, d, c }, yl, cima) => {
      const po = L.pos[o], pd = L.pos[d];
      const xo = X(po.col) + BW / 2 + 10, xd = X(pd.col) + BW / 2 - 10;
      const yo = Y(po.row) + (cima ? 0 : BH), yd = Y(pd.row) + (cima ? 0 : BH);
      const cor = c._fantasma ? COR_FD.dourado : COR_FD.cinza;
      p.push(`<path d="M${xo} ${yo} L ${xo} ${yl} L ${xd} ${yl} L ${xd} ${yd + (cima ? -2 : 2)}" fill="none" stroke="${cor}" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#${c._fantasma ? 'fdSetaF' : 'fdSeta'})"/>`);
      rotuloEm((xo + xd) / 2, yl, 'retorno' + (c.rotulo ? ': ' + c.rotulo : ''), cor);
    };
    retCima.forEach((r, k) => desenharRetorno(r, PAD + 6 + k * 16, true));
    retBaixo.forEach((r, k) => desenharRetorno(r, baseY + 14 + k * 16, false));
    // etapas
    etapas.forEach((e, i) => {
      const pos = L.pos[i]; const x = X(pos.col), y = Y(pos.row);
      const ehErro = erro.has(e.id), ehDest = destaque.has(e.id);
      const borda = ehDest ? COR_FD.dourado : ehErro ? COR_FD.vermelho : (e.tipo === 'gateway' ? COR_FD.ambar : COR_FD.azul);
      const larg = ehDest ? 3.5 : ehErro ? 2.4 : 1.5;
      p.push(`<g data-fd-etapa="${escFD(e.id)}"${op.clicavel ? ' style="cursor:pointer"' : ''}><title>${escFD(nomeEtapaFD(e))}</title>`);
      if (e.tipo === 'gateway') {
        p.push(`<polygon points="${x + BW / 2},${y} ${x + BW},${y + BH / 2} ${x + BW / 2},${y + BH} ${x},${y + BH / 2}" fill="${COR_FD.decisao}" stroke="${borda}" stroke-width="${larg}"/>`);
        const ls = quebrarTextoFD(nomeEtapaFD(e), 19, 3);
        const y0 = y + BH / 2 - (ls.length - 1) * 5.5 + 3.5;
        ls.forEach((l, k) => p.push(`<text x="${x + BW / 2}" y="${y0 + k * 11}" font-size="9.5" font-weight="bold" fill="${COR_FD.texto}" text-anchor="middle">${escFD(l)}</text>`));
      } else {
        p.push(`<rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="7" fill="#FFFFFF" stroke="${borda}" stroke-width="${larg}"/>`);
        p.push(`<rect x="${x}" y="${y}" width="5" height="${BH}" rx="2" fill="${COR_FD.azul}"/>`);
        const ls = quebrarTextoFD(nomeEtapaFD(e), 25, 2);
        ls.forEach((l, k) => p.push(`<text x="${x + 13}" y="${y + 17 + k * 12.5}" font-size="10.5" font-weight="bold" fill="${COR_FD.azulEscuro}">${escFD(l)}</text>`));
        const st = setoresFD(e).map((s) => s.replace(/^SES\s*-\s*/i, '')).join(', ');
        const marcas = [e.exige_id_sei ? (e.multiplos_documentos ? 'vários docs' : 'nº doc') : (e.multiplos_documentos ? 'vários docs' : ''), e.exige_valor ? 'R$' : '', (e.modelo_documento || e.modelo_despacho) ? 'modelo' : '', e.prazo_exigido ? '⏱ prazo' : ''].filter(Boolean).join(' · ');
        const linha = [st, marcas].filter(Boolean).join('   ');
        if (linha) p.push(`<text x="${x + 13}" y="${y + BH - 9}" font-size="8.5" fill="${COR_FD.cinza}">${escFD(linha.length > 36 ? linha.slice(0, 35) + '…' : linha)}</text>`);
      }
      const n = numero[e.id];
      p.push(`<circle cx="${x + (e.tipo === 'gateway' ? BW / 2 - 30 : 0)}" cy="${y + (e.tipo === 'gateway' ? 12 : 0)}" r="9" fill="${ehErro ? COR_FD.vermelho : COR_FD.azulEscuro}"/><text x="${x + (e.tipo === 'gateway' ? BW / 2 - 30 : 0)}" y="${y + (e.tipo === 'gateway' ? 15.5 : 3.5)}" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">${n}</text>`);
      p.push('</g>');
    });
    p.push(rotulos.join(''));
    p.push('</svg>');
    return { svg: p.join(''), w, h, cortes, numero, ordem: E.ordem.map((i) => etapas[i].id) };
  }

  /** Falhas e pontos de atenção da configuração do fluxo. nivel: 'erro' | 'aviso' | 'info'. */
  function verificarFluxoFD(etapas, conexoes) {
    const R = [];
    if (!etapas.length) return R;
    const ids = new Set(etapas.map((e) => e.id));
    const porId = {}; etapas.forEach((e) => { porId[e.id] = e; });
    const nome = (id) => `“${nomeEtapaFD(porId[id])}”`;
    const validas = conexoes.filter((c) => ids.has(c.etapa_destino_id) && (c.etapa_origem_id == null || ids.has(c.etapa_origem_id)));
    const entram = {}, saem = {};
    etapas.forEach((e) => { entram[e.id] = []; saem[e.id] = []; });
    validas.forEach((c) => { entram[c.etapa_destino_id].push(c); if (c.etapa_origem_id) saem[c.etapa_origem_id].push(c); });
    const inicios = validas.filter((c) => !c.etapa_origem_id);
    if (!inicios.length) R.push({ nivel: 'erro', texto: 'O fluxo não tem conexão saindo de “— Início —”. Sem ela, nenhum processo começa o checklist.', ids: [] });

    const quebradas = conexoes.length - validas.length;
    if (quebradas) R.push({ nivel: 'erro', texto: `${quebradas} conexão(ões) apontam para etapa que não existe mais. Remova ou refaça.`, ids: [] });

    validas.forEach((c) => { if (c.etapa_origem_id && c.etapa_origem_id === c.etapa_destino_id) R.push({ nivel: 'erro', texto: `${nome(c.etapa_origem_id)} está ligada a ela mesma.`, ids: [c.etapa_origem_id] }); });

    const dup = {};
    validas.forEach((c) => { const k = (c.etapa_origem_id || 'INICIO') + '>' + c.etapa_destino_id; dup[k] = (dup[k] || 0) + 1; });
    Object.entries(dup).forEach(([k, n]) => {
      if (n < 2) return;
      const [o, d] = k.split('>');
      R.push({ nivel: 'aviso', texto: `Conexão repetida: ${o === 'INICIO' ? '“Início”' : nome(o)} → ${nome(d)} (${n} vezes).`, ids: [d].concat(o === 'INICIO' ? [] : [o]) });
    });

    // alcance a partir do início
    const alcancadas = new Set();
    const fila = inicios.map((c) => c.etapa_destino_id);
    while (fila.length) { const u = fila.shift(); if (alcancadas.has(u)) continue; alcancadas.add(u); saem[u].forEach((c) => fila.push(c.etapa_destino_id)); }
    etapas.forEach((e) => {
      if (!entram[e.id].length) R.push({ nivel: 'aviso', texto: `Nenhuma conexão chega em ${nome(e.id)}: ela nunca será iniciada.`, ids: [e.id] });
      else if (inicios.length && !alcancadas.has(e.id)) R.push({ nivel: 'aviso', texto: `${nome(e.id)} não é alcançada a partir do início (as conexões que chegam nela vêm de etapas também isoladas).`, ids: [e.id] });
    });

    etapas.filter((e) => e.tipo === 'gateway').forEach((g) => {
      const s = saem[g.id];
      if (s.length < 2) R.push({ nivel: 'erro', texto: `O ponto de decisão ${nome(g.id)} tem ${s.length} saída(s); precisa de pelo menos duas respostas.`, ids: [g.id] });
      const semRot = s.filter((c) => !String(c.rotulo || '').trim());
      if (semRot.length) R.push({ nivel: 'aviso', texto: `${semRot.length} saída(s) do ponto de decisão ${nome(g.id)} estão sem rótulo (ex.: “Sim”/“Não”).`, ids: [g.id] });
      const rots = s.map((c) => String(c.rotulo || '').trim().toLowerCase()).filter(Boolean);
      if (new Set(rots).size < rots.length) R.push({ nivel: 'aviso', texto: `O ponto de decisão ${nome(g.id)} tem respostas com o mesmo rótulo.`, ids: [g.id] });
    });

    validas.forEach((c) => {
      if (!c.alternativa) return;
      if (entram[c.etapa_destino_id].length < 2) R.push({ nivel: 'aviso', texto: `A conexão para ${nome(c.etapa_destino_id)} está marcada como alternativa, mas é a única que chega nela (a marcação não tem efeito).`, ids: [c.etapa_destino_id] });
    });
    validas.forEach((c) => {
      if (c.rotulo && c.etapa_origem_id && porId[c.etapa_origem_id].tipo !== 'gateway' && saem[c.etapa_origem_id].length < 2)
        R.push({ nivel: 'info', texto: `A conexão ${nome(c.etapa_origem_id)} → ${nome(c.etapa_destino_id)} tem rótulo, mas não sai de um ponto de decisão.`, ids: [c.etapa_origem_id] });
    });

    etapas.forEach((e) => {
      if (e.tipo !== 'gateway' && e.exige_id_sei && !setoresFD(e).length)
        R.push({ nivel: 'aviso', texto: `${nome(e.id)} exige o nº do documento mas não tem setor responsável; a sugestão automática pela sigla fica mais fraca.`, ids: [e.id] });
    });

    // ciclos (retornos) — podem ser intencionais (devolução para correção)
    const E = estruturaFluxoFD(etapas, validas);
    E.retornos.forEach(({ c }) => R.push({ nivel: 'info', texto: `Há retorno de ${nome(c.etapa_origem_id)} para ${nome(c.etapa_destino_id)}${c.rotulo ? ` (“${c.rotulo}”)` : ''}. Confira se é intencional.`, ids: [c.etapa_origem_id, c.etapa_destino_id] }));
    const finais = etapas.filter((e) => e.tipo !== 'gateway' && !saem[e.id].length && entram[e.id].length);
    if (finais.length) R.push({ nivel: 'info', texto: `O fluxo termina em: ${finais.map((e) => nome(e.id)).join(', ')}. Se alguma delas não deveria ser final, falta uma conexão saindo dela.`, ids: finais.map((e) => e.id) });

    const peso = { erro: 0, aviso: 1, info: 2 };
    return R.sort((a, b) => peso[a.nivel] - peso[b.nivel]);
  }

  const ICONE_NIVEL_FD = { erro: '⛔', aviso: '⚠️', info: 'ℹ️' };
  function htmlVerificacaoFD(itens) {
    if (!itens.length) return '<div class="fd-verif fd-ok">✓ Nenhuma falha encontrada na configuração deste fluxo.</div>';
    const n = (nv) => itens.filter((x) => x.nivel === nv).length;
    return `<div class="fd-verif"><div class="fd-verif-tit">Verificação do fluxo: ${n('erro')} erro(s), ${n('aviso')} aviso(s), ${n('info')} observação(ões) <small>— clique para destacar no desenho</small></div>
      ${itens.map((x, k) => `<div class="fd-verif-item fd-${x.nivel}" data-fd-aviso="${k}">${ICONE_NIVEL_FD[x.nivel]} ${escFD(x.texto)}</div>`).join('')}</div>`;
  }

  /** Destaca etapas no SVG já desenhado (sem redesenhar). */
  function destacarEtapasFD(container, ids) {
    container.querySelectorAll('[data-fd-etapa]').forEach((g) => {
      const on = ids.includes(g.getAttribute('data-fd-etapa'));
      g.style.opacity = ids.length && !on ? '0.35' : '1';
      const forma = g.querySelector('rect, polygon');
      if (!forma) return;
      if (!forma.hasAttribute('data-sw0')) { forma.setAttribute('data-sw0', forma.getAttribute('stroke-width')); forma.setAttribute('data-st0', forma.getAttribute('stroke')); }
      forma.setAttribute('stroke-width', on ? '4' : forma.getAttribute('data-sw0'));
      forma.setAttribute('stroke', on ? COR_FD.dourado : forma.getAttribute('data-st0'));
    });
    const alvo = ids.length && container.querySelector(`[data-fd-etapa="${ids[0]}"]`);
    if (alvo && alvo.scrollIntoView) alvo.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }

  // ---------- Documentação (diagrama + fichas das etapas) ----------
  function ligacoesFD(etapas, conexoes, e) {
    const porId = {}; etapas.forEach((x) => { porId[x.id] = x; });
    const chegaDe = conexoes.filter((c) => c.etapa_destino_id === e.id).map((c) => (c.etapa_origem_id ? nomeEtapaFD(porId[c.etapa_origem_id]) : 'Início') + (c.rotulo ? ` (se “${c.rotulo}”)` : '') + (c.alternativa ? ' — alternativa' : ''));
    const segue = conexoes.filter((c) => c.etapa_origem_id === e.id && porId[c.etapa_destino_id]).map((c) => (c.rotulo ? `“${c.rotulo}” → ` : '') + nomeEtapaFD(porId[c.etapa_destino_id]));
    return { chegaDe, segue };
  }

  /** Dados prontos para tela e PDF: etapas em ordem de leitura, com número e ligações. */
  function montarDocFluxoFD(titulo, etapas, conexoes) {
    const desenho = svgFluxoFD(etapas, conexoes, { clicavel: true });
    const porId = {}; etapas.forEach((e) => { porId[e.id] = e; });
    const lista = desenho.ordem.map((id) => {
      const e = porId[id];
      const lig = ligacoesFD(etapas, conexoes, e);
      return {
        id, numero: desenho.numero[id], nome: nomeEtapaFD(e), tipo: e.tipo,
        tipo_documento: e.tipos_documento?.nome || '', variacao: e.variacao_nome || e.tipo_documento_variacoes?.nome || '',
        setores: setoresFD(e), exige_id_sei: !!e.exige_id_sei, exige_valor: !!e.exige_valor, multiplos_documentos: !!e.multiplos_documentos, obrigatoria: e.obrigatoria,
        importancia: e.importancia || '', detalhes: e.detalhes || '',
        modelo_documento: String(e.modelo_documento || '').trim(), modelo_despacho: String(e.modelo_despacho || '').trim(),
        chega_de: lig.chegaDe, segue_para: lig.segue,
      };
    });
    return { titulo, etapas: lista, desenho, verificacao: verificarFluxoFD(etapas, conexoes), total_conexoes: conexoes.length };
  }

  function htmlDocFluxoFD(doc) {
    const nEt = doc.etapas.filter((e) => e.tipo !== 'gateway').length, nDec = doc.etapas.length - nEt;
    const setores = [...new Set(doc.etapas.flatMap((e) => e.setores))];
    const ficha = (e) => {
      const linhas = [];
      if (e.tipo === 'gateway') linhas.push(['Tipo', 'Ponto de decisão']);
      else linhas.push(['Documento', [e.tipo_documento, e.variacao].filter(Boolean).join(' — ') || e.nome]);
      if (e.setores.length) linhas.push(['Setores responsáveis', e.setores.join(', ')]);
      const exige = [e.exige_id_sei ? 'nº do documento no SEI' : '', e.exige_valor ? 'valor (R$)' : ''].filter(Boolean);
      if (exige.length) linhas.push(['Ao concluir, exige', exige.join(' e ') + (e.multiplos_documentos ? ' — aceita vários documentos (um por linha)' : '')]);
      else if (e.multiplos_documentos) linhas.push(['Documentos', 'aceita vários documentos']);
      if (e.importancia) linhas.push(['Importância', e.importancia]);
      if (e.detalhes) linhas.push(['Detalhes', e.detalhes]);
      linhas.push(['Vem de', e.chega_de.join('; ') || '—']);
      linhas.push([e.tipo === 'gateway' ? 'Respostas' : 'Segue para', e.segue_para.join('; ') || 'fim do fluxo']);
      const botoes = [
        e.modelo_documento ? `<button class="fd-btn-modelo" data-fd-modelo="documento" data-fd-id="${escFD(e.id)}">📝 Modelo do documento</button>` : '',
        e.modelo_despacho ? `<button class="fd-btn-modelo" data-fd-modelo="despacho" data-fd-id="${escFD(e.id)}">📨 Modelo da solicitação</button>` : '',
      ].join('');
      return `<div class="fd-ficha${e.tipo === 'gateway' ? ' fd-ficha-dec' : ''}" data-fd-ficha="${escFD(e.id)}">
        <div class="fd-ficha-tit"><span class="fd-num">${e.numero}</span>${escFD(e.nome)}</div>
        <table class="fd-pares">${linhas.map(([k, v]) => `<tr><td>${escFD(k)}</td><td>${escFD(v)}</td></tr>`).join('')}</table>
        ${botoes ? `<div class="fd-botoes">${botoes}</div>` : ''}
      </div>`;
    };
    return `<div class="fd-doc">
      <div class="fd-resumo"><b>${nEt}</b> etapa(s) · <b>${nDec}</b> ponto(s) de decisão · <b>${doc.total_conexoes}</b> conexão(ões)${setores.length ? ` · setores: ${escFD(setores.join(', '))}` : ''}</div>
      <div class="fd-desenho">${doc.desenho.svg}</div>
      <div class="fd-legenda">Caixa = etapa (o número leva à ficha abaixo) · losango = ponto de decisão · seta tracejada laranja = conexão alternativa · tracejado cinza = retorno · “nº doc”, “vários docs”, “R$”, “modelo” = o que a etapa exige ou oferece.</div>
      ${doc.verificacao.some((v) => v.nivel !== 'info') ? `<details class="fd-det"><summary>Pontos de atenção na configuração (${doc.verificacao.filter((v) => v.nivel !== 'info').length})</summary>${htmlVerificacaoFD(doc.verificacao)}</details>` : ''}
      <div class="fd-fichas">${doc.etapas.map(ficha).join('')}</div>
      <div class="fd-modelo-caixa" hidden></div>
    </div>`;
  }

  /** Liga os cliques: caixa no desenho → ficha; botão de modelo → caixa com o texto. */
  function ativarDocFluxoFD(container, doc) {
    container.querySelectorAll('.fd-desenho [data-fd-etapa]').forEach((g) => g.addEventListener('click', () => {
      const f = container.querySelector(`[data-fd-ficha="${g.getAttribute('data-fd-etapa')}"]`);
      if (!f) return;
      f.scrollIntoView({ block: 'start', behavior: 'smooth' });
      f.classList.add('fd-pisca'); setTimeout(() => f.classList.remove('fd-pisca'), 1400);
    }));
    container.querySelectorAll('[data-fd-aviso]').forEach((el) => el.addEventListener('click', () => {
      const item = doc.verificacao[Number(el.getAttribute('data-fd-aviso'))];
      destacarEtapasFD(container.querySelector('.fd-desenho'), item ? item.ids : []);
    }));
    const caixa = container.querySelector('.fd-modelo-caixa');
    container.querySelectorAll('[data-fd-modelo]').forEach((b) => b.addEventListener('click', () => {
      const e = doc.etapas.find((x) => x.id === b.getAttribute('data-fd-id'));
      const qual = b.getAttribute('data-fd-modelo');
      const texto = qual === 'documento' ? e.modelo_documento : e.modelo_despacho;
      caixa.innerHTML = `<div class="fd-modelo-in">
        <div class="fd-modelo-cab"><div><b>${qual === 'documento' ? 'Modelo do documento' : 'Modelo da solicitação'}</b> — ${escFD(e.nome)}
          <div class="fd-modelo-sub">${qual === 'documento' ? 'Texto-base do próprio documento desta etapa.' : 'Texto-base do despacho que solicita este documento ao setor responsável.'}</div></div>
          <button class="fd-x" data-fd-fechar>✕</button></div>
        <pre class="fd-modelo-txt">${escFD(texto)}</pre>
        <div class="fd-modelo-pe"><span class="fd-modelo-st"></span><button class="btn btn-secondary" data-fd-copiar>📋 Copiar texto</button></div></div>`;
      caixa.hidden = false;
      caixa.querySelector('[data-fd-fechar]').onclick = () => { caixa.hidden = true; };
      caixa.onclick = (ev) => { if (ev.target === caixa) caixa.hidden = true; };
      caixa.querySelector('[data-fd-copiar]').onclick = async () => {
        try { await navigator.clipboard.writeText(texto); caixa.querySelector('.fd-modelo-st').textContent = 'Copiado.'; }
        catch (err) { caixa.querySelector('.fd-modelo-st').textContent = 'Não consegui copiar; selecione o texto e use Ctrl+C.'; }
      };
    }));
  }

  // ---------- Catálogo de fluxos (janela larga) ----------
  async function abrirCatalogoFluxosFD(subtipoInicial) {
    const modal = abrirModalRelExt('<h3>Fluxos de processos</h3><div class="text-muted"><span class="spinner"></span> Carregando fluxos...</div>');
    const r = await api('subtipos/listar');
    if (!r || !r.ok) { modal.innerHTML = '<h3>Fluxos de processos</h3><div class="pg-aviso">Não consegui carregar os subtipos.</div>'; return; }
    const subtipos = r.subtipos || [];
    const cache = {};
    const carregar = async (sid) => {
      if (!cache[sid]) {

  // ---- Adaptador da IA local no SITE: fala com a extensão pela ponte (ponte_site.js) ----
  const AMBIENTE_IA = 'site';
  const _pendentesIA = {}; let _seqIA = 0;
  window.addEventListener('message', (ev) => {
    if (ev.source !== window || !ev.data || ev.data.fonte !== 'sei-monitor-ext') return;
    const d = ev.data; const h = _pendentesIA[d.id]; if (!h) return;
    if (d.progresso) { if (d.progresso.fim) { delete _pendentesIA[d.id]; h.res(d.progresso); } else if (h.prog) h.prog(d.progresso); return; }
    delete _pendentesIA[d.id]; h.res(d);
  });
  function _pedirPonteIA(dados, prog, ms) {
    return new Promise((res) => {
      const id = 'ia' + (++_seqIA);
      _pendentesIA[id] = { res, prog };
      window.postMessage({ fonte: 'sei-monitor-site', id, ...dados }, '*');
      if (ms) setTimeout(() => { if (_pendentesIA[id]) { delete _pendentesIA[id]; res({ ok: false, erro: 'sem_ponte' }); } }, ms);
    });
  }
  async function ollamaDisponivelIA() { const r = await _pedirPonteIA({ op: 'ping' }, null, 1500); return !!(r && r.presente); }
  const ollamaPedidoIA = (dados) => _pedirPonteIA(dados, null, dados.op === 'gerar' ? 0 : 15000);
  function ollamaBaixarIA(modelo, registrarCancelar, aoProgresso) {
    const id = 'ia' + (++_seqIA);
    registrarCancelar(() => window.postMessage({ fonte: 'sei-monitor-site', id: id + '-c', op: 'cancelar-baixar', alvo_id: id }, '*'));
    return new Promise((res) => {
      _pendentesIA[id] = { res, prog: aoProgresso };
      window.postMessage({ fonte: 'sei-monitor-site', id, op: 'baixar', modelo }, '*');
    });
  }
  const guardarLocalIA = async (k, v) => { try { localStorage.setItem('seimonitor_' + k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } };
  const lerLocalIA = async (k) => { try { return JSON.parse(localStorage.getItem('seimonitor_' + k) || 'null'); } catch (e) { return null; } };

  // ==================== CONFIGURAÇÃO DE IA (site e extensão) ====================
  // Depende do adaptador de cada ambiente: ollamaDisponivelIA(), ollamaPedidoIA(dados),

  const MODELOS_OLLAMA_IA = [
    { nome: 'qwen3:4b-instruct', rotulo: 'Recomendado', tam: 'cerca de 2,5 GB', desc: 'Responde direto, em português, sem "pensar em voz alta". Bom equilíbrio entre qualidade e velocidade em PC sem placa de vídeo.' },

  /** Mesmo modelo, ignorando ":latest" e o sufixo de quantização (qwen3:4b-instruct = qwen3:4b-instruct-2507-q4_K_M). */
  function mesmoModeloIA(instalado, escolhido) {
    const a = String(instalado || '').replace(/:latest$/, ''), b = String(escolhido || '').replace(/:latest$/, '');
    return a === b || (b.endsWith('-instruct') && a.startsWith(b + '-'));
  }
  /** "qwen3:4b" no Ollama é a versão que sempre "pensa" (em inglês) antes de responder. */
  function modeloQuePensaIA(nome) { return /thinking/i.test(nome || '') || /^qwen3:4b(:latest)?$/i.test(nome || ''); }
  const TEXTO_TESTE_IA = 'Processo administrativo de repactuação de metas do contrato de gestão de uma unidade de saúde. '

    + 'Restam a autorização da Secretária e a assinatura do termo aditivo, seguida da publicação do extrato no Diário Oficial. ';
  const brMbIA = (b) => (b / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' MB';

  /** Teste de velocidade: quantos tokens por segundo a máquina lê e escreve com o modelo escolhido. */
  async function testarVelocidadeIA(modelo) {
    await ollamaPedidoIA({ op: 'gerar', modelo, mensagens: [{ role: 'user', content: 'Responda apenas: ok' }], opcoes: { num_predict: 2 }, tempoMs: 10 * 60000 }); // carrega o modelo
    const r = await ollamaPedidoIA({ op: 'gerar', modelo, tempoMs: 10 * 60000, opcoes: { num_predict: 120, num_ctx: 4096, temperature: 0.2 },
      mensagens: [{ role: 'user', content: 'Resuma em três frases, em português formal:\n\n' + TEXTO_TESTE_IA.repeat(6) }] });
    if (!r || !r.ok) throw new Error((r && r.erro) || 'A IA local não respondeu ao teste.');
    const m = r.metricas || {};
    const ler = m.prompt_eval_duration ? m.prompt_eval_count / (m.prompt_eval_duration / 1e9) : null;
    const escrever = m.eval_duration ? m.eval_count / (m.eval_duration / 1e9) : null;
    const res = { modelo, ler_tps: ler ? Math.round(ler * 10) / 10 : null, escrever_tps: escrever ? Math.round(escrever * 10) / 10 : null, em: new Date().toISOString() };
    await guardarLocalIA('ia_velocidade', res);
    return res;
  }

  /** Estimativa de tempo (em segundos) para a IA local ler `caracteres` e escrever `tokensSaida`. */
  function estimarTempoIA(vel, caracteres, tokensSaida = 900) {
    if (!vel || !vel.ler_tps || !vel.escrever_tps) return null;
    const tokensEntrada = caracteres / 3.6;              // português: ~3,6 caracteres por token
    const partes = Math.max(1, Math.ceil(tokensEntrada / 5000));
    const saida = tokensSaida + (partes > 1 ? partes * 350 : 0);   // resumos parciais + consolidação
    return Math.round(tokensEntrada / vel.ler_tps + saida / vel.escrever_tps + partes * 4);
  }
  function textoDuracaoIA(seg) {
    if (seg == null) return '—';
    if (seg < 90) return `cerca de ${Math.max(10, Math.round(seg / 10) * 10)} segundos`;
    const min = Math.round(seg / 60);
    return min < 90 ? `cerca de ${min} minuto${min === 1 ? '' : 's'}` : `cerca de ${(min / 60).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} horas`;

      'echo Liberando o SEI Monitor para usar a IA local (Ollama)...',
      'setx OLLAMA_ORIGINS "chrome-extension://*,http://127.0.0.1,https://dgmcg.github.io,https://dgmcg.com.br,https://www.dgmcg.com.br" >nul',
      'taskkill /IM "ollama app.exe" /F >nul 2>&1',
      'taskkill /IM "ollama.exe" /F >nul 2>&1',
      'timeout /t 2 >nul',
      'if exist "%LOCALAPPDATA%\\Programs\\Ollama\\ollama app.exe" start "" "%LOCALAPPDATA%\\Programs\\Ollama\\ollama app.exe"',
      'echo.',

  // "usar só a IA local" marcado ou quando o limite da IA online acaba, usa a IA local

  // Depende de: api, escFD, ollamaDisponivelIA, ollamaPedidoIA, lerLocalIA, abrirConfigIA,

  const historicoChatIA = [];

  function formatarRespostaChatIA(t) {
    let h = escFD(String(t || '').trim());
    h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    h = h.replace(/(\d{5,10}\.\d{6}\/\d{4}-\d{2})/g, '<a href="#" class="chat-sei" data-chat-sei="$1">$1</a>');
    h = h.replace(/^\s*[-*•]\s+(.+)$/gm, '<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
    h = h.replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>');
    return h.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>').replace(/<\/li><br>/g, '</li>').replace(/<ul><br>/g, '<ul>');
  }

  async function chatPelaIALocalIA(historico, aoStatus) {
    if (!(await ollamaDisponivelIA())) return { erro: 'A IA local não está disponível aqui.' };
    const diag = await ollamaPedidoIA({ op: 'diagnosticar' });
    const modelo = await lerLocalIA('ia_ollama_modelo');
    if (!diag || diag.estado !== 'pronto' || !modelo) return { erro: 'A IA local não está pronta neste computador (veja a Configuração de IA).' };
    const def = await api('ia-chat/ferramentas');
    if (!def || !def.ok) return { erro: 'Não consegui carregar as consultas do sistema: ' + ((def && def.erro) || '') };
    const msgs = [{ role: 'system', content: def.sistema }, ...historico.slice(-8)];
    const consultas = [];
    for (let volta = 0; volta < 5; volta++) {
      aoStatus(volta ? `IA local analisando os dados (${consultas.join(', ')})...` : 'IA local pensando...');
      const r = await ollamaPedidoIA({ op: 'gerar', modelo, mensagens: msgs, ferramentas: def.ferramentas, opcoes: { num_ctx: 8192, temperature: 0.1 }, tempoMs: 15 * 60000 });
      if (!r || !r.ok) return { erro: (r && r.erro) || 'A IA local não respondeu.' };
      const m = r.mensagem || {};
      const chamadas = m.tool_calls || [];
      if (!chamadas.length) return { resposta: m.content || r.texto || '', consultas, provedor: 'local', modelo };
      msgs.push({ role: 'assistant', content: m.content || '', tool_calls: chamadas });
      for (const c of chamadas) {
        const nome = c.function?.name; consultas.push(nome);
        let args = c.function?.arguments || {}; if (typeof args === 'string') { try { args = JSON.parse(args); } catch (e) { args = {}; } }
        const res = await api('ia-chat/ferramenta', { nome, args });
        msgs.push({ role: 'tool', tool_name: nome, content: JSON.stringify(res && res.ok ? res.resultado : { erro: (res && res.erro) || 'falha' }).slice(0, 6000) });
      }
    }
    return { erro: 'A IA local fez consultas demais sem chegar a uma resposta. Reformule a pergunta.' };
  }

        <div class="chat-cab"><div><b>Assistente SEI Monitor</b><div class="chat-sub" id="chat-ia-modo">pergunte sobre processos, etapas e fluxos</div></div>
          <div><button class="chat-ic" id="chat-ia-limpar" title="Nova conversa">🗑</button><button class="chat-ic" id="chat-ia-cfg" title="Configuração de IA">⚙</button><button class="chat-ic" id="chat-ia-fechar" title="Fechar">✕</button></div></div>
        <div class="chat-msgs" id="chat-ia-msgs">
          <div class="chat-msg chat-ia">Olá! Posso responder com os dados do SEI Monitor. Exemplos:<ul><li>Quais processos estão em stand-by?</li><li>Quantos aditivos estão aguardando parecer da CTAI?</li><li>Qual a situação do processo 2300002754.000074/2026-74?</li><li>Quanto há de orçamento empenhado este ano?</li></ul><small>Respondo só com o que estiver no sistema.</small></div>
        </div>
        <div class="chat-pe"><textarea id="chat-ia-texto" rows="2" placeholder="Escreva sua pergunta..."></textarea><button id="chat-ia-enviar" title="Enviar">➤</button></div>
      </div>`;
    while (wrap.firstElementChild) raizChat.appendChild(wrap.firstElementChild);
    const $ = (id) => raizChat.querySelector('#' + id);
    const janela = $('chat-ia-janela'), msgs = $('chat-ia-msgs'), texto = $('chat-ia-texto');
    const rolar = () => { msgs.scrollTop = msgs.scrollHeight; };
    const adicionar = (cls, html) => { const d = document.createElement('div'); d.className = 'chat-msg ' + cls; d.innerHTML = html; msgs.appendChild(d); rolar(); return d; };
    $('chat-ia-bolha').onclick = () => { janela.hidden = !janela.hidden; if (!janela.hidden) texto.focus(); };
    $('chat-ia-fechar').onclick = () => { janela.hidden = true; };
    $('chat-ia-cfg').onclick = () => abrirConfigIA();
    $('chat-ia-limpar').onclick = () => { historicoChatIA.length = 0; msgs.querySelectorAll('.chat-msg:not(:first-child)').forEach((m) => m.remove()); };
    msgs.addEventListener('click', (e) => { const a = e.target.closest('[data-chat-sei]'); if (a) { e.preventDefault(); abrirProcessoChatIA(a.dataset.chatSei); } });
    const enviar = async () => {
      const pergunta = texto.value.trim();
      if (!pergunta || _chatOcupadoIA) return;
      _chatOcupadoIA = true; texto.value = '';
      adicionar('chat-eu', escFD(pergunta).replace(/\n/g, '<br>'));
      historicoChatIA.push({ role: 'user', content: pergunta });
      const st = adicionar('chat-ia chat-pensando', '<span class="spinner"></span> Consultando os dados...');
      const status = (t) => { st.innerHTML = '<span class="spinner"></span> ' + escFD(t); };
      let r = null, aviso = '';
      try {
        const cfg = await api('ia/config');
        const soLocal = cfg && cfg.ok && cfg.so_ollama_chat;
        if (!soLocal) {
          status('Consultando os dados...');
          let on = null;
          try { on = await api('ia-chat/chat', { mensagens: historicoChatIA }); } catch (e) { on = { ok: false, erro: e.message }; }
          if (on && on.ok && on.sem_chave) aviso = 'Você ainda não cadastrou uma chave de IA online; respondendo com a IA local.';
          else if (on && on.ok && on.limite) aviso = 'O limite da IA online acabou por agora; respondendo com a IA local.';
          else if (on && on.ok && on.chave_invalida) r = { erro: on.erro, semFallback: true };
          else if (on && on.ok && !on.erro) r = on;
          else aviso = 'A IA online não respondeu (' + ((on && on.erro) || 'sem resposta') + '); respondendo com a IA local.';
        } else aviso = 'Configurado para usar só a IA local.';
        if (!r) {
          if (aviso) adicionar('chat-aviso', 'ℹ ' + escFD(aviso));
          r = await chatPelaIALocalIA(historicoChatIA, status);
          if (r.erro) r.erro = 'A IA local também não respondeu: ' + r.erro;
        }
      } catch (e) { r = { erro: e.message }; }
      st.remove();
      if (r.erro) {
        adicionar('chat-ia chat-erro', '⚠ ' + escFD(r.erro));
        historicoChatIA.pop();
      } else {
        const origem = r.provedor === 'local' ? `IA local (${r.modelo})` : ({ groq: 'Groq', openai: 'OpenAI', anthropic: 'Claude', gemini: 'Gemini' }[r.provedor] || 'IA online');
        adicionar('chat-ia', formatarRespostaChatIA(r.resposta) + `<div class="chat-meta">${escFD(origem)}${r.consultas && r.consultas.length ? ' · consultou: ' + escFD([...new Set(r.consultas)].join(', ')) : ' · não consultou o banco'}</div>`);
        historicoChatIA.push({ role: 'assistant', content: r.resposta });
      }
      _chatOcupadoIA = false;
    };
    $('chat-ia-enviar').onclick = enviar;
    texto.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
  }

  async function motorRelatorioExt() {
    if (typeof SeiRelatorio !== 'undefined') return SeiRelatorio;
    if (typeof carregarMotorRelatorioSite === 'function') return carregarMotorRelatorioSite();

  /**
   * Janela "Gerar relatório geral": variáveis à esquerda (várias opções por grupo: todas, algumas ou uma),
   * prévia do relatório à direita atualizando a cada escolha, e os botões de download (Word / PDF).
   */
  async function abrirRelatorioGeralExt(painelCache, tipoInicial, preset) {
    let dados = painelCache;
    const modal = abrirModalRelExt('<h3>Relatório geral</h3><div class="text-muted"><span class="spinner"></span> Carregando dados...</div>');
    try {
      const r = await api('painel/geral');
      if (r && r.ok) dados = r;
    } catch (e) { /* usa o que já estava carregado */ }
    const erro = (msg) => {
      modal.innerHTML = `<h3>Relatório geral</h3><div class="pg-aviso">${msg}</div><div class="sm-modal-actions modal-actions"><button class="btn btn-secondary" data-rel="fechar">Fechar</button></div>`;
      modal.querySelector('[data-rel="fechar"]').onclick = fecharModalRelExt;
    };
    if (!dados || !dados.ok) { erro('Não consegui carregar os dados do painel. Confirme que a API foi atualizada.'); return; }
    let M;
    try { M = await motorRelatorioExt(); } catch (e) { erro(escHtmlSite(e.message)); return; }

    const O = M.opcoesRelatorioGeral(dados);
    const TOTAL = dados.processos.length;
    const GRUPOS = [
      { id: 'situacoes', tit: 'Situação', aberto: true },
      { id: 'tipos', tit: 'Tipo de processo', aberto: true },
      { id: 'subtipos', tit: 'Subtipo', aberto: true },
      { id: 'unidades', tit: 'Unidade', busca: true },
      { id: 'osss', tit: 'OSS', busca: true },
      { id: 'impactos', tit: 'Impacto financeiro' },
      { id: 'estagios', tit: 'Etapa do orçamento' },
      { id: 'naturezas', tit: 'Natureza do aditivo' },
      { id: 'prioridades', tit: 'Prioridade' },
      { id: 'anos', tit: 'Ano de início' },
      { id: 'standby', tit: 'Stand-by', aberto: !!(preset && preset.standby) },
      { id: 'favoritos', tit: 'Meus favoritos' },
    ];
    // Estado: tudo marcado, exceto situação (Suspensos fora) e tipo (se veio de um filtro do painel).
    const marcados = {};
    GRUPOS.forEach((g) => { marcados[g.id] = new Set(O[g.id].map((x) => x.valor)); });
    marcados.situacoes.delete('suspenso');
    if (tipoInicial && marcados.tipos.has(tipoInicial)) marcados.tipos = new Set([tipoInicial]);
    if (preset && preset.standby) { marcados.standby = new Set(['sim']); marcados.situacoes = new Set(['andamento', 'concluido', 'suspenso']); }
    const secoes = preset && preset.standby
      ? { tipo: false, subtipo: false, unidade: false, oss: false, financeiro: false, standby: true, lista: false }
      : { tipo: true, subtipo: false, unidade: false, oss: false, financeiro: true, standby: true, lista: true };
    const SECOES = [['tipo', 'Resumo por tipo'], ['subtipo', 'Resumo por subtipo'], ['unidade', 'Resumo por unidade'], ['oss', 'Resumo por OSS'], ['financeiro', 'Impacto financeiro'], ['standby', 'Processos em stand-by (pendências)'], ['lista', 'Lista de processos']];

    const opcoesVisiveis = (g) => (g === 'subtipos' ? O.subtipos.filter((s) => marcados.tipos.has(s.tipo)) : O[g]);
    /** Todas marcadas = sem filtro; nenhuma = nada passa; senão, só as marcadas. */
    const valoresDe = (g) => {
      const vis = opcoesVisiveis(g);
      const sel = vis.filter((x) => marcados[g].has(x.valor)).map((x) => x.valor);
      if (sel.length === vis.length) return g === 'situacoes' ? sel : [];
      return sel.length ? sel : ['__nenhum__'];
    };
    const montarOp = (formato) => ({
      situacoes: valoresDe('situacoes').filter((v) => v !== '__nenhum__'),
      tipos: valoresDe('tipos'), subtipos: valoresDe('subtipos'), unidades: valoresDe('unidades'), osss: valoresDe('osss'),
      impactos: valoresDe('impactos'), estagios: valoresDe('estagios'), naturezas: valoresDe('naturezas'),
      prioridades: valoresDe('prioridades'), anos: valoresDe('anos'), standby: valoresDe('standby'), favoritos: valoresDe('favoritos'), secoes: { ...secoes }, formato,
    });

    const htmlGrupo = (g) => {
      const vis = opcoesVisiveis(g.id);
      let itens;
      if (g.id === 'subtipos') {
        if (!vis.length) itens = '<div class="rel-vazio">Marque ao menos um tipo.</div>';
        else {
          let atual = null; itens = '';
          vis.forEach((s) => {
            if (s.tipo !== atual) { atual = s.tipo; itens += `<div class="rel-sub-tipo">${escHtmlSite(atual)}</div>`; }
            itens += `<label class="rel-ck" data-txt="${escHtmlSite(s.rotulo.toLowerCase())}"><input type="checkbox" data-g="${g.id}" value="${escHtmlSite(s.valor)}" ${marcados[g.id].has(s.valor) ? 'checked' : ''}> <span>${escHtmlSite(s.rotulo)}</span><em>${s.qtd}</em></label>`;
          });
        }
      } else {
        itens = vis.map((x) => `<label class="rel-ck" data-txt="${escHtmlSite(String(x.rotulo).toLowerCase())}"><input type="checkbox" data-g="${g.id}" value="${escHtmlSite(x.valor)}" ${marcados[g.id].has(x.valor) ? 'checked' : ''}> <span>${escHtmlSite(x.rotulo)}</span><em>${x.qtd}</em></label>`).join('');
      }
      const n = vis.filter((x) => marcados[g.id].has(x.valor)).length;
      return `<details class="rel-grp" data-grp="${g.id}" ${g.aberto ? 'open' : ''}>
        <summary>${g.tit} <small data-cont="${g.id}">${n === vis.length ? 'todos' : n + ' de ' + vis.length}</small></summary>
        <div class="rel-acoes"><a href="#" data-todos="${g.id}">Marcar todos</a><a href="#" data-nenhum="${g.id}">Limpar</a></div>
        ${g.busca && vis.length > 8 ? `<input class="rel-busca" data-busca="${g.id}" placeholder="Buscar...">` : ''}
        <div class="rel-lista">${itens}</div>
      </details>`;
    };
    const htmlSecoes = `<details class="rel-grp" open><summary>O que mostrar no relatório</summary><div class="rel-lista">${SECOES.map(([k, r]) => `<label class="rel-ck"><input type="checkbox" data-sec="${k}" ${secoes[k] ? 'checked' : ''}> <span>${r}</span></label>`).join('')}</div></details>`;

    modal.classList.add('rel-largo');
    modal.innerHTML = `
      <div class="rel-cab"><h3>Gerar relatório geral</h3><div><span class="rel-contagem" id="rel-contagem"></span> <button class="btn btn-secondary" data-rel="fechar" style="padding:4px 10px;">✕</button></div></div>
      <div class="rel-duas">
        <div class="rel-esq" id="rel-esq">${GRUPOS.map(htmlGrupo).join('')}${htmlSecoes}</div>
        <div class="rel-dir"><div class="rel-folha" id="rel-previa"></div></div>
      </div>
      <div class="rel-pe">
        <div class="pg-dica" id="rel-status" style="flex:1;margin:0;">A prévia ao lado muda conforme você marca as opções. Só entra o que estiver marcado.</div>
        <button class="btn btn-secondary" data-rel="pdf">⬇ PDF</button>
        <button class="btn" data-rel="docx">⬇ Word (.docx)</button>
      </div>`;
    const q = (n) => modal.querySelector(`[data-rel="${n}"]`);
    const status = (t) => { modal.querySelector('#rel-status').textContent = t || ''; };
    q('fechar').onclick = fecharModalRelExt;

    let tempo = null;
    const atualizarPrevia = () => {
      const op = montarOp('docx');
      const pr = M.previaRelatorioGeral(dados, op);
      modal.querySelector('#rel-previa').innerHTML = pr.html;
      modal.querySelector('#rel-contagem').textContent = `${pr.total} de ${TOTAL} processos`;
      ['docx', 'pdf'].forEach((f) => { q(f).disabled = !pr.total; });
    };
    const agendar = () => { clearTimeout(tempo); tempo = setTimeout(atualizarPrevia, 80); };
    const redesenharGrupo = (id) => {
      const det = modal.querySelector(`[data-grp="${id}"]`); const aberto = det.open;
      const g = GRUPOS.find((x) => x.id === id);
      const tmp = document.createElement('div'); tmp.innerHTML = htmlGrupo({ ...g, aberto });
      det.replaceWith(tmp.firstElementChild);
    };
    const atualizarContador = (id) => {
      const vis = opcoesVisiveis(id); const n = vis.filter((x) => marcados[id].has(x.valor)).length;
      const el = modal.querySelector(`[data-cont="${id}"]`); if (el) el.textContent = n === vis.length ? 'todos' : n + ' de ' + vis.length;
    };

    const esq = modal.querySelector('#rel-esq');
    esq.addEventListener('change', (ev) => {
      const t = ev.target;
      if (t.dataset.sec) { secoes[t.dataset.sec] = t.checked; agendar(); return; }
      const g = t.dataset.g; if (!g) return;
      if (t.checked) marcados[g].add(t.value); else marcados[g].delete(t.value);
      atualizarContador(g);
      if (g === 'tipos') redesenharGrupo('subtipos');
      agendar();
    });
    esq.addEventListener('click', (ev) => {
      const a = ev.target.closest('a[data-todos],a[data-nenhum]'); if (!a) return;
      ev.preventDefault();
      const id = a.dataset.todos || a.dataset.nenhum; const marcar = !!a.dataset.todos;
      opcoesVisiveis(id).forEach((x) => { if (marcar) marcados[id].add(x.valor); else marcados[id].delete(x.valor); });
      redesenharGrupo(id);
      if (id === 'tipos') { O.subtipos.forEach((s) => { if (marcar) marcados.subtipos.add(s.valor); }); redesenharGrupo('subtipos'); }
      agendar();
    });
    esq.addEventListener('input', (ev) => {
      const b = ev.target.dataset.busca; if (!b) return;
      const termo = ev.target.value.toLowerCase().trim();
      modal.querySelectorAll(`[data-grp="${b}"] .rel-ck`).forEach((l) => { l.style.display = !termo || l.dataset.txt.includes(termo) ? '' : 'none'; });
    });

    ['docx', 'pdf'].forEach((f) => {
      q(f).onclick = async (ev) => {
        const btn = ev.currentTarget; btn.disabled = true; status('Montando o arquivo…');
        try {
          const res = await M.gerarRelatorioGeral(dados, montarOp(f));
          M.baixarBlob(res.blob, res.nome);
          status(`Pronto: ${res.nome} (${res.total} processo${res.total === 1 ? '' : 's'}).`);
        } catch (e) { status('Erro ao gerar: ' + e.message); } finally { btn.disabled = false; }
      };
    });
    atualizarPrevia();
  }

  // Adaptadores das janelas de relatório e carregamento sob demanda do gerador (relatorio.js, na mesma pasta do site).
  function abrirModalRelExt(html) { abrirModal(html); return document.querySelector('#modal-overlay .modal'); }
  function fecharModalRelExt() { fecharModal(); }
  let _motorRelatorioPromessa = null;
  function carregarMotorRelatorioSite() {
    if (typeof SeiRelatorio !== 'undefined') return Promise.resolve(SeiRelatorio);
    if (!_motorRelatorioPromessa) {
      _motorRelatorioPromessa = new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = 'relatorio.js?v=7';
        sc.onload = () => resolve(SeiRelatorio);
        sc.onerror = () => { _motorRelatorioPromessa = null; reject(new Error('Não encontrei o arquivo relatorio.js ao lado do index.html do site.')); };
        document.head.appendChild(sc);
      });
    }
    return _motorRelatorioPromessa;
  }
  function abrirRelatorioProcessoSite() { abrirRelatorioProcessoExt(processoAtualObj, etapasAtuais, conexoesAtuais); }

  function escHtmlSite(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function baixarTextoSite(nome, texto) {
    const blob = new Blob(['\ufeff' + texto], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  let _painelSiteDados = null, _painelSiteUltimo = null;

    const box = document.getElementById('painel-geral-site');
    if (!box) return;
    const [resPainel, resUltimo] = await Promise.all([
      api('painel/geral').catch((e) => ({ ok: false, erro: e.message })),

  // O painel acompanha o filtro de tipo já existente (botões abaixo da barra de status).

    let ativos = todosProcessos.filter((p) => STATUS_ATIVOS.includes(p.status));
    if (filtroTipo) ativos = ativos.filter((p) => (nomeTipoProcesso(p) || 'Sem tipo definido') === filtroTipo);
    ativos.forEach((p) => {
      p._proxima = proximaVerificacao(p);
      const diffMs = p._proxima ? p._proxima.getTime() - Date.now() : null;
      p._estadoAlerta = diffMs === null ? 'normal' : (diffMs <= 0 ? 'atrasado' : (diffMs <= 15 * 60000 ? 'proximo' : 'normal'));
    });
    box.innerHTML = htmlPainelCompletoExt(_painelSiteDados, _painelSiteUltimo, ativos, filtro);

  function renderResumoVisual() {
    const box = document.getElementById('resumo-visual');
    if (!todosProcessos.length) { box.innerHTML = ''; return; }

    // contagem por status, na ordem fixa que faz sentido operacionalmente
    const ordemStatus = ['Em andamento', 'Aguardando', 'Concluído', 'Suspenso'];
    const porStatus = {};
    ordemStatus.forEach(s => porStatus[s] = 0);
    todosProcessos.forEach(p => { porStatus[p.status] = (porStatus[p.status] || 0) + 1; });

    const total = todosProcessos.length;
    const segmentos = ordemStatus.filter(s => porStatus[s] > 0).map(s => {
      const pct = (porStatus[s] / total * 100).toFixed(1);
      const inativo = filtroStatus && filtroStatus !== s;
      return `<div class="status-seg ${inativo ? 'inativo' : ''}" style="width:${pct}%;background:${CORES_STATUS[s] || '#94a3b8'}"
        onclick="alternarFiltroStatus('${s}')" title="${s}: ${porStatus[s]}">${porStatus[s] > 1 ? porStatus[s] : ''}</div>`;
    }).join('');

    const legenda = ordemStatus.filter(s => porStatus[s] > 0).map(s => `
      <div class="legenda-item ${filtroStatus === s ? 'ativo' : ''}" onclick="alternarFiltroStatus('${s}')">
        <span class="legenda-dot" style="background:${CORES_STATUS[s]}"></span> ${s} (${porStatus[s]})
      </div>`).join('');

    // contagem por tipo (agrupando pelo nome já resolvido via subtipo, quando houver)
    const porTipo = {};
    todosProcessos.forEach(p => {
      const t = nomeTipoProcesso(p) || 'Sem tipo definido';
      porTipo[t] = (porTipo[t] || 0) + 1;
    });
    const tiposOrdenados = Object.entries(porTipo).sort((a, b) => b[1] - a[1]);
    const chips = tiposOrdenados.map(([t, qtd]) => `
      <div class="tipo-chip ${filtroTipo === t ? 'ativo' : ''}" onclick="alternarFiltroTipo('${t.replace(/'/g, "\\'")}')">
        ${t} <span class="qtd">${qtd}</span>
      </div>`).join('');

    const temFiltro = filtroStatus || filtroTipo;

    box.innerHTML = `
      <div class="resumo-box">
        <div class="resumo-topo">
          <div class="resumo-total"><b>${total}</b> processo${total > 1 ? 's' : ''} monitorado${total > 1 ? 's' : ''}</div>
          <div class="resumo-limpar" style="display:${temFiltro ? 'inline' : 'none'}" onclick="limparFiltros()">Limpar filtro</div>
        </div>
        <div class="status-bar">${segmentos}</div>
        <div class="status-legenda">${legenda}</div>
        <div class="tipo-chips">${chips}</div>
      </div>`;
  }

  function alternarFiltroStatus(status) {

  function alternarFiltroTipo(tipo) {
    filtroTipo = (filtroTipo === tipo) ? null : tipo;
    renderResumoVisual();
    renderListaFiltrada();
    renderPainelSite();

    filtroStatus = null; filtroTipo = null;

  // ==================== EXCLUIR PROCESSO ====================
  // Tira o processo do acompanhamento do SEI Monitor (documentos, andamentos
  // e anotações registrados aqui são apagados junto — cascata no banco). O
  // processo em si, no SEI, não é afetado. aoConcluir recarrega a tela certa
  // depois (a lista, se excluído de lá; a lista também ao excluir de dentro
  // do processo, já que ele deixou de existir).

      </p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-danger" onclick="executarExclusaoProcesso('${sei}')">Excluir</button>
      </div>
    `);

  async function executarExclusaoProcesso(sei) {
    const r = await api('processos/excluir', { numero_sei: sei });

  function renderListaFiltrada() {
    pararAtualizacaoVivoSite();
    const el = document.getElementById('lista-processos');

    // Regra de prazo/alerta só vale pra "Aguardando"/"Em andamento" — os
    // demais são processos finalizados e vivem numa aba própria, sem SLA.
    const todosAtivos = todosProcessos.filter(p => STATUS_ATIVOS.includes(p.status));
    const todosFinalizados = todosProcessos.filter(p => !STATUS_ATIVOS.includes(p.status));

    let baseLista = abaListaAtiva === 'ativos' ? todosAtivos : todosFinalizados;
    if (filtroStatus) baseLista = baseLista.filter(p => p.status === filtroStatus);
    if (filtroTipo) baseLista = baseLista.filter(p => (nomeTipoProcesso(p) || 'Sem tipo definido') === filtroTipo);
    const filtrosMarcaHtml = htmlFiltrosMarcaSB(baseLista, filtroMarcaSite, `onclick="alternarFiltroMarcaSite('fav')"`, `onclick="alternarFiltroMarcaSite('standby')"`);
    baseLista = aplicarFiltroMarcaSB(baseLista, filtroMarcaSite);

    let calendarioHtml = '';
    if (abaListaAtiva === 'ativos') {
      todosAtivos.forEach(p => {
        p._proxima = proximaVerificacao(p);
        const diffMs = p._proxima ? p._proxima.getTime() - Date.now() : null;
        p._estadoAlerta = diffMs === null ? 'normal' : (diffMs <= 0 ? 'atrasado' : (diffMs <= 15 * 60000 ? 'proximo' : 'normal'));
      });
      baseLista.sort((a, b) => (a._proxima ? a._proxima.getTime() : Infinity) - (b._proxima ? b._proxima.getTime() : Infinity));
      _diasCalendarioAtual = construirCalendarioSemana(todosAtivos);
      if (todosAtivos.length) {
        const atrasadosCal = todosAtivos.filter(p => p._estadoAlerta === 'atrasado' && p._proxima).sort((a, b) => a._proxima - b._proxima);
        calendarioHtml = htmlCalendario(_diasCalendarioAtual, atrasadosCal);
      }
    }

    const tabsHtml = `
      <div class="lista-tabs">
        <button class="lista-tab-btn ${abaListaAtiva === 'ativos' ? 'ativa' : ''}" onclick="alternarAbaLista('ativos')">Em acompanhamento (${todosAtivos.length})</button>
        <button class="lista-tab-btn ${abaListaAtiva === 'finalizados' ? 'ativa' : ''}" onclick="alternarAbaLista('finalizados')">Finalizados (${todosFinalizados.length})</button>
      </div>` + filtrosMarcaHtml;

    if (!baseLista.length) {
      el.innerHTML = tabsHtml + calendarioHtml + '<div class="text-muted">Nenhum processo com esse filtro.</div>';
      return;
    }

    el.innerHTML = `
      ${tabsHtml}
      ${calendarioHtml}
      <div class="proc-list">
        ${baseLista.map(p => htmlCardProcesso(p, abaListaAtiva === 'ativos')).join('')}
      </div>`;

    el.querySelectorAll('select.badge-select').forEach((sel) => {
      sel.addEventListener('change', (e) => { e.stopPropagation(); alterarCampoLista(sel); });
    });

    // Atualiza contador/pulsação a cada minuto sem recarregar a lista inteira.
    if (abaListaAtiva === 'ativos' && baseLista.length) {
      _intervaloVivoSite = setInterval(() => {
        document.querySelectorAll('[data-sei-card]').forEach(card => {
          const proximaStr = card.dataset.proxima;
          if (!proximaStr) return;
          const proxima = new Date(proximaStr);
          const diffMs = proxima.getTime() - Date.now();
          const atrasado = diffMs <= 0;
          const proximo = !atrasado && diffMs <= 15 * 60000;
          card.classList.toggle('sm-alerta-atrasado', atrasado);
          card.classList.toggle('sm-alerta-proximo', proximo);
          const elCountdown = card.querySelector('[data-countdown-sei]');
          if (elCountdown) {
            elCountdown.style.color = atrasado ? '#dc2626' : 'var(--muted)';
            elCountdown.textContent = atrasado ? `⏱ Atrasado há ${formatarDuracao(diffMs)}` : `⏱ Próxima verificação em ${formatarDuracao(diffMs)}`;
          }
        });
      }, 60000);
    }
  }

  // Muda prioridade/status direto na lista, sem abrir o processo — atualiza

  async function alterarCampoLista(sel) {
    const sei = sel.dataset.sei;
    const campo = sel.dataset.campo;
    const valor = sel.value;
    sel.className = campo === 'status' ? 'badge-select badge-status' : `badge-select badge-${valor}`;
    const r = await api('processos/atualizar', { numero_sei: sei, [campo]: valor });

    const p = todosProcessos.find(x => x.numero_sei === sei);
    if (p) p[campo] = valor;
    renderResumoVisual();
    renderListaFiltrada();
  }

  function montarContextoTexto(ctx, similares) {
    let txt = 'CONTEXTO DO SISTEMA — não infira, use como fato:\n\n';
    txt += `Tipo do processo: ${ctx.tipo_nome || '—'}${ctx.subtipo_nome ? ' — ' + ctx.subtipo_nome : ''}\n`;
    if (ctx.etapas && ctx.etapas.length) {
      txt += `\nEtapas do fluxo esperado para este subtipo (na ordem):\n`;
      ctx.etapas.forEach((e, i) => {
        txt += `${i + 1}. ${e.tipo === 'gateway' ? '[decisão] ' : ''}${e.nome_exibicao}\n`;
      });
    }
    if (similares && similares.length) {
      txt += `\nResumos de processos semelhantes já documentados:\n`;
      similares.forEach((s) => {
        const r = s.resumo_estruturado || {};
        txt += `\n— Processo ${s.numero_sei} (${s.titulo}):\n`;
        if (r.resumo_geral) txt += `  Resumo: ${r.resumo_geral}\n`;
        if (r.pontos_criticos && r.pontos_criticos.length) txt += `  Pontos críticos observados: ${r.pontos_criticos.join(' | ')}\n`;
        if (r.sugestoes_acao && r.sugestoes_acao.length) txt += `  Sugestões que foram dadas: ${r.sugestoes_acao.join(' | ')}\n`;
      });
    }
    return txt;
  }

  const PROMPT_ANALISE_FLUXO = `Você é um analista de processos experiente, especializado em processos administrativos do SEI (Sistema Eletrônico de Informações), no contexto da gestão de contratos de gestão com Organizações Sociais de Saúde (OSS) na Secretaria de Saúde de Pernambuco.

FONTES ANEXADAS:
(1) um arquivo com o histórico completo deste processo: PARTE 1 — andamentos (movimentações), em ordem cronológica; PARTE 2 — texto integral dos documentos, na ordem do processo;
(2) a legislação e as normas aplicáveis.

OBJETIVO: analisar este processo como um analista faria e me entregar (a) o passo a passo do que ocorreu, (b) o que deveria acontecer, com as etapas, (c) o fluxo desenhado no formato do meu sistema e (d) a regularidade do fluxo e de cada etapa em relação à legislação. Eu já posso ter desenhado este fluxo no sistema e posso ter esquecido alguma etapa importante — por isso a comparação com o fluxo cadastrado é parte central do trabalho. Este material é só de leitura e apoio: quem decide e desenha sou eu. Não gere JSON nem formato de importação.

COMO O FLUXO É DESENHADO NO SISTEMA (siga exatamente este formato):
- O fluxo é um conjunto de ETAPAS e CONEXÕES.
- Cada ETAPA é um TIPO DE DOCUMENTO escolhido da lista de tipos de documento do CONTEXTO DO SISTEMA acima (não é texto livre). Uma etapa pode ter um "Detalhes" (dica curta) e pode marcar "Ao concluir, exigir": Nº do documento no SEI e/ou Valor em R$. A etapa também pode ser descrita por: VARIAÇÃO do tipo de documento (ex.: tipo "Nota Técnica" + variação "Assistencial" = "Nota Técnica Assistencial" — a variação é cadastrada à parte e o catálogo de tipos de documento não recebe variantes), SETOR(ES) RESPONSÁVEL(IS) por gerar o documento (da lista de setores do CONTEXTO DO SISTEMA; pode haver mais de um) e IMPORTÂNCIA (uma frase sobre por que a etapa importa).
- Um GATEWAY é um ponto de decisão e tem apenas uma PERGUNTA (ex.: "Terá impacto financeiro?").
- Cada CONEXÃO liga um "De" a um "Para". O primeiro passo parte de "— Início —". O "Rótulo" é a resposta que leva por aquele caminho e só existe quando o "De" é um gateway (ex.: "Sim" / "Não"). Duas conexões saindo da mesma etapa, sem rótulo, significam caminhos paralelos.

REGRAS:
- Use somente o que está nas fontes. Não invente fatos, datas, números de documentos, nomes ou dispositivos legais.
- Ao dizer o que "deve acontecer", baseie-se nas normas anexadas e cite norma + artigo/inciso apenas quando localizar o dispositivo nelas. O que decorrer de prática usual e não de norma anexada deve vir marcado como "prática usual — sem fundamento nas fontes anexadas". Se a questão não for coberta pelas normas, escreva "Não localizei fundamento nas fontes anexadas".
- No tipo de documento de cada etapa, copie o nome exatamente como está na lista do CONTEXTO DO SISTEMA. Se nenhum servir, escreva "NOVO: <nome sugerido>". Variantes de um mesmo tipo (ex.: Nota Técnica Assistencial, Nota Técnica Financeira) NÃO são tipos novos: use o tipo da lista e indique a variação, preferindo uma das já cadastradas no CONTEXTO DO SISTEMA; se nenhuma servir, escreva "VARIAÇÃO NOVA: <nome sugerido>". Para o setor, use os nomes da lista de setores do CONTEXTO DO SISTEMA (e as siglas das unidades que aparecem nos andamentos); se o setor não estiver na lista, escreva "SETOR NOVO: <sigla>".
- Cada etapa corresponde a um documento; não crie etapa para andamento que não gerou documento. Se o mesmo tipo de documento aparece mais de uma vez com papéis diferentes, crie etapas separadas e diferencie no "Detalhes".
- Devoluções, exigências e retornos a etapa anterior entram como conexão de volta, marcada "(retorno)".
- Quando um documento estiver ilegível, ausente ou sem texto, ou quando houver andamento sem documento correspondente, diga isso explicitamente — não preencha a lacuna por dedução.
- Sinalize, não sentencie: use "verificar", "há indício de", "aparenta". Evite conclusões categóricas de ilegalidade.
- Seja objetivo; não repita o texto dos documentos.

ESTRUTURA DA RESPOSTA:

1. VISÃO GERAL
Do que trata o processo e o tipo e subtipo que melhor o descrevem, escolhidos da lista do CONTEXTO DO SISTEMA (nome exato; se nenhum servir, diga e sugira um). Em 3 a 5 linhas.

2. PASSO A PASSO DO QUE OCORREU
Em ordem cronológica, cruzando andamentos e documentos: data, unidade, ato ou documento e o que foi pedido, informado ou decidido.

3. O QUE DEVE ACONTECER
As etapas que este tipo de processo exige, na ordem devida, com o fundamento de cada uma (conforme as regras acima). Para cada etapa, indique se ocorreu neste processo: sim, não ou parcialmente.

4. FLUXO NO FORMATO DO SISTEMA
O fluxo devido, desenhado como no sistema:
- Etapas (E1, E2...): tipo ETAPA ou GATEWAY; se ETAPA, o tipo de documento (da lista), a Variação (se houver), o(s) Setor(es) responsável(is), a Importância (uma frase, opcional), o Detalhes (opcional) e "Exigir ao concluir" (Nº doc. SEI: sim/não; Valor R$: sim/não — "sim" só quando o documento traz esse dado); se GATEWAY, a pergunta.
- Conexões: uma linha por conexão, "De → Para [Rótulo]", começando por "— Início —".
- Em 3 a 6 linhas, o caminho principal e os desvios (decisões, paralelos e retornos).

5. COMPARAÇÃO COM O FLUXO CADASTRADO
Se o CONTEXTO DO SISTEMA trouxer etapas já cadastradas para este subtipo, compare com o item 4: o que falta no cadastro (principalmente etapas importantes que eu possa ter esquecido), o que sobra e o que diverge (inclusive em variação, setor responsável e importância). Se não houver fluxo cadastrado, diga isso.

6. REGULARIDADE EM RELAÇÃO À LEGISLAÇÃO
Primeiro, um parecer sintético sobre a regularidade do fluxo como um todo. Depois, para cada etapa, classifique: ✅ Regular — nada a observar nas fontes; ⚠️ Ponto de atenção — possível falha formal ou material, ou ausência de algo exigido; ❌ Indício de irregularidade — contraria dispositivo expresso das normas anexadas; ❔ Não verificável — as fontes não permitem concluir. Para as que não forem ✅: o que você observa, o fundamento (conforme as regras acima) e a providência sugerida para sanar.

7. PONTOS EM ABERTO
O que as fontes não permitem determinar e que eu devo conferir no processo.`;

  async function copiarPromptAnaliseFluxo() {
    const [rCtx, rTipos, rSubs, rDocs, rVars, rSets] = await Promise.all([
      api(`processos/contexto-ia?sei=${encodeURIComponent(processoAtualSei)}`),
      api('dados-fixos/listar?categoria=tipo'),
      api('subtipos/listar'),
      api('dados-fixos/listar?categoria=tipo_documento'),
      api('variacoes/listar'),
      api('setores/listar'),
    ]);
    if (!rCtx.ok) { alert('Erro ao montar contexto: ' + rCtx.erro); return; }
    const tiposProcesso = (rTipos.ok && rTipos.itens ? rTipos.itens : []).map(i => i.valor);
    const subtipos = (rSubs.ok && rSubs.subtipos) || [];
    const itensDoc = (rDocs.ok && rDocs.itens) ? rDocs.itens : [];
    const tiposDocumento = itensDoc.map(i => i.valor);
    const variacoesCtx = ((rVars.ok && rVars.variacoes) || [])
      .map(v => ({ tipo: itensDoc.find(d => d.id === v.tipo_documento_id)?.valor || '', nome: v.nome }))
      .filter(v => v.tipo);
    const setoresCtx = ((rSets.ok && rSets.setores) || []).map(x => x.nome);

    let ctx = 'CONTEXTO DO SISTEMA — use como fato, não infira:\n\n';
    ctx += `Processo: ${processoAtualObj.numero_sei}${processoAtualObj.titulo ? ' — ' + processoAtualObj.titulo : ''}\n`;
    ctx += `Tipo/subtipo hoje cadastrado: ${nomeTipoLinha(processoAtualObj) || 'não definido'}\n`;
    if (processoAtualObj.natureza_aditivo) ctx += `Natureza do aditivo: ${rotuloNaturezaAditivo(processoAtualObj.natureza_aditivo)} (${NATUREZAS_ADITIVO_DEF[processoAtualObj.natureza_aditivo].desc})\n`;
    if (rCtx.etapas && rCtx.etapas.length) {
      ctx += '\nEtapas já cadastradas no fluxo deste subtipo (lista, sem as conexões):\n';
      rCtx.etapas.forEach((e, i) => {
        ctx += `${i + 1}. ${e.tipo === 'gateway' ? '[gateway] ' : ''}${e.nome_exibicao}`;
        if (e.tipo !== 'gateway') {
          const extras = [];
          if (e.setores && e.setores.length) extras.push('setor(es): ' + e.setores.join(', '));
          if (e.importancia) extras.push('importância: ' + e.importancia);
          if (extras.length) ctx += ` (${extras.join('; ')})`;
        }
        ctx += '\n';
      });
    } else {
      ctx += '\nEste subtipo ainda não tem fluxo cadastrado (ou o processo ainda não tem subtipo).\n';
    }
    if (tiposProcesso.length) {
      ctx += '\nTipos e subtipos de processo disponíveis no sistema:\n';
      tiposProcesso.forEach(t => {
        const subs = subtipos.filter(s => s.tipos_processo?.nome === t).map(s => s.nome);
        ctx += `- ${t}${subs.length ? ': ' + subs.join('; ') : ' (sem subtipos cadastrados)'}\n`;
      });
    }
    if (tiposDocumento.length) {
      ctx += `\nTipos de documento disponíveis no sistema (é daqui que sai cada etapa): ${tiposDocumento.join('; ')}\n`;
    }
    if (variacoesCtx.length) {
      ctx += '\nVariações já cadastradas por tipo de documento (usadas como "tipo + variação"):\n';
      const porTipo = {};
      variacoesCtx.forEach(v => { (porTipo[v.tipo] = porTipo[v.tipo] || []).push(v.nome); });
      Object.keys(porTipo).forEach(t => { ctx += `- ${t}: ${porTipo[t].join('; ')}\n`; });
    }
    if (setoresCtx.length) {
      ctx += `\nSetores responsáveis cadastrados no sistema: ${setoresCtx.join('; ')}\n`;
    }

    const textoFinal = ctx + '\n\n' + PROMPT_ANALISE_FLUXO;
    try {
      await navigator.clipboard.writeText(textoFinal);
      alert('Prompt copiado! Cole no chat do NotebookLM, depois de anexar como fontes o .txt com andamentos e documentos deste processo (gerado pela extensão) e as leis.');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = textoFinal; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try {
        document.execCommand('copy');
        alert('Prompt copiado! Cole no chat do NotebookLM, depois de anexar como fontes o .txt com andamentos e documentos deste processo (gerado pela extensão) e as leis.');
      } catch {
        alert('Não consegui copiar automaticamente. Abri o console (F12) com o texto pra copiar manualmente.');
        console.log(textoFinal);
      }
      ta.remove();
    }
  }

  async function salvarResumoColado() {

    const limpo = raw.replace(/^```json/i, '').replace(/^```/, '').replace(/```\s*$/, '').trim();
    let obj;
    try { obj = JSON.parse(limpo); }
    catch (e) { erroEl.textContent = 'Não consegui interpretar como JSON — cole exatamente o bloco que a IA gerou.'; return; }
    const r = await api('processos/salvar-resumo', { numero_sei: processoAtualSei, resumo_estruturado: obj });
    if (!r.ok) { erroEl.textContent = 'Erro ao salvar: ' + r.erro; return; }
    processoAtualObj = r.processo;
    document.getElementById('secao-resumo-processo').innerHTML = htmlCardResumo(r.processo);
    const situEl = document.querySelector('.situacao-box');
    if (situEl && r.processo.situacao_atual) situEl.textContent = r.processo.situacao_atual;
